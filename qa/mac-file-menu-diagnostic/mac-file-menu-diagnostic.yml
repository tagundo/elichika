name: Exact unvalidated C5 Mac native texture file-menu diagnostic only
on:
  push:
    branches: [codex/mac-file-menu-diagnostic-20261113]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-native-file-menu:
    if: github.repository == 'tagundo/elichika'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact historical unvalidated C5 artifact without building or changing its app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          pgrep -x WindowServer
          env -u GH_TOKEN gh api repos/tagundo/elichika/actions/artifacts/14038842268 \
            > "$RUNNER_TEMP/original-C5-artifact-metadata.json"
          python3 - <<'PY'
          import json,os,pathlib
          value=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'original-C5-artifact-metadata.json').read_text())
          assert value['id']==14038842268 and value['name']=='elichika-macos-unvalidated-candidate' and value['size_in_bytes']==305441968 and not value['expired']
          assert value['digest']=='sha256:5b86c4294bfabca4f894b0c16526b313136552d28cbe24392748642ec7a78330'
          assert value['workflow_run']['id']==43428743619 and value['workflow_run']['head_sha']=='b503631efee12bdf224ae94962bd1403a4658da3'
          PY
          env -u GH_TOKEN gh api repos/tagundo/elichika/actions/artifacts/14038842268/zip \
            > "$RUNNER_TEMP/original-C5-artifact.zip"
          python3 qa/mac-file-menu-diagnostic/prepare_exact_app.py \
            --archive "$RUNNER_TEMP/original-C5-artifact.zip" --qa qa/mac-file-menu-diagnostic \
            --scratch "$RUNNER_TEMP/file-menu-diagnostic" --evidence "$RUNNER_TEMP/file-menu-evidence"
          cp "$RUNNER_TEMP/original-C5-artifact-metadata.json" "$RUNNER_TEMP/file-menu-evidence/"
      - name: Use real OS input and actual Open and Save panels, then verify every output pixel and layer
        run: |
          python3 qa/mac-file-menu-diagnostic/run_native_diagnostic.py \
            --qa qa/mac-file-menu-diagnostic --scratch "$RUNNER_TEMP/file-menu-diagnostic" \
            --evidence "$RUNNER_TEMP/file-menu-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-unvalidated-C5-native-file-menu-diagnostic-only
          path: ${{ runner.temp }}/file-menu-evidence/
          if-no-files-found: error
          retention-days: 7
