name: Export verified date client candidates individually
"on":
  push:
    branches: [codex/sifas-date-artifact-export-20261115]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sifas-date-artifact-export-20261115
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ci/date_client_artifact_split
      - name: Test bounded validator with tiny synthetic ZIPs
        working-directory: ci/date_client_artifact_split
        run: python3 -B -m unittest -v test_split_candidates
      - name: Validate exact successful source run and artifact identity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('ci/date_client_artifact_split/export-recipe.json', 'utf8'));
            if (p.repository !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('Wrong source repository');
            const [{data:run}, {data:artifact}] = await Promise.all([
              github.rest.actions.getWorkflowRun({...context.repo, run_id:p.source_run_id}),
              github.rest.actions.getArtifact({...context.repo, artifact_id:p.source_artifact.id})
            ]);
            const a = p.source_artifact;
            if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== p.source_commit ||
                artifact.id !== a.id || artifact.name !== a.name || artifact.size_in_bytes !== a.bytes ||
                artifact.digest !== `sha256:${a.sha256}` || artifact.expired !== false ||
                artifact.workflow_run?.id !== p.source_run_id || artifact.workflow_run?.head_sha !== p.source_commit) {
              throw new Error('Source run/artifact differs from immutable reviewed recipe');
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/source-provenance.json`, JSON.stringify({
              repository:p.repository,run_id:p.source_run_id,source_commit:p.source_commit,
              run_status:run.status,run_conclusion:run.conclusion,artifact:a
            }, null, 2));
      - name: Download the one pinned ZIP on hosted runner only
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          timeout --signal=TERM --kill-after=15s 8m
          gh api /repos/tagundo/elichika/actions/artifacts/14151027288/zip
          > "$RUNNER_TEMP/source-candidates.zip"
      - name: Verify ZIP digest, build receipts, sums and unchanged candidate bytes
        run: >-
          python3 -B ci/date_client_artifact_split/split_candidates.py
          "$RUNNER_TEMP/source-candidates.zip" "$RUNNER_TEMP/date-client-export"
          --provenance "$RUNNER_TEMP/source-provenance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dateclient-2026.11.15.1-android-gl-unsigned
          path: ${{ runner.temp }}/date-client-export/android-gl/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dateclient-2026.11.15.1-android-jp-unsigned
          path: ${{ runner.temp }}/date-client-export/android-jp/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dateclient-2026.11.15.1-ios-gl-local-adhoc
          path: ${{ runner.temp }}/date-client-export/ios-gl-local/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dateclient-2026.11.15.1-ios-gl-adhoc
          path: ${{ runner.temp }}/date-client-export/ios-gl/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dateclient-2026.11.15.1-ios-jp-adhoc
          path: ${{ runner.temp }}/date-client-export/ios-jp/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dateclient-2026.11.15.1-proof-metadata
          path: ${{ runner.temp }}/date-client-export/metadata/
          compression-level: 9
          if-no-files-found: error
          retention-days: 14
