<!-- User template -->
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1" charset="utf-8"/><link rel="stylesheet" href="/webui/webui.css"/></head>
<style>#native-account-list button[hidden] { display: none; }</style>
<body onload="try_login()">
    <section id="native-account-picker" hidden>
        <h2 data-native-text="Choose a local account">Choose a local account</h2>
        <p data-native-text="Select an account stored on this device. No password is needed in this app.">Select an account stored on this device. No password is needed in this app.</p>
        <label for="native-account-filter" data-native-text="Filter accounts (optional)">Filter accounts (optional)</label>
        <input id="native-account-filter" type="search" oninput="filter_native_accounts()">
        <div id="native-account-list"></div>
        <p id="native-account-empty" hidden data-native-text="No accounts yet. Create an account in the game client first.">No accounts yet. Create an account in the game client first.</p>
    </section>
    <form id="login_form" method="POST" enctype="multipart/form-data" hidden>
        <div><label>User Id</label><input type="number" id="user_id" name="user_id" min="0" max="999999999"></div>
        <div><label>Password</label><input type="password" id="user_password" name="user_password"></div>
        <div><label>Stay logged-in</label><input type="checkbox" id="keep_login"></div>
        <div><input type="button" onclick="login()" value="Login" /></div>
        <div><label>If you don't have an account, create one using the client (on android / ios)
            first!</label></div>
    </form>
</body>
</html>
<script>
    async function try_login() {
        try {
            const result = await fetch('/webui/user/native_accounts', {cache: 'no-store'})
            if (result.ok) {
                const data = await result.json()
                document.getElementById('login_form').hidden = true
                document.getElementById('native-account-picker').hidden = false
                document.getElementById('native-account-empty').hidden = data.accounts.length > 0
                data.accounts.forEach(function(account) {
                    const button = document.createElement('button')
                    button.type = 'button'
                    button.textContent = 'ID ' + account.user_id + ' · Rank ' + account.rank
                    button.dataset.userId = String(account.user_id)
                    button.onclick = function() {
                        document.getElementById('user_id').value = account.user_id
                        login()
                    }
                    document.getElementById('native-account-list').appendChild(button)
                })
                // Translation is optional presentation. Its download or an
                // error must never turn successful native auth into a prompt.
                try { if (typeof apply_native_language === 'function') apply_native_language() } catch (_) {}
                document.body.dataset.elichikaLocalAccess = 'true'
                return
            }
        } catch (_) {}
        delete document.body.dataset.elichikaLocalAccess
        document.getElementById('login_form').hidden = false
        // try to login with existing data
        var userId = localStorage.getItem("user_id")
        if (userId != null) {
            var userPassword = localStorage.getItem("user_password")
            if (userPassword == null) {
                userPassword = ""
            }
            // try to authenticate
            document.getElementById("user_id").value = userId
            document.getElementById("user_password").value = userPassword
            document.getElementById("keep_login").checked = localStorage.getItem("keep_login")
            if (document.getElementById("keep_login").checked)
                login()
        }
    }

    function filter_native_accounts() {
        const filter = document.getElementById('native-account-filter').value.trim()
        document.querySelectorAll('#native-account-list button').forEach(function(button) {
            button.hidden = !button.dataset.userId.includes(filter)
        })
    }

    function clear_login_data() {
        localStorage.removeItem("user_id")
        localStorage.removeItem("user_password")
        localStorage.removeItem("keep_login")
    }

    function login() {
        clear_login_data()
        sessionStorage.removeItem("user_session_key")
        if (document.getElementById("keep_login").checked) {
            localStorage.setItem("user_id", document.getElementById("user_id").value)
            localStorage.setItem("user_password", document.getElementById("user_password").value)
            localStorage.setItem("keep_login", true)
        }
        var formData = new FormData(document.getElementById("login_form"))
        var req = new XMLHttpRequest()
        req.open("POST", "/webui/user/login")
        req.send(formData)
        req.onreadystatechange = function () {
            if (req.readyState != 4) return
            if (req.status == 200) {
                const resp = JSON.parse(req.responseText)
                if (resp.error != null) {
                    clear_login_data()
                    alert(resp.error)
                } else {
                    sessionStorage.setItem("user_session_key", resp.response)
                    sessionStorage.setItem("user_id", document.getElementById("user_id").value)
                    // nagivate to the main user webui hub
                    window.location.replace("/webui/user" + window.location.search)
                }
            } else {
                // no clear response from server
                clear_login_data()
                alert("unexpected error, status: " + req.status)
            }
        }
    }
</script>
<script src="/webui/native_local.js"></script>
