name: Native feature compile only

on:
  push:
    branches: [codex/native-feature-compile-20261115]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-feature-compile-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify immutable native sources and gitlinks
        run: python3 ci/native_feature_compile.py preflight --out "$RUNNER_TEMP/native-feature-android-reports"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare checksum-pinned official Gradle 8.9
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GRADLE_USER_HOME: ${{ runner.temp }}/native-feature-gradle
        run: python3 android/ci/prepare_gradle.py --report "$RUNNER_TEMP/native-feature-android-reports/gradle-preparation.json"
      - uses: android-actions/setup-android@v3
        timeout-minutes: 4
        with:
          packages: platform-tools
      - name: Install only Android Java compilation SDK inputs
        timeout-minutes: 6
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Audit task graph and compile real app Kotlin and Java
        timeout-minutes: 19
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/native-feature-gradle
        run: python3 ci/native_feature_compile.py android --out "$RUNNER_TEMP/native-feature-android-reports"
      - name: Preserve bounded source/compiler receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-feature-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-feature-android-reports/*.json
            ${{ runner.temp }}/native-feature-android-reports/*-tail.txt
          if-no-files-found: warn
          retention-days: 7

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile full SwiftUI app and run package tests
        timeout-minutes: 18
        run: >-
          python3 ci/native_feature_compile.py swift
          --out "$RUNNER_TEMP/native-feature-macos-reports"
          --scratch "$RUNNER_TEMP/native-feature-swift"
      - name: Preserve bounded source/compiler/test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-feature-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-feature-macos-reports/*.json
            ${{ runner.temp }}/native-feature-macos-reports/*-tail.txt
          if-no-files-found: warn
          retention-days: 7
