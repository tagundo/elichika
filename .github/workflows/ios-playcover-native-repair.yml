name: Repair iOS native framework names and verify actual PlayCover imports

on:
  push:
    branches: [codex/ios-unified-playcover-native-names-20261116]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-native-name-repair-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair-and-native-imports:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check naming, loader mappings, collision guards and native body proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-name-evidence"
          python3 -B -m unittest discover -s ios/ci -p test_native_name_repair.py -v \
            2>&1 | tee "$RUNNER_TEMP/native-name-evidence/repair-metadata-tests.txt"
          python3 -B -m unittest discover -s ios/ci -p test_framework_rename_proof.py -v \
            2>&1 | tee "$RUNNER_TEMP/native-name-evidence/native-body-proof-tests.txt"
          python3 -B -m unittest discover -s ios/python/tests -p test_runtime_provision.py -v \
            2>&1 | tee "$RUNNER_TEMP/native-name-evidence/runtime-provision-tests.txt"
          python3 -B ios/ci/verify_playcover_native_imports.py --self-test \
            2>&1 | tee "$RUNNER_TEMP/native-name-evidence/mac-consumer-contract-tests.txt"

      - name: Repair exact old IPA, keep iOS platforms, sign strictly and prove code preservation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B ios/build/repair_native_names.py --repo . \
            --work "$RUNNER_TEMP/native-name-repair" --delivery "$RUNNER_TEMP/native-name-delivery" \
            --evidence "$RUNNER_TEMP/native-name-evidence" --version 2026.11.16.2 \
            2>&1 | tee "$RUNNER_TEMP/native-name-evidence/raw-ios-repair.log"

      - name: Convert an independent disposable copy and execute real native imports
        run: |
          set -euo pipefail
          python3 -B ios/ci/verify_playcover_native_imports.py \
            --app "$RUNNER_TEMP/native-name-repair/stage/Payload/global.app" \
            --work "$RUNNER_TEMP/playcover-converted-copy" \
            --evidence "$RUNNER_TEMP/native-name-evidence/playcover-native" \
            2>&1 | tee "$RUNNER_TEMP/native-name-evidence/mac-native-imports.log"

      - name: Verify sealed raw iOS output stayed unchanged and attach qualified Mac proof
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'ios/build')
          from common import verify_file, write_json
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          delivery = root / 'native-name-delivery'
          manifest = json.loads((delivery / 'candidate-manifest.json').read_text())
          verify_file(delivery / manifest['IPA']['name'], manifest['IPA'])
          probe = json.loads((root / 'native-name-evidence/playcover-native/result.json').read_text())
          if probe['status'] != 'ACTUAL_PLAYCOVER_CONVERSION_AND_NATIVE_IMPORTS_PASS':
              raise ValueError('Actual converted native import proof did not pass')
          manifest['Mac_import_probe_status'] = probe['status']
          manifest['Mac_native_import_proof'] = probe
          manifest['PlayCover_icon_launch_verified'] = False
          manifest['physical_device_gameplay_verified'] = False
          write_json(delivery / 'candidate-manifest.json', manifest)
          PY
          codesign --verify --deep --strict "$RUNNER_TEMP/native-name-repair/stage/Payload/global.app"

      - name: Upload normal iOS experimental candidate only after actual Mac native proof
        uses: actions/upload-artifact@v4
        with:
          name: elichika-sifas-2026.11.16.2-EXPERIMENTAL-ARCHIVE_PENDING-UNTESTED_DEVICE-${{ github.sha }}
          path: ${{ runner.temp }}/native-name-delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve raw repair and separate Mac conversion/import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-name-repair-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-name-evidence/
          if-no-files-found: warn
          retention-days: 7
