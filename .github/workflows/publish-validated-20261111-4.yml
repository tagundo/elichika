name: Publish exact validated 2026.11.11.4 applications

on:
  workflow_dispatch:
  push:
    branches: [codex/publish-validated-20261111-4]
    paths: [.github/workflows/publish-validated-20261111-4.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-validated-v2026.11.11.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_INPUTS_SHA256: ca34b2278be6039b50a29074da4dd968f8b095c98b90b92e7583e19f68151627
    steps:
      - name: Reverify approved source, validation jobs and artifacts, then publish exact files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('approved-inputs.json').write_bytes(base64.b64decode(''))
          PY
          python3 - <<'PY'
          """Publish only root-approved immutable CI artifacts; never rebuild or overwrite."""
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = 'tagundo/elichika'
          API = 'repos/' + REPO + '/'


          def sha_file(path):
              with Path(path).open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()


          def canonical(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()


          def gh(path, method='GET', data=None, missing_ok=False):
              command = ['gh', 'api', API + path, '--method', method]
              if data is not None:
                  command += ['--input', '-']
              completed = subprocess.run(command, input=canonical(data) if data is not None else None,
                                         capture_output=True, check=False)
              if completed.returncode:
                  try:
                      status = int(json.loads(completed.stdout).get('status', 0))
                  except (ValueError, TypeError):
                      status = 0
                  if missing_ok and status == 404:
                      return None
                  raise RuntimeError(f'GitHub API failed for {method} {path}: HTTP {status}; '
                                     + completed.stderr.decode(errors='replace')[-1000:])
              return json.loads(completed.stdout)


          def pages(path, key):
              result, page = [], 1
              while True:
                  separator = '&' if '?' in path else '?'
                  batch = gh(path + separator + f'per_page=100&page={page}')[key]
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
                  page += 1


          def normalized_job(job):
              fields = ('id', 'name', 'run_id', 'head_sha', 'run_attempt', 'status', 'conclusion',
                        'started_at', 'completed_at')
              row = {key: job[key] for key in fields}
              row['steps_sha256'] = hashlib.sha256(canonical(job['steps'])).hexdigest()
              return row


          def require_tag(source, tag, create=False):
              path = 'git/ref/tags/' + urllib.parse.quote(tag, safe='')
              ref = gh(path, missing_ok=True)
              if ref is None and create:
                  # Do not retarget an existing tag. A concurrent creator is only accepted
                  # after an independent read proves the same immutable commit.
                  command = ['gh', 'api', API + 'git/refs', '--method', 'POST', '--input', '-']
                  created = subprocess.run(command, input=canonical({'ref': 'refs/tags/' + tag, 'sha': source}),
                                           capture_output=True, check=False)
                  if created.returncode:
                      assert str(json.loads(created.stdout).get('status')) == '422', created.stderr
              if ref is None and not create:
                  return None
              # GitHub may briefly return404 immediately after creating the tag. These are
              # read-only consistency retries, never retries of a failed validation gate.
              if ref is None:
                  for delay in (0, 1, 2, 4, 8, 10, 10):
                      if delay:
                          time.sleep(delay)
                      ref = gh(path, missing_ok=True)
                      if ref is not None:
                          break
              assert ref is not None, 'The created tag did not become readable'
              value = ref['object']
              for _ in range(8):
                  if value['type'] != 'tag':
                      break
                  value = gh('git/tags/' + value['sha'])['object']
              assert value['type'] == 'commit' and value['sha'] == source, 'Existing tag targets another commit'
              return value['sha']


          def archive_entries(archive):
              entries = {}
              for info in archive.infolist():
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  assert info.filename not in entries, 'Duplicate artifact archive member'
                  assert (info.external_attr >> 16) & 0o170000 != 0o120000, 'Symlink artifact member'
                  entries[info.filename] = info
              return entries


          def verify_inputs(expected):
              assert expected['schema'] == 1 and expected['version'] == '2026.11.11.4'
              assert expected['candidate'] == 1 and expected['tag'] == 'v' + expected['version']
              assert expected['repository'] == REPO
              for key in ('source_parent', 'source_tools', 'source_assets'):
                  assert re.fullmatch('[0-9a-f]{40}', expected[key]), key
              assert set(expected['runs']) == {'android', 'macos', 'general'}
              assert set(expected['root_acceptances']) == {'android', 'macos', 'general'}
              assert set(expected['applications']) == {'android', 'macos'}
              artifact_ids = [pin['id'] for pin in expected['artifacts']]
              assert len(artifact_ids) == len(set(artifact_ids)), 'Duplicate approved artifact ID'
              assert {pin['run_id'] for pin in expected['artifacts']} <= {pin['id'] for pin in expected['runs'].values()}
              for role, receipt in expected['root_acceptances'].items():
                  for key in ('source_parent', 'source_tools', 'source_assets'):
                      assert receipt[key] == expected[key], (role, key)
                  assert receipt['run_id'] == expected['runs'][role]['id']
                  decoded = base64.b64decode(receipt['base64'], validate=True)
                  assert hashlib.sha256(decoded).hexdigest() == receipt['sha256']
                  approval = json.loads(decoded)
                  assert approval['status'] == 'ROOT_ACCEPTED_VALIDATED_' + role.upper()
                  assert approval['version'] == expected['version'] and approval['candidate'] == expected['candidate']
                  for key in ('source_parent', 'source_tools', 'source_assets', 'run_id', 'raw_audit_sha256'):
                      assert approval[key] == receipt[key], (role, key)
                  assert re.fullmatch('[0-9a-f]{64}', approval['raw_audit_sha256'])
                  approved_ids = approval['approved_artifact_ids']
                  assert len(approved_ids) == len(set(approved_ids)) and approved_ids
                  assert sorted(approved_ids) == sorted(receipt['approved_artifact_ids'])
                  assert sorted(approved_ids) == sorted(pin['id'] for pin in expected['artifacts']
                      if pin['run_id'] == receipt['run_id']), 'Artifacts are not exactly root-approved'
                  if role == 'general':
                      assert approval['application'] is None
                  else:
                      application = expected['applications'][role]
                      assert application['artifact_id'] in approved_ids, 'Application artifact is not owned by its approved platform run'
                      assert approval['application']['role'] == role
                      for key in ('name', 'size', 'sha256', 'artifact_id', 'member'):
                          assert approval['application'][key] == application[key], (role, key)
              assert expected['applications']['android']['name'] == 'elichika-2026.11.11.4.apk'
              assert expected['applications']['macos']['name'] == 'Elichika-2026.11.11.4-AppleSilicon.app.zip'
              assert expected['artifacts'] and expected['source_pins']
              assert hashlib.sha256(expected['release_body'].encode()).hexdigest() == expected['release_body_sha256']


          def preflight(expected):
              assert os.environ['GITHUB_REPOSITORY'] == REPO
              assert os.environ['GITHUB_EVENT_NAME'] in ('push', 'workflow_dispatch')
              assert os.environ['GITHUB_REF'] == 'refs/heads/' + expected['publisher_branch']
              automation = gh('commits/' + os.environ['GITHUB_SHA'])
              assert [row['sha'] for row in automation['parents']] == [expected['source_parent']]
              assert [(row['filename'], row['status']) for row in automation['files']] == [(expected['workflow_path'], 'added')]
              source_tree = gh('git/trees/' + expected['source_parent'])['tree']
              links = {row['path']: row['sha'] for row in source_tree if row['mode'] == '160000'}
              assert links['modtools'] == expected['source_tools'] and links['assets'] == expected['source_assets']
              branch = gh('git/ref/heads/' + urllib.parse.quote(expected['product_branch'], safe='/'))
              assert branch['object']['sha'] == expected['source_parent'], 'Reviewed product branch moved'
              histories = {}
              for role, pin in expected['runs'].items():
                  run = gh('actions/runs/' + str(pin['id']))
                  for field in ('id', 'head_sha', 'head_branch', 'path', 'run_attempt', 'status', 'conclusion'):
                      assert run[field] == pin[field], (role, field, run[field])
                  assert run['head_sha'] == expected['source_parent']
                  assert run['status'] == 'completed' and run['conclusion'] == 'success'
                  assert pin['required_success_jobs'], role
                  jobs = pages('actions/runs/' + str(pin['id']) + '/jobs?filter=all', 'jobs')
                  actual = sorted((normalized_job(row) for row in jobs), key=lambda row: row['id'])
                  assert actual == pin['jobs'], 'Exact approved jobs, attempts or steps changed: ' + role
                  by_name = {row['name']: row for row in actual}
                  assert len(by_name) == len(actual), 'Unapproved repeated job attempts'
                  for name in pin['required_success_jobs']:
                      assert by_name[name]['status'] == 'completed' and by_name[name]['conclusion'] == 'success', name
                  histories[role] = {'run': {key: run[key] for key in pin if key not in ('jobs', 'required_success_jobs')}, 'jobs': actual}
              for pin in expected['source_pins']:
                  repository = pin['repository']
                  path = urllib.parse.quote(pin['path'], safe='/')
                  blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repository + '/contents/'
                                    + path + '?ref=' + pin['commit']]))
                  assert blob['type'] == 'file' and blob['encoding'] == 'base64'
                  assert hashlib.sha256(base64.b64decode(blob['content'])).hexdigest() == pin['sha256'], pin['path']
              require_tag(expected['source_parent'], expected['tag'])
              return histories


          def download_artifacts(expected):
              root = Path('input'); root.mkdir(exist_ok=True)
              verified, downloaded = {}, {}
              for pin in expected['artifacts']:
                  artifact = gh('actions/artifacts/' + str(pin['id']))
                  for key in ('id', 'name', 'size_in_bytes', 'digest', 'created_at'):
                      assert artifact[key] == pin[key], (pin['name'], key)
                  assert artifact['expired'] is False
                  assert artifact['workflow_run']['id'] == pin['run_id']
                  assert artifact['workflow_run']['head_sha'] == expected['source_parent']
                  siblings = pages('actions/runs/' + str(pin['run_id']) + '/artifacts', 'artifacts')
                  same = [row for row in siblings if row['name'] == pin['name'] and not row['expired']]
                  assert len(same) == 1 and same[0]['id'] == pin['id'], 'Ambiguous artifact name'
                  target = root / (str(pin['id']) + '.zip')
                  with target.open('wb') as output:
                      subprocess.run(['gh', 'api', API + 'actions/artifacts/' + str(pin['id']) + '/zip'],
                                     stdout=output, check=True)
                  assert target.stat().st_size == pin['size_in_bytes']
                  assert 'sha256:' + sha_file(target) == pin['digest']
                  report_hashes = {}
                  with zipfile.ZipFile(target) as archive:
                      entries = archive_entries(archive)
                      for name, digest in pin.get('report_sha256', {}).items():
                          assert name in entries and entries[name].file_size <= 16 * 1024 * 1024
                          raw = archive.read(name)
                          assert hashlib.sha256(raw).hexdigest() == digest, name
                          report_hashes[name] = digest
                  downloaded[pin['id']] = target
                  verified[str(pin['id'])] = {'metadata': pin, 'verified_report_sha256': report_hashes}
              apps = {}
              output = Path('release'); output.mkdir(exist_ok=True)
              for role, pin in expected['applications'].items():
                  path = output / pin['name']
                  with zipfile.ZipFile(downloaded[pin['artifact_id']]) as archive:
                      entries = archive_entries(archive)
                      info = entries[pin['member']]
                      assert not info.is_dir() and info.file_size == pin['size']
                      with archive.open(info) as source, path.open('wb') as destination:
                          shutil.copyfileobj(source, destination, 1024 * 1024)
                  assert path.stat().st_size == pin['size'] and sha_file(path) == pin['sha256']
                  with path.open('rb') as source:
                      assert source.read(4) == b'PK\x03\x04'
                  apps[pin['name']] = {'path': str(path), 'size': pin['size'], 'sha256': pin['sha256']}
              sums = output / 'SHA256SUMS'
              sums.write_text(''.join(expected['applications'][role]['sha256'] + '  '
                                     + expected['applications'][role]['name'] + '\n'
                                     for role in ('android', 'macos')), encoding='utf-8')
              assert sha_file(sums) == expected['sha256sums_sha256']
              apps[sums.name] = {'path': str(sums), 'size': sums.stat().st_size, 'sha256': sha_file(sums)}
              return verified, apps


          def same_release(release, expected, assets):
              assert release['tag_name'] == expected['tag']
              assert release['target_commitish'] == expected['source_parent']
              assert release['name'] == expected['release_name'] and release['prerelease'] is False
              assert release['body'] == expected['release_body']
              present = {row['name']: row for row in release['assets']}
              assert len(present) == len(release['assets']) and set(present) <= set(assets)
              for name, row in present.items():
                  assert row['state'] == 'uploaded' and row['size'] == assets[name]['size']
                  assert row['digest'] == 'sha256:' + assets[name]['sha256'], name
              return present


          def release_for_tag(tag):
              # The REST /releases/tags endpoint cannot reliably discover drafts. Use the
              # authenticated collection, which includes drafts, and never pick one of
              # several matching records arbitrarily.
              matches, page = [], 1
              while True:
                  rows = gh(f'releases?per_page=100&page={page}')
                  assert isinstance(rows, list)
                  matches.extend(row for row in rows if row['tag_name'] == tag)
                  if len(rows) < 100:
                      break
                  page += 1
              assert len(matches) <= 1, 'Several releases or drafts share the approved tag'
              return matches[0] if matches else None


          def publish(expected, assets):
              tag = expected['tag']; source = expected['source_parent']
              release = release_for_tag(tag)
              if release is not None:
                  same_release(release, expected, assets)
              require_tag(source, tag, create=True)
              if release is None:
                  release = gh('releases', 'POST', {'tag_name': tag, 'target_commitish': source,
                      'name': expected['release_name'], 'body': expected['release_body'], 'draft': True,
                      'prerelease': False, 'generate_release_notes': False})
              present = same_release(release, expected, assets)
              if release['draft'] is False:
                  assert set(present) == set(assets), 'Already-public release has incomplete assets'
              else:
                  for name, pin in assets.items():
                      if name not in present:
                          subprocess.run(['gh', 'release', 'upload', tag, '--repo', REPO, pin['path']], check=True)
                  release = gh('releases/' + str(release['id']))
                  assert set(same_release(release, expected, assets)) == set(assets)
                  assert require_tag(source, tag) == source, 'Approved tag disappeared before publication'
                  release = gh('releases/' + str(release['id']), 'PATCH',
                               {'draft': False, 'prerelease': False, 'make_latest': 'true'})
              assert release['draft'] is False
              assert set(same_release(release, expected, assets)) == set(assets)
              assert require_tag(source, tag) == source
              return release


          def public_downloads(expected, assets):
              failures = []
              checks = None
              for attempt in range(10):
                  try:
                      rows = {}
                      for name, pin in assets.items():
                          url = 'https://github.com/' + REPO + '/releases/download/' + expected['tag'] + '/' + urllib.parse.quote(name)
                          checksum = name == 'SHA256SUMS'
                          headers = {'User-Agent': 'Elichika-validated-release-check'}
                          if not checksum:
                              headers['Range'] = 'bytes=0-1023'
                          request = urllib.request.Request(url, headers=headers)
                          with urllib.request.urlopen(request, timeout=30) as response:
                              assert response.status == (200 if checksum else 206)
                              raw = response.read(1025 if not checksum else pin['size'] + 1)
                              if checksum:
                                  assert len(raw) == pin['size'] and hashlib.sha256(raw).hexdigest() == pin['sha256']
                              else:
                                  assert len(raw) == 1024 and raw.startswith(b'PK\x03\x04')
                                  assert response.headers['Content-Range'] == 'bytes 0-1023/' + str(pin['size'])
                              rows[name] = {'status': response.status, 'url': url, 'bytes_checked': len(raw),
                                            'total_size': pin['size'], 'sha256': pin['sha256'],
                                            'method': 'full checksum' if checksum else 'unauthenticated 1024-byte Range'}
                      request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/releases/latest',
                                                       headers={'User-Agent': 'Elichika-validated-release-check'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          latest = json.load(response)
                      assert latest['tag_name'] == expected['tag'] and latest['draft'] is False
                      assert {row['name'] for row in latest['assets']} == set(assets)
                      for row in latest['assets']:
                          pin = assets[row['name']]
                          assert row['size'] == pin['size'] and row['digest'] == 'sha256:' + pin['sha256']
                          assert row['browser_download_url'] == rows[row['name']]['url']
                      checks = {'status': 'PASS', 'attempt': attempt + 1, 'assets': rows,
                                'latest_release_id': latest['id'], 'prior_read_failures': failures}
                      break
                  except (AssertionError, OSError, ValueError, KeyError) as error:
                      failures.append({'attempt': attempt + 1, 'error': type(error).__name__ + ': ' + str(error)[:300]})
                      if attempt < 9:
                          time.sleep(min(2 ** attempt, 5))
              assert checks is not None, failures
              return checks


          def main():
              raw = Path('approved-inputs.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest() == os.environ['APPROVED_INPUTS_SHA256']
              expected = json.loads(raw)
              verify_inputs(expected)
              histories = preflight(expected)
              Path('verified-validation-runs.json').write_text(json.dumps(histories, indent=2) + '\n')
              evidence, apps = download_artifacts(expected)
              Path('verified-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
              release = publish(expected, apps)
              # Record publication immediately; a later read-only CDN check cannot erase
              # the fact that the release became public.
              receipt = {'status': 'PUBLISHED_EXACT_VALIDATED_FILES_WITHOUT_REBUILD', 'release': release,
                  'source_parent': expected['source_parent'], 'source_tools': expected['source_tools'],
                  'source_assets': expected['source_assets'], 'applications': apps,
                  'root_acceptances': expected['root_acceptances'], 'product_rebuilt': False, 'main_merged': False,
                  'approved_inputs_sha256': hashlib.sha256(raw).hexdigest()}
              Path('publication-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
              checks = public_downloads(expected, apps)
              Path('public-download-check.json').write_text(json.dumps(checks, indent=2) + '\n')
              print(release['html_url'])


          if __name__ == '__main__':
              main()
          PY

      - name: Preserve validation and public-download receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-publication-receipt
          path: |
            approved-inputs.json
            verified-validation-runs.json
            verified-evidence.json
            publication-receipt.json
            public-download-check.json
          if-no-files-found: warn
