name: Publish exact validated 2026.11.11.2 applications

on:
  workflow_dispatch:
  push:
    branches: [codex/publish-validated-20261111-2]
    paths: [.github/workflows/publish-validated-20261111-2.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-validated-v2026.11.11.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPO: tagundo/elichika
    steps:
      - name: Verify the exact approved validation runs and existing draft
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'tagundo/elichika'
          assert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/publish-validated-20261111-2'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/' + path]))
          """Resolve all run attempts; accept only the one specifically approved C3 retry."""
          import hashlib
          import json
          
          GENERAL_RUN = 42955622870
          GENERAL_SOURCE = '9a3640d69a6d411b659cef599f5dcd26c61892e3'
          RETAINED_GENERAL_JOBS = {'windows-upgrades': 130309901939, 'tests': 130309902228}
          FAILED_WEBGL_JOB = 130309902462
          NEW_WEBGL_JOB = 130313560052
          GENERAL_CARRIED_ALIASES = {'windows-upgrades': 130313597038, 'tests': 130313561548}
          JOB_FIELDS = ('id', 'name', 'run_attempt', 'status', 'conclusion')
          
          
          def normalize_job(job):
              row = {name: job[name] for name in JOB_FIELDS}
              assert type(row['id']) is int and row['id'] > 0
              assert isinstance(row['name'], str) and row['name']
              assert type(row['run_attempt']) is int and row['run_attempt'] >= 1
              return row
          
          
          def latest_jobs_by_name(jobs):
              latest, attempts = {}, set()
              for job in jobs:
                  row = normalize_job(job)
                  key = (row['name'], row['run_attempt'])
                  assert key not in attempts, 'Duplicate job name in the same run attempt'
                  attempts.add(key)
                  if row['name'] not in latest or row['run_attempt'] > latest[row['name']]['run_attempt']:
                      latest[row['name']] = row
              return latest
          
          
          def verify_general_history(run, jobs, expected=None):
              assert run['id'] == GENERAL_RUN and run['head_sha'] == GENERAL_SOURCE
              assert run['head_branch'] == 'codex/model-workbench-build-20261109'
              assert run['path'] == '.github/workflows/tests.yml'
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert run['run_attempt'] == 2, 'Exactly one new run attempt is authorized'
              history = sorted((normalize_job(job) for job in jobs), key=lambda row: row['id'])
              assert len(history) == 6 and len({row['id'] for row in history}) == 6
              if expected is not None:
                  assert history == sorted((normalize_job(job) for job in expected), key=lambda row: row['id'])
              by_id = {row['id']: row for row in history}
              raw_by_id = {row['id']: row for row in jobs}
              assert set(by_id) == set(RETAINED_GENERAL_JOBS.values()) | set(GENERAL_CARRIED_ALIASES.values()) | {FAILED_WEBGL_JOB, NEW_WEBGL_JOB}
              assert all(row['run_id'] == GENERAL_RUN and row['head_sha'] == GENERAL_SOURCE for row in jobs)
              for name, identity in RETAINED_GENERAL_JOBS.items():
                  assert by_id[identity] == {'id': identity, 'name': name, 'run_attempt': 1,
                                             'status': 'completed', 'conclusion': 'success'}
              assert by_id[FAILED_WEBGL_JOB] == {'id': FAILED_WEBGL_JOB, 'name': 'viewer-webgl',
                                                'run_attempt': 1, 'status': 'completed', 'conclusion': 'failure'}
              webgl = [row for row in history if row['name'] == 'viewer-webgl']
              assert len(webgl) == 2 and {row['run_attempt'] for row in webgl} == {1, 2}
              new = next(row for row in webgl if row['run_attempt'] == 2)
              assert new['id'] == NEW_WEBGL_JOB and new['status'] == 'completed' and new['conclusion'] == 'success'
              carried = {}
              for name, identity in RETAINED_GENERAL_JOBS.items():
                  alias_id = GENERAL_CARRIED_ALIASES[name]
                  assert by_id[alias_id] == {'id': alias_id, 'name': name, 'run_attempt': 2,
                                             'status': 'completed', 'conclusion': 'success'}
                  original, alias = raw_by_id[identity], raw_by_id[alias_id]
                  for key in ('started_at', 'completed_at', 'steps'):
                      assert original[key] == alias[key], 'Carried job differs from its original successful execution'
                  assert original['completed_at'] < raw_by_id[NEW_WEBGL_JOB]['started_at']
                  carried[name] = {'original_id': identity, 'carried_alias_id': alias_id,
                                   'started_at': original['started_at'], 'completed_at': original['completed_at'],
                                   'steps_sha256': hashlib.sha256(json.dumps(original['steps'], sort_keys=True).encode()).hexdigest(),
                                   'full_steps_and_timestamps_equal': True, 'completed_before_retry': True}
              latest = latest_jobs_by_name(history)
              assert set(latest) == {'tests', 'windows-upgrades', 'viewer-webgl'}
              assert all(row['status'] == 'completed' and row['conclusion'] == 'success' for row in latest.values())
              for name, identity in GENERAL_CARRIED_ALIASES.items():
                  assert latest[name]['id'] == identity
              assert latest['viewer-webgl']['run_attempt'] == 2
              return {'status': 'PASS_EXACT_C3_GENERAL_SINGLE_JOB_RETRY_WITH_RETAINED_SUCCESSES',
                      'run': GENERAL_RUN, 'source_parent': GENERAL_SOURCE, 'run_attempt': 2,
                      'all_attempt_jobs': history, 'effective_jobs': latest,
                      'carried_forward_success_aliases': carried,
                      'failed_attempt1_preserved': True, 'previous_successful_jobs_preserved': True,
                      'new_webgl_attempts': 1, 'mixed_heads_allowed': False, 'failed_assertions_waived': False}
          def all_run_jobs(identity):
              jobs, page = [], 1
              while True:
                  batch = api(f'actions/runs/{identity}/jobs?filter=all&per_page=100&page={page}')['jobs']
                  jobs.extend(batch)
                  if len(batch) < 100:
                      return jobs
                  page += 1
          automation = api('commits/' + os.environ['GITHUB_SHA'])
