      - name: Download the exact new native Mac execution evidence
        uses: actions/download-artifact@v4
        with:
          name: elichika-macos-evidence
          github-token: ${{ github.token }}
          repository: tagundo/elichika
          run-id: 42955623286
          path: input/macos-evidence

      - name: Verify pinned source-bound native Mac reports and retained regressions
        run: |
          python3 - <<'PY'
          """Verify the new full-success native Mac run and exact archive before publishing."""
          from pathlib import Path
          import hashlib
          import json
          import re
          
          VERSION = '2026.11.11.2'
          REQUIRED_REPORTS = {
              'app-build.json', 'app-archive.json', 'bundle-before-launch.json',
              'bundle-after-relaunch.json', 'bundle-provenance.json', 'private-runtime.json',
              'workbench-tests.json', 'bundled-runtime-tests.txt', 'swift-tests.txt',
              'app-smoke-summary.json', 'first-launch.json', 'relocated-relaunch.json',
              'first-launch-part-oracle.json', 'relocated-relaunch-part-oracle.json',
              'host-diagnostic-summary.json',
          }
          NEW_CASES = {
              'test_model_outlines.OutlineTests.' + name for name in (
                  'test_arbitrary_mesh_gameobject_material_names_preserve_outline_eligibility',
                  'test_preview_visible_unsupported_meshes_have_reasons_and_are_not_writable',
                  'test_standalone_preview_mesh_and_invalid_renderer_binding_are_distinguished',
                  'test_inventory_distinguishes_layout_name_and_limit_failures_without_omission',
                  'test_float32_outlines_preserve_precision_format_and_every_non_red_byte',
                  'test_float32_nonfinite_and_out_of_range_masks_remain_excluded',
              )
          } | {
              'test_outline_inventory_sessions.OutlineInventorySessionTests.' + name for name in (
                  'test_actual_static_renderer_inventory_without_edit_session',
                  'test_unavailable_rig_cannot_authorize_supplied_bone_metadata',
                  'test_unavailable_preview_still_rejects_changed_source_bytes',
                  'test_available_flag_without_writable_nodes_preserves_inventory_only',
                  'test_http_static_rig_inventory_is_reported_but_export_stays_unavailable',
                  'test_preview_only_and_nonrigged_prepare_do_not_register_inventory',
              )
          }
          
          
          def digest(path):
              with Path(path).open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          
          
          def verify(root, pins, archive):
              root, archive = Path(root), Path(archive)
              assert pins['version'] == VERSION
              assert pins['candidate'] == 3
              assert pins['source_parent'] == '9a3640d69a6d411b659cef599f5dcd26c61892e3'
              assert pins['source_tools'] == 'eed6e92bb34c4952f49d29c345506ac8b4a9be06'
              assert re.fullmatch('[0-9a-f]{40}', pins['source_parent'])
              assert re.fullmatch('[0-9a-f]{40}', pins['source_tools'])
              hashes = pins['report_hashes']
              assert REQUIRED_REPORTS <= set(hashes)
              for name, value in hashes.items():
                  assert Path(name).name == name and re.fullmatch('[0-9a-f]{64}', value)
                  path = root / name
                  assert path.is_file() and not path.is_symlink()
                  assert digest(path) == value, name
              def read(name):
                  return json.loads((root / name).read_text())
              build = read('app-build.json')
              assert build['version'] == VERSION and build['architecture'] == 'arm64'
              assert build['source']['parent_commit'] == pins['source_parent']
              assert build['source']['modtools_commit'] == pins['source_tools']
              receipt = read('app-archive.json')
              assert receipt['name'] == archive.name == 'Elichika-' + VERSION + '-AppleSilicon.app.zip'
              assert receipt['bytes'] == archive.stat().st_size == pins['archive_bytes']
              assert receipt['sha256'] == digest(archive) == pins['archive_sha256']
              before, after = read('bundle-before-launch.json'), read('bundle-after-relaunch.json')
              assert before == after, 'The built signed app changed during native launches'
              assert before['status'] == 'PASS_SELF_CONTAINED_SIGNED_BUNDLE'
              assert before['version'] == VERSION and before['architectures'] == ['arm64']
              assert before['source']['parent_commit'] == pins['source_parent']
              assert before['source']['modtools_commit'] == pins['source_tools']
              qa_sources = pins['qa_source_hashes']
              assert set(qa_sources) == {'macos/ci/run_app_smoke.py', 'macos/ci/diagnose_app_smoke.py', 'macos/ci/native_pcm_qa.js'}
              assert all(re.fullmatch('[0-9a-f]{64}', value) for value in qa_sources.values())
              provenance = read('bundle-provenance.json')
              assert provenance['source']['parent_commit'] == pins['source_parent']
              assert provenance['source']['modtools_commit'] == pins['source_tools']
              # The PCM observer is an intentionally changed signed QA resource; production
              # PCM modules have independent source inventories in the accepted audit.
              assert provenance['qa_files']['native_pcm_qa.js'] == qa_sources['macos/ci/native_pcm_qa.js']
              observer = read('host-diagnostic-summary.json')
              assert observer['status'] == 'ORIGINAL_GATE_RESULT_UNCHANGED'
              assert observer['original_exit_code'] == 0
              assert observer['original_gate_sha256'] == qa_sources['macos/ci/run_app_smoke.py']
              for name in ('same_gate_bytes_after', 'no_active_probe_before_original_exit', 'no_retry'):
                  assert observer[name] is True
              assert 'post_failure' not in observer and 'post_failure_error' not in observer
              assert read('private-runtime.json')['status'] == 'PASS'
              workbench = read('workbench-tests.json')
              assert workbench['status'] == 'PASS' and workbench['packaged_sources'] is True
              assert workbench['skips'] == workbench['failures'] == workbench['errors'] == 0
              cases = workbench['executed_cases']
              assert len(cases) == len(set(cases)) == workbench['tests'] >= 366
              retained = pins['retained_11_1_case_ids']
              assert len(retained) == len(set(retained)) == 354
              assert set(retained) <= set(cases), 'A previously validated native workbench case is missing'
              assert NEW_CASES <= set(cases), 'Native Float32/inventory regressions did not execute'
              runtime = (root / 'bundled-runtime-tests.txt').read_text()
              counts = re.findall(r'Ran (\d+) tests? in ', runtime)
              assert counts and int(counts[-1]) >= 44 and re.search(r'^OK\s*$', runtime, re.M)
              assert 'skipped=' not in runtime and '... skipped ' not in runtime
              swift = (root / 'swift-tests.txt').read_text()
              counts = re.findall(r'Executed (\d+) tests?, with 0 failures', swift)
              assert counts and int(counts[-1]) >= 17
              smoke = read('app-smoke-summary.json')
              assert smoke['status'] == 'PASS_FINAL_APP_LAUNCH_RELOCATION_AND_RELAUNCH'
              for name in ('readonly_app_signature_preserved', 'no_host_python_or_homebrew_path',
                           'original_app_path_removed', 'space_and_unicode_path'):
                  assert smoke[name] is True
              for launch in ('first-launch', 'relocated-relaunch'):
                  assert read(launch + '.json')['status'] == 'PASS'
                  part = read(launch + '-part-oracle.json')
                  assert part['status'] == 'PASS'
                  assert part['outputSubmeshes'] == part['originalMaterialSlots'] == 1
                  assert part['addedMaterialObjects'] == part['addedTextureObjects'] == 0
                  for name in ('sourcePreserved', 'donorPreserved', 'donorUVColorAndSkinExact'):
                      assert part[name] is True
              return {'status': 'PASS_FULL_NEW_SOURCE_BOUND_MAC_RUN', 'version': VERSION,
                      'source_parent': pins['source_parent'], 'source_tools': pins['source_tools'],
                      'archive_bytes': receipt['bytes'], 'archive_sha256': receipt['sha256'],
                      'workbench_tests': workbench['tests'], 'retained_11_1_cases': len(retained),
                      'new_required_cases': len(NEW_CASES), 'signed_app_unchanged': True,
                      'first_and_relocated_native_launch': True, 'report_hashes': hashes,
                      'outside_app_observer_preserves_successful_original_gate': True,
