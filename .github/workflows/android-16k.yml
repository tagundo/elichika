name: Android 16KB native loader diagnostics

on:
  push:
    branches: [codex/release-readiness-audit]
    paths:
      - .github/workflows/android-16k.yml
      - tests/android_16k_native.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-16k:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare software ARM VM and official 16KB Android image
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm cpio e2fsprogs erofs-utils android-sdk-libsparse-utils
          python3 -c 'import os,subprocess; subprocess.run([os.environ["ANDROID_HOME"]+"/cmdline-tools/latest/bin/sdkmanager","--licenses"],input=b"y\n"*100,check=True,stdout=subprocess.DEVNULL)'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'system-images;android-35;google_apis_ps16k;arm64-v8a'

      - name: Download the exact verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          run-id: 36851847480
          repository: tagundo/elichika
          github-token: ${{ github.token }}
          path: candidate

      - name: Run unchanged native libraries with 16KB Android loader
        run: >-
          python3 -u tests/android_16k_native.py
          --candidate candidate/elichika-2026.10.01-dev.apk
          --image "$ANDROID_HOME/system-images/android-35/google_apis_ps16k/arm64-v8a"
          --ndk "$ANDROID_NDK_HOME"
          --work "$RUNNER_TEMP/android-16k-native"
          --evidence evidence

      - name: Upload 16KB diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-16k-native-evidence
          path: evidence/
          if-no-files-found: warn
