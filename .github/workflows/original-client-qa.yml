name: Diagnose fresh GL startup without any injected observer

on:
  push:
    branches: [codex/android-client-qa-native-gl-20261113]
  workflow_dispatch:
    inputs:
      max_seconds:
        description: Bounded genuine-client UI run time per region
        required: true
        default: "600"

permissions:
  # GitHub requires write scope to read this repository's unpublished drafts.
  # The fixture helper makes GET requests only; no release is changed by CI.
  contents: write
  actions: read

concurrency:
  group: signed-sifas-client-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    if: github.repository == 'tagundo/elichika' && startsWith(github.ref, 'refs/heads/codex/android-client-qa-')
    strategy:
      fail-fast: false
      matrix:
        region: [GL]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QA_REGION: ${{ matrix.region }}
      OMP_THREAD_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read exact root-frozen C5 server source
        id: fixture
        run: |
          python3 - <<'PYFIXTURE'
          import json,os,re
          from pathlib import Path
          m=json.loads(Path('qa/frozen-fixtures.json').read_text())['server']
          assert m['approval_scope']=='final_source_build_fixture'
          assert re.fullmatch('[0-9a-f]{40}',m['source_commit'])
          assert not any(k in m for k in ('asset_id','sha256','version_code')), 'Source mode cannot imply a server APK'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('server_ref='+m['source_commit']+'\n')
          PYFIXTURE

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'

      - name: Checkout root-frozen Go server and official recursive assets
        uses: actions/checkout@v4
        with:
          repository: tagundo/elichika
          ref: ${{ steps.fixture.outputs.server_ref }}
          path: server-source
          persist-credentials: false
          submodules: recursive

      - name: Download exact signed client without any observer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 qa/download_fixtures.py --manifest qa/frozen-fixtures.json --region "$QA_REGION" \
            --destination "$RUNNER_TEMP/client-qa-fixtures" --evidence evidence --skip-server-apk --skip-frida
          git -C server-source rev-parse HEAD > evidence/server-source-commit.txt
          sha256sum qa/*.py qa/unity_ui*.js qa/*manifest*.json qa/frozen-fixtures.json > evidence/qa-source-sha256.txt
          cp qa/frozen-fixtures.json evidence/frozen-fixtures.json

      - name: Prepare disposable native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb apksigner aapt python3-venv ffmpeg tesseract-ocr tesseract-ocr-eng
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install --disable-pip-version-check 'Pillow==11.0.0'
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p "$RUNNER_TEMP/android-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker run --detach --privileged --name original-client-qa \
            --publish 127.0.0.1:5555:5555 --volume "$RUNNER_TEMP/android-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=1280 androidboot.redroid_height=720 \
            androidboot.redroid_fps=15 ro.secure=0
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt
          adb -s 127.0.0.1:5555 shell getconf PAGESIZE > evidence/android-page-size.txt
          adb -s 127.0.0.1:5555 shell 'echo disposable-private-client-qa > /data/local/tmp/CODEX_DISPOSABLE_CLIENT_QA'
          printf '%s\n' '_ --use-gl=angle --use-angle=vulkan' > "$RUNNER_TEMP/webview-command-line"
          adb -s 127.0.0.1:5555 push "$RUNNER_TEMP/webview-command-line" /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell chmod 644 /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell settings --user 0 put secure immersive_mode_confirmations confirmed

      - name: Verify bounded native OCR action regressions
        run: |
          "$RUNNER_TEMP/qa-venv/bin/python" -B -m unittest discover -s qa -p test_native_ocr_control.py -v

      - name: Verify signatures and exact package identities
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "$RUNNER_TEMP/client-qa-fixtures/client.apk" > evidence/client-signature.txt
          grep -q '5ccf5b5f73dcebad61255f6bfca848eb2022eedb741515d16ac84f94c405a9e3' evidence/client-signature.txt
          aapt dump badging "$RUNNER_TEMP/client-qa-fixtures/client.apk" > evidence/client-badging.txt
          grep -q "native-code: 'arm64-v8a'" evidence/client-badging.txt
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          manifest=json.loads(Path('qa/frozen-fixtures.json').read_text())
          expected=manifest['clients'][os.environ['QA_REGION']]['package']
          assert "name='"+expected+"'" in Path('evidence/client-badging.txt').read_text()
          assert Path('evidence/server-source-commit.txt').read_text().strip()==manifest['server']['source_commit']
          PY

      - name: Build exact Go fixture and normally create one synthetic account
        run: |
          set -euo pipefail
          python3 qa/build_host_go_fixture.py \
            --source-root "$GITHUB_WORKSPACE/server-source" \
            --source-sha "${{ steps.fixture.outputs.server_ref }}" \
            --output "$RUNNER_TEMP/host-go-fixture"

      - name: Run genuine regional client UI against owned hash-bound source fixture
        env:
          QA_SECONDS: ${{ inputs.max_seconds || '600' }}
        run: |
          set -euo pipefail
          case "$QA_SECONDS" in *[!0-9]*|'') exit 2;; esac
          test "$QA_SECONDS" -ge 120
          test "$QA_SECONDS" -le 600
          qa_watchdog_seconds=$((QA_SECONDS + 120))
          qa_exit=0
          timeout --signal=TERM --kill-after=20s "${qa_watchdog_seconds}s" "$RUNNER_TEMP/qa-venv/bin/python" -u qa/native_ocr_control.py \
            --fixtures qa/frozen-fixtures.json \
            --host-server-root "$GITHUB_WORKSPACE/server-source" \
            --host-server-receipt "$RUNNER_TEMP/host-go-fixture/host-go-fixture.json" \
            --client-apk "$RUNNER_TEMP/client-qa-fixtures/client.apk" \
            --server-source server-source --evidence evidence \
            --max-seconds "$QA_SECONDS" || qa_exit=$?
          if [ "$qa_exit" = 124 ] || [ "$qa_exit" = 137 ]; then
            python3 - <<'PYTIMEOUT'
          import json
          from pathlib import Path
          for name in ('native-only-control-report.json',):
              path=Path('evidence')/name
              if path.is_file():
                  report=json.loads(path.read_text());report['status']='INCOMPLETE'
                  report['blocked_reason']='External overall QA watchdog stopped a hung process; unobserved cases are not approved'
                  path.write_text(json.dumps(report,indent=2)+'\n')
          PYTIMEOUT
          fi
          exit "$qa_exit"

      - name: Retain actual crash, native feature and rendering diagnostics
        if: always()
        run: |
          mkdir -p evidence
          # Explicit allowlist: never upload private synthetic credentials, DBs,
          # binaries, caches, or the entire source/fixture output directory.
          for name in host-go-fixture.json go-build.log seed-build.log server-data-init.log synthetic-account-init.log; do
            if [ -f "$RUNNER_TEMP/host-go-fixture/$name" ]; then cp "$RUNNER_TEMP/host-go-fixture/$name" "evidence/$name"; fi
          done
          timeout 20s adb -s 127.0.0.1:5555 logcat -d -t 4000 > evidence/final-logcat.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 logcat -b crash -d > evidence/final-crashes.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 shell dumpsys activity activities > evidence/final-activities.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 shell dumpsys SurfaceFlinger > evidence/surfaceflinger.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/final-display.png 2>/dev/null || true
          docker logs original-client-qa > evidence/redroid.log 2>&1 || true

      - name: Redact known synthetic fixture credentials from final diagnostics
        if: always()
        run: |
          python3 - <<'PYREDACT'
          import json,os
          from pathlib import Path
          credential=Path(os.environ['RUNNER_TEMP'])/'host-go-fixture/synthetic-account.private.json'
          if credential.is_file():
              password=json.loads(credential.read_text())['password'].encode()
              assert len(password)==16 and password.isalnum()
              for path in Path('evidence').rglob('*'):
                  if path.is_file() and path.suffix in ('.json','.xml','.txt','.log'):
                      data=path.read_bytes()
                      if password in data:path.write_bytes(data.replace(password,b'[redacted synthetic password]'))
          PYREDACT

      - name: Upload private regional execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sifas-native-no-agent-${{ matrix.region }}-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop only any surviving owned source-Go fixture
        if: always()
        run: |
          python3 - <<'PYCLEANUP'
          import hashlib,json,os,signal,time
          from pathlib import Path
          runtime=Path('evidence/host-go-runtime.json')
          receipt=Path(os.environ['RUNNER_TEMP'])/'host-go-fixture/host-go-fixture.json'
          if runtime.is_file() and receipt.is_file():
              record=json.loads(runtime.read_text());expected=json.loads(receipt.read_text())
              pid=record['pid'];assert type(pid) is int and pid>1
              proc=Path('/proc')/str(pid)
              if proc.exists():
                  ticks=(proc/'stat').read_text().rsplit(')',1)[1].split()[19]
                  executable=(proc/'exe').resolve(strict=True)
                  assert ticks==record['start_ticks'] and str(executable)==expected['binary_path'], 'Process identity changed; left untouched'
                  assert hashlib.file_digest((proc/'exe').open('rb'),'sha256').hexdigest()==record['binary_sha256']==expected['server_fixture']['binary_sha256']
                  os.kill(pid,signal.SIGTERM)
                  end=time.monotonic()+8
                  while proc.exists() and time.monotonic()<end:time.sleep(.1)
                  if proc.exists():
                      assert (proc/'stat').read_text().rsplit(')',1)[1].split()[19]==ticks
                      os.kill(pid,signal.SIGKILL)
          PYCLEANUP

      - name: Stop disposable Android
        if: always()
        run: docker rm -f original-client-qa || true
