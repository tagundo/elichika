name: Diagnose original signed APK Python on 16KB
on:
  push:
    branches: [codex/native-16k-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  python-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official ARM kernel and software VM
        run: |
          mkdir -p evidence exports
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm cpio e2fsprogs erofs-utils android-sdk-libsparse-utils
          python3 -c 'import os,subprocess; subprocess.run([os.environ["ANDROID_HOME"]+"/cmdline-tools/latest/bin/sdkmanager","--licenses"],input=b"y\n"*100,check=True,stdout=subprocess.DEVNULL)'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis_ps16k;arm64-v8a'
      - uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          run-id: 36901873216
          github-token: ${{ github.token }}
          path: candidate
      - name: Locate native fault using the exact audited candidate
        run: >-
          python3 tests/native16k_debug.py
          --candidate candidate/elichika-2026.10.01-dev.apk
          --candidate-sha256 e69ccf2de6f699f2252a2f9239e2739fc7897065696b7c7b85408bc80cb6b315
          --image "$ANDROID_HOME/system-images/android-35/google_apis_ps16k/arm64-v8a"
          --ndk "$ANDROID_NDK_HOME"
          --work "$RUNNER_TEMP/16k-debug"
          --evidence evidence --exports exports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-native-root
          path: exports/debug-native-root.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-python-root
          path: exports/debug-python-root.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-16k-kernel
          path: exports/kernel-16384.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-16k-fault-evidence
          path: |
            evidence/
            exports/provenance.json
