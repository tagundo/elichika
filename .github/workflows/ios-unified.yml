name: Build unified Elichika and SIFAS iOS candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'SDK compile, real core Simulator runtime, or full tools+actual-game candidate'
        type: choice
        options: [sdk-compile, core-runtime, full-candidate]
        default: sdk-compile
      version:
        description: 'Optional YYYY.MM.DD.N; must match actual build date in Seoul'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-unified-${{ github.sha }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  apple-sdk:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    steps:
      - name: Check out exact reviewed implementation and official data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go compiler for the actual in-process backend
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'

      - name: Set up host build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify portable packaging and native lifecycle contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-evidence" "$RUNNER_TEMP/ios-candidate"
          python3 -B -m unittest discover -s ios/ci -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/packaging-tests.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/ios/python" python3 -B -m unittest discover -s ios/python/tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/python-host-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/HostCoreTests.cpp -o "$RUNNER_TEMP/elichika-host-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-host-policy-compile.txt"
          "$RUNNER_TEMP/elichika-host-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-host-policy-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/RSAPublicKeyTests.cpp -o "$RUNNER_TEMP/elichika-rsa-key-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-rsa-key-compile.txt"
          "$RUNNER_TEMP/elichika-rsa-key-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-rsa-key-tests.txt"

      - name: Test actual in-process Go lifecycle, initialization, keys and timezones
        run: |
          set -euo pipefail
          go test -count=1 -tags=elichika_inprocess -v ./iosbridge ./runtimeinit ./db ./router \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/go-inprocess-tests.txt"
          go test -count=1 -v ./config \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/go-legacy-config-tests.txt"

      - name: Build complete Python wheels and native codecs for the full candidate
        if: ${{ inputs.mode == 'full-candidate' }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes -r ios/runtime/build-requirements.txt
          for target in device simulator; do
            python3 -B ios/runtime/build_wheels.py \
              --target "$target" --output "$RUNNER_TEMP/ios-built-inputs/$target" \
              --cache "$RUNNER_TEMP/ios-input-cache"
            python3 -B ios/runtime/build_codecs.py \
              --target "$target" --repo . \
              --output "$RUNNER_TEMP/ios-built-inputs/$target/codecs"
          done

      - name: Compile actual device and Simulator targets and execute selected gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 -B ios/ci/run_build.py --mode "$BUILD_MODE" --repo . \
            --work "$RUNNER_TEMP/ios-build" --evidence "$RUNNER_TEMP/ios-evidence" \
            --delivery "$RUNNER_TEMP/ios-candidate" --version "$REQUESTED_VERSION" \
            --built-inputs "$RUNNER_TEMP/ios-built-inputs" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/build.log"

      - name: Upload explicitly untested actual-game candidate
        if: ${{ inputs.mode == 'full-candidate' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: elichika-sifas-ios-UNTESTED-${{ github.sha }}
          path: ${{ runner.temp }}/ios-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve exact source, Apple compiler and runtime gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elichika-ios-${{ inputs.mode }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-evidence/
          if-no-files-found: warn
          retention-days: 7
