name: Build unified Elichika and SIFAS iOS candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'SDK compile, real core Simulator runtime, or full tools+actual-game candidate'
        type: choice
        options: [sdk-compile, core-runtime, runtime-inputs, tools-runtime, experimental-candidate, experimental-package, experimental-parity, full-candidate, mv-export-native, mv-export-android-game]
        default: sdk-compile
      version:
        description: 'Optional YYYY.MM.DD.N; must match actual build date in Seoul'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-unified-${{ github.sha }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  apple-sdk:
    if: ${{ inputs.mode != 'mv-export-native' && inputs.mode != 'mv-export-android-game' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact reviewed implementation and official data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          # Official SQL validators compare the historical Harasho baseline.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go compiler for the actual in-process backend
        if: ${{ inputs.mode != 'runtime-inputs' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'

      - name: Set up host build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch and fully verify the pinned actual game before experimental compilation
        if: ${{ inputs.mode == 'experimental-candidate' || inputs.mode == 'experimental-package' || inputs.mode == 'experimental-parity' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-evidence"
          python3 -B ios/build/fetch_game.py --output "$RUNNER_TEMP/ios-verified-game.ipa" \
            --report "$RUNNER_TEMP/ios-evidence/game-input-provenance.json"

      - name: Verify portable packaging and native lifecycle contracts
        if: ${{ inputs.mode != 'runtime-inputs' }}
        id: preflight
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-evidence" "$RUNNER_TEMP/ios-candidate"
          python3 -B -m unittest discover -s ios/ci -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/packaging-tests.txt"
          PYTHONPATH="$GITHUB_WORKSPACE/ios/python:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/modtools" python3 -B -m unittest discover -s ios/python/tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/python-host-tests.txt"
          python3 -B -m unittest discover -s ios/native/tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-static-tests.txt"
          node ios/python/tests/test_ios_platform.js \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/ios-platform-node-tests.txt"
          node ios/python/tests/test_management_ui.js \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/management-ui-node-tests.txt"
          python3 -B ios/ci/verify_playcover_native_imports.py --self-test \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/mac-native-consumer-contract-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/HostCoreTests.cpp -o "$RUNNER_TEMP/elichika-host-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-host-policy-compile.txt"
          "$RUNNER_TEMP/elichika-host-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-host-policy-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/RSAPublicKeyTests.cpp -o "$RUNNER_TEMP/elichika-rsa-key-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-rsa-key-compile.txt"
          "$RUNNER_TEMP/elichika-rsa-key-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-rsa-key-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/CandidatePolicyTests.cpp -o "$RUNNER_TEMP/elichika-candidate-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-candidate-policy-compile.txt"
          "$RUNNER_TEMP/elichika-candidate-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-candidate-policy-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/ProbeBudgetTests.cpp -o "$RUNNER_TEMP/elichika-probe-budget-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-probe-budget-compile.txt"
          "$RUNNER_TEMP/elichika-probe-budget-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-probe-budget-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/NativeParityPolicyTests.cpp -o "$RUNNER_TEMP/elichika-native-parity-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-parity-policy-compile.txt"
          "$RUNNER_TEMP/elichika-native-parity-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-parity-policy-tests.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/NavigationPolicyTests.cpp -o "$RUNNER_TEMP/elichika-navigation-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-navigation-policy-compile.txt"
          "$RUNNER_TEMP/elichika-navigation-policy-tests" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/native-navigation-policy-tests.txt"

      - name: Test actual in-process Go lifecycle, initialization, keys and timezones
        if: ${{ inputs.mode != 'runtime-inputs' }}
        id: go_tests
        continue-on-error: true
        run: |
          set -euo pipefail
          go test -p 1 -timeout 120s -count=1 -tags=elichika_inprocess -v ./iosbridge ./runtimeinit ./db ./router ./handler/asset ./nativeaccess ./clientdb \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/go-inprocess-tests.txt"
          go test -p 1 -timeout 120s -count=1 -v ./config \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/go-legacy-config-tests.txt"
          # Standalone clientdb initializes before TestMain/tests; supply its
          # actual relative assets in a disposable cwd, never alter package init.
          python3 -B ios/ci/run_normal_clientdb.py --repo . \
            --work "$RUNNER_TEMP/ios-normal-clientdb-tests" \
            --output "$RUNNER_TEMP/ios-evidence/go-normal-clientdb-tests.json"

      - name: Require actual portable and Go outcomes before expensive parity SDK builds
        if: ${{ inputs.mode == 'experimental-parity' }}
        env:
          PORTABLE_TEST_OUTCOME: ${{ steps.preflight.outcome }}
          GO_TEST_OUTCOME: ${{ steps.go_tests.outcome }}
        run: |
          set -euo pipefail
          printf 'Actual portable outcome: %s\nActual Go outcome: %s\n' "$PORTABLE_TEST_OUTCOME" "$GO_TEST_OUTCOME"
          test "$PORTABLE_TEST_OUTCOME" = success
          test "$GO_TEST_OUTCOME" = success

      - name: Require the unchanged production Archive publication guard for a full IPA
        if: ${{ inputs.mode == 'full-candidate' }}
        run: |
          python3 -B - <<'PY'
          from archive_profile_download_bridge import load_source_config
          load_source_config('archive-hosted-catalog.json')
          PY

      - name: Build exact Python wheels and signed codec inputs without an app
        if: ${{ inputs.mode == 'full-candidate' || inputs.mode == 'runtime-inputs' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-evidence"
          python3 -m pip install --disable-pip-version-check --require-hashes -r ios/runtime/build-requirements.txt
          python3 -B ios/ci/build_runtime_inputs.py --repo . \
            --work "$RUNNER_TEMP/ios-runtime-producer" --output "$RUNNER_TEMP/ios-built-inputs" \
            --cache "$RUNNER_TEMP/ios-input-cache" --evidence "$RUNNER_TEMP/ios-evidence" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/runtime-inputs-build.log"

      - name: Reuse the exact independently verified Simulator tool compiler outputs
        if: ${{ inputs.mode == 'tools-runtime' || inputs.mode == 'experimental-candidate' || inputs.mode == 'experimental-package' || inputs.mode == 'experimental-parity' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B ios/build/fetch_runtime_inputs.py --repo . \
            --output "$RUNNER_TEMP/ios-built-inputs" \
            --report "$RUNNER_TEMP/ios-evidence/reused-runtime-inputs.json"

      - name: Verify the exact Source 12 full Simulator proof and unchanged runtime source
        if: ${{ inputs.mode == 'experimental-package' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B ios/build/fetch_simulator_proof.py --repo . \
            --output "$RUNNER_TEMP/ios-source12-proof" \
            --report "$RUNNER_TEMP/ios-source12-proof/consumption.json"

      - name: Compile selected actual Apple targets and execute required gates
        if: ${{ inputs.mode != 'runtime-inputs' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          set --
          if [ "$BUILD_MODE" = experimental-candidate ] || [ "$BUILD_MODE" = experimental-parity ] || [ "$BUILD_MODE" = tools-runtime ]; then
            set -- --reuse-official-payload
          fi
          if [ "$BUILD_MODE" = experimental-candidate ] || [ "$BUILD_MODE" = experimental-parity ]; then
            set -- "$@" --game-input "$RUNNER_TEMP/ios-verified-game.ipa" \
              --game-provenance "$RUNNER_TEMP/ios-evidence/game-input-provenance.json"
          fi
          if [ "$BUILD_MODE" = experimental-package ]; then
            set -- --reuse-official-payload --simulator-proof-root "$RUNNER_TEMP/ios-source12-proof" \
              --game-input "$RUNNER_TEMP/ios-verified-game.ipa" \
              --game-provenance "$RUNNER_TEMP/ios-evidence/game-input-provenance.json"
          fi
          python3 -B ios/ci/run_build.py --mode "$BUILD_MODE" --repo . \
            --work "$RUNNER_TEMP/ios-build" --evidence "$RUNNER_TEMP/ios-evidence" \
            --delivery "$RUNNER_TEMP/ios-candidate" --version "$REQUESTED_VERSION" \
            --built-inputs "$RUNNER_TEMP/ios-built-inputs" \
            "$@" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/build.log"

      - name: Require actual Mac native imports on a separate disposable copy for fresh parity builds
        if: ${{ inputs.mode == 'experimental-parity' }}
        run: |
          set -euo pipefail
          python3 -B ios/ci/verify_playcover_native_imports.py --repo . \
            --app "$RUNNER_TEMP/ios-build/ipa-stage/Payload/global.app" \
            --native-build-report "$RUNNER_TEMP/ios-evidence/native-device.json" \
            --work "$RUNNER_TEMP/ios-parity-Mac-copy" \
            --evidence "$RUNNER_TEMP/ios-evidence/playcover-native" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/playcover-native.log"
          python3 -B ios/ci/verify_playcover_native_imports.py --repo . \
            --converter-variant nightly-1633 \
            --app "$RUNNER_TEMP/ios-build/ipa-stage/Payload/global.app" \
            --native-build-report "$RUNNER_TEMP/ios-evidence/native-device.json" \
            --work "$RUNNER_TEMP/ios-parity-Mac-1633-copy" \
            --evidence "$RUNNER_TEMP/ios-evidence/playcover-native-1633" \
            2>&1 | tee "$RUNNER_TEMP/ios-evidence/playcover-native-1633.log"
          python3 -B ios/ci/finalize_parity_candidate.py --repo . \
            --work "$RUNNER_TEMP/ios-build" --evidence "$RUNNER_TEMP/ios-evidence" \
            --delivery "$RUNNER_TEMP/ios-candidate"

      - name: Require portable and Go tests to have passed
        if: ${{ always() && inputs.mode != 'runtime-inputs' }}
        env:
          PORTABLE_TEST_OUTCOME: ${{ steps.preflight.outcome }}
          GO_TEST_OUTCOME: ${{ steps.go_tests.outcome }}
        run: |
          set -euo pipefail
          printf 'Portable test outcome: %s\nGo test outcome: %s\n' "$PORTABLE_TEST_OUTCOME" "$GO_TEST_OUTCOME"
          test "$PORTABLE_TEST_OUTCOME" = success
          test "$GO_TEST_OUTCOME" = success

      - name: Optionally retain completed verified official payload and original producer proof
        id: retain_payload
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/ios-evidence/payload/payload-build.json" ]; then
            python3 -B ios/ci/retain_payload.py --repo . \
              --payload "$RUNNER_TEMP/ios-build/shared-payload" \
              --proof "$RUNNER_TEMP/ios-evidence/payload/payload-build.json" \
              --output "$RUNNER_TEMP/ios-verified-payload-retention"
            echo 'retained=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload verified official payload, explicitly not an IPA or runtime proof
        if: ${{ always() && steps.retain_payload.outputs.retained == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: elichika-ios-verified-shared-payload-NOT-IPA-${{ github.sha }}
          path: ${{ runner.temp }}/ios-verified-payload-retention/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve real dependency inputs, explicitly not an IPA or runtime proof
        if: ${{ inputs.mode == 'runtime-inputs' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: elichika-ios-runtime-inputs-NOT-IPA-${{ github.sha }}
          path: ${{ runner.temp }}/ios-built-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload explicitly untested actual-game candidate
        if: ${{ inputs.mode == 'full-candidate' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: elichika-sifas-ios-UNTESTED-${{ github.sha }}
          path: ${{ runner.temp }}/ios-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload explicitly experimental Archive-pending physical-device-untested QA IPA
        if: ${{ (inputs.mode == 'experimental-candidate' || inputs.mode == 'experimental-package' || inputs.mode == 'experimental-parity') && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: elichika-sifas-EXPERIMENTAL-ARCHIVE_PENDING-UNTESTED_DEVICE-${{ github.sha }}
          path: ${{ runner.temp }}/ios-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve exact source, Apple compiler and runtime gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elichika-ios-${{ inputs.mode }}-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-evidence/
          if-no-files-found: warn
          retention-days: 7

  mv-export-native:
    if: ${{ inputs.mode == 'mv-export-native' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out exact MP4 encoder implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile actual iOS device and Simulator encoder sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mv-export-evidence"
          for mv_sdk in iphoneos iphonesimulator; do
            mv_target=arm64-apple-ios13.0
            if [ "$mv_sdk" = iphonesimulator ]; then mv_target=arm64-apple-ios13.0-simulator; fi
            xcrun --sdk "$mv_sdk" clang++ -target "$mv_target" -isysroot "$(xcrun --sdk "$mv_sdk" --show-sdk-path)" \
              -std=c++17 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-deprecated-declarations \
              -Wno-nullability-completeness -fsyntax-only ios/native/ElichikaMVEncoder.mm \
              ios/native/SIFASMVExportBindings.mm ios/native/SIFASMVExportBootstrap.mm \
              ios/native/SIFASMVExportSession.mm \
              2>&1 | tee "$RUNNER_TEMP/mv-export-evidence/$mv_sdk-compile.txt"
          done
      - name: Check fixed-frame ownership and exact offline shims
        run: |
          set -euo pipefail
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -pedantic ios/native/tests/MVExportClockTests.cpp -o "$RUNNER_TEMP/mv-export-clock-tests"
          "$RUNNER_TEMP/mv-export-clock-tests"
          python3 -B -m unittest discover -s ios/ci -p test_mv_export_patch.py -v
      - name: Encode and independently decode actual MP4 video and AAC audio
        run: |
          set -euo pipefail
          python3 -B ios/native/tests/run_mv_encoder_integration.py --out "$RUNNER_TEMP/mv-export-runtime" \
            2>&1 | tee "$RUNNER_TEMP/mv-export-evidence/runtime.txt"
      - name: Record exact encoder source and test scope
        if: always()
        env:
          MV_SOURCE: ${{ github.sha }}
          MV_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PYCODE'
          import pathlib,json,hashlib,os
          root=pathlib.Path('.');paths=['ios/native/ElichikaMVEncoder.h','ios/native/ElichikaMVEncoder.mm','ios/native/tests/MVEncoderIntegration.mm','ios/native/tests/run_mv_encoder_integration.py','ios/native/SIFASMVExportBindings.h','ios/native/SIFASMVExportBindings.mm','ios/native/SIFASMVExportBootstrap.mm','ios/native/SIFASMVExportPatchProfile.h','ios/native/SIFASMVExportSession.h','ios/native/SIFASMVExportSession.mm','ios/native/MVExportClock.hpp','ios/build/mv_export_patch.py','ios/build/mv_export_profile.json']
          r={'source':os.environ['MV_SOURCE'],'run':os.environ['MV_RUN'],'scope':'Actual Apple encoder and independent decode; actual SIFAS MV stepping/render/audio NOT established','AV1_supported':False,'sources':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'mv-export-evidence';out.mkdir(exist_ok=True);(out/'source-and-scope.json').write_text(json.dumps(r,indent=2)+'\n')
          PYCODE
      - name: Preserve actual encoder compilation and MP4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv-export-native-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mv-export-evidence
            ${{ runner.temp }}/mv-export-runtime
          if-no-files-found: error
          retention-days: 7

  android-game-build:
    if: ${{ inputs.mode == 'mv-export-android-game' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLIENT_BUILD: ${{ inputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact full-game Android implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: ci/sifas_mv_export
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact source closure and packaging scope once
        working-directory: ci/sifas_mv_export
        run: |
          python3 -B - <<'PYCODE'
          import os,sys
          import build_android_mv
          build_android_mv.verify_source_lock()
          sys.path.insert(0,'metadata')
          from client_build_version import BuildVersion
          BuildVersion.parse(os.environ['CLIENT_BUILD'])
          PYCODE
          python3 -B -m unittest -v test_build_android_mv
          PYTHONPATH=metadata python3 -B -m unittest discover -s metadata/tests -v
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install exact Android SDK and NDK tools once
        run: sdkmanager "cmdline-tools;12.0" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358"
      - name: Fetch only the exact reviewed GL and JP original APKs
        run: |
          python3 -B - <<'PYCODE'
          import os,pathlib,urllib.request,hashlib,json,sys
          sys.path.insert(0,'ci/sifas_mv_export');import build_android_mv as build
          for region in ('GL','JP'):
              pin=build.BASELINES[region]
              out=pathlib.Path(os.environ['RUNNER_TEMP'])/('original-'+region+'.apk')
              url='https://github.com/tagundo/elichika/releases/download/v2026.11.14.1/LLAS_'+region+'_FOVMOD_b25.apk'
              h=hashlib.sha256();count=0
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept-Encoding':'identity'}),timeout=60) as response,out.open('xb') as target:
                  while chunk:=response.read(1024*1024):
                      count+=len(chunk)
                      if count>pin['bytes']:raise RuntimeError('Original '+region+' APK size exceeded its pin')
                      h.update(chunk);target.write(chunk)
              if count!=pin['bytes'] or h.hexdigest()!=pin['sha256']:raise RuntimeError('Original '+region+' APK full hash differs')
              print(json.dumps({'region':region,'bytes':count,'sha256':h.hexdigest(),'source':url}))
          PYCODE
      - name: Build GL then JP and prove every retained member
        run: |
          for mv_region in GL JP; do
            python3 -B ci/sifas_mv_export/build_android_mv.py --execute --region "$mv_region" \
              --input-apk "$RUNNER_TEMP/original-$mv_region.apk" --sdk "$ANDROID_HOME" \
              --work "$RUNNER_TEMP/android-mv-$mv_region" --build "$CLIENT_BUILD"
          done
      - name: Stage only two unsigned APKs, two proofs and combined checksums
        run: |
          python3 -B - <<'PYCODE'
          import os,pathlib,hashlib,json,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          delivery=root/'android-mv-delivery'
          delivery.mkdir(mode=0o700)
          version=os.environ['CLIENT_BUILD'];sums=[];expected=set()
          for region in ('GL','JP'):
              work=root/('android-mv-'+region)
              name='LLAS_'+region+'_FOVMOD_'+version+'-unsigned.apk'
              apk=work/name;proof=work/(name+'.proof.json')
              if any(not p.is_file() or p.is_symlink() for p in (apk,proof)):raise RuntimeError('Missing ordinary '+region+' candidate/proof')
              if proof.stat().st_size>8*1024*1024:raise RuntimeError('Candidate proof exceeds its bound')
              record=json.loads(proof.read_text())
              if record.get('status')!='UNSIGNED_FULL_MV_CANDIDATE_NOT_DEVICE_VALIDATED' or record.get('region')!=region or record.get('build')!=version:raise RuntimeError('Candidate proof identity differs')
              h=hashlib.sha256();count=0
              with apk.open('rb') as source:
                  while block:=source.read(1024*1024):h.update(block);count+=len(block)
              if count!=record['output']['bytes'] or h.hexdigest()!=record['output']['sha256'] or pathlib.Path(record['output']['path']).resolve()!=apk.resolve():raise RuntimeError('Candidate bytes differ from proof')
              for source in (apk,proof):
                  target=delivery/source.name
                  if target.exists():raise RuntimeError('Delivery filename collision')
                  shutil.copyfile(source,target);expected.add(target.name)
              sums.append(h.hexdigest()+'  '+name+'\n')
          (delivery/'SHA256SUMS').write_text(''.join(sums));expected.add('SHA256SUMS')
          if {p.name for p in delivery.iterdir()}!=expected or len(expected)!=5:raise RuntimeError('Unreviewed delivery output')
          print(json.dumps({'unsigned_only':True,'files':sorted(expected),'regions':['GL','JP'],'signing':False}))
          PYCODE
      - name: Preserve exact unsigned APKs and complete source/native/payload proofs
        uses: actions/upload-artifact@v4
        with:
          name: android-mv-full-UNSIGNED-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/android-mv-delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve specific build failure diagnostics without game payloads
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-mv-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/android-mv-GL/*.stdout
            ${{ runner.temp }}/android-mv-GL/*.stderr
            ${{ runner.temp }}/android-mv-GL/dex/*.stdout
