name: Actual PlayCover Apple Silicon client QA

on:
  push:
    branches: [codex/playcover-qa-20261113]
  workflow_dispatch:

permissions:
  # Draft releases are visible only to a token with repository write access.
  # This workflow uses it solely for hash-bound asset GET downloads.
  contents: write
  actions: read

concurrency:
  group: actual-playcover-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apple-silicon-playcover:
    if: github.repository == 'tagundo/elichika'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read frozen fixture manifest
        id: fixture
        run: |
          mkdir -p "$RUNNER_TEMP/playcover-fixtures" "$RUNNER_TEMP/playcover-evidence"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('qa/playcover/manifest.json').read_text())
          evidence=Path(os.environ['RUNNER_TEMP'])/'playcover-evidence'
          (evidence/'allocation-and-fixture-manifest.json').write_text(json.dumps({'status':'MAC_ALLOCATED_FIXTURES_PENDING','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'manifest':m},indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('server_ref='+m['server_source_ref']+'\n')
          PY

      - name: Test portable original-versus-feature import classification
        run: python3 -B -m unittest discover -s qa/playcover -p test_qa_contract.py -v

      - name: Fetch only frozen private draft IPA assets
        id: fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.loads(Path('qa/playcover/manifest.json').read_text())
          work=Path(os.environ['RUNNER_TEMP'])/'playcover-fixtures'
          for item in m.get('controls',[])+m['candidates']:
              with (work/item['name']).open('wb') as target:
                  subprocess.run(['env','-u','GH_TOKEN','gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/assets/'+str(item['asset_id']),'-H','Accept: application/octet-stream'],stdout=target,check=True)
              with (work/item['name']).open('rb') as stream:
                  assert hashlib.file_digest(stream,'sha256').hexdigest()==item['sha256']
          PY

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout exact root-frozen Elichika and official assets
        uses: actions/checkout@v4
        with:
          repository: tagundo/elichika
          ref: ${{ steps.fixture.outputs.server_ref }}
          path: server-source
          submodules: recursive
          persist-credentials: false

      - name: Build fresh disposable server and synthetic playable account
        id: server
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          runtime=(Path(os.environ['GITHUB_WORKSPACE'])/'server-source').resolve()
          assert os.environ.get('GITHUB_ACTIONS')=='true' and runtime.is_dir()
          legacy=runtime/'yumemichi_userdata.db'
          assert hashlib.sha256(legacy.read_bytes()).hexdigest()=='90680f5885dc680c17eddbbff145a561901f06e69b8e412d98b55157aa5c0b27'
          assert not (runtime/'userdata.db').exists(), 'Disposable runtime must not contain user data before initial launch'
          omitted={'scope':'Only task-owned fresh CI runtime; original repository legacy template retained',
              'omitted_template':'yumemichi_userdata.db','sha256':hashlib.sha256(legacy.read_bytes()).hexdigest(),
              'userdata_absent_before_first_go_execution':True}
          legacy.unlink()
          assert not legacy.exists()
          (Path(os.environ['RUNNER_TEMP'])/'playcover-evidence/fresh-runtime-fixture.json').write_text(json.dumps(omitted,indent=2)+'\n')
          Path('server-source/config.json').write_text(json.dumps({'server_address':'127.0.0.1:8080','locales':'ja,en','tutorial':False,'cdn_cache':False}))
          PY
          cd server-source
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/elichika-playcover-server" .
          "$RUNNER_TEMP/elichika-playcover-server" rebuild_assets > "$RUNNER_TEMP/playcover-evidence/server-data-init.log" 2>&1
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/playcover-seeder" ../qa/playcover/seed_account.go
          ELICHIKA_TEST_RUNTIME="$PWD" ELICHIKA_TEST_FIXTURE_LANGUAGE=en "$RUNNER_TEMP/playcover-seeder" > "$RUNNER_TEMP/playcover-evidence/synthetic-account-init.log" 2>&1
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          binary=Path(os.environ['RUNNER_TEMP'])/'elichika-playcover-server'
          record={'server_source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'server_binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),
             'go_version':subprocess.check_output(['go','version'],text=True).strip(),
             'build_args':['CGO_ENABLED=0','go','build','-trimpath'],
             'submodules':subprocess.check_output(['git','submodule','status','--recursive'],text=True),
             'fixture':'Fresh official server data and synthetic playable account123456789; no real user data'}
          (Path(os.environ['RUNNER_TEMP'])/'playcover-evidence/server-build.json').write_text(json.dumps(record,indent=2)+'\n')
          PY

      - name: Actually import and launch all three IPAs through pinned PlayCover
        if: ${{ always() && steps.fixtures.outcome == 'success' }}
        env:
          SERVER_READY_FOR_QA: ${{ steps.server.outcome == 'success' }}
        run: |
          if [ "$SERVER_READY_FOR_QA" = true ]; then
            python3 qa/playcover/run_qa.py --fixtures "$RUNNER_TEMP/playcover-fixtures" \
              --evidence "$RUNNER_TEMP/playcover-evidence" \
              --server-source "$GITHUB_WORKSPACE/server-source" \
              --server-binary "$RUNNER_TEMP/elichika-playcover-server"
          else
            python3 qa/playcover/run_qa.py --fixtures "$RUNNER_TEMP/playcover-fixtures" \
              --evidence "$RUNNER_TEMP/playcover-evidence"
          fi

      - name: Preserve actual private Mac UI evidence and exact failed stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playcover-v2-actual-evidence
          path: |
            ${{ runner.temp }}/playcover-evidence/
            !${{ runner.temp }}/playcover-evidence/**/candidate-macho/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
