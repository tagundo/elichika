name: Original SIFAS client Android UI QA

on:
  push:
    branches: [codex/original-client-ui-qa]
    paths: ['.github/workflows/client-ui.yml', 'tests/client_ui_qa.py']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  client:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Prepare native ARM64 Android virtual device
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/android-data"
          uname -a > evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker run --detach --privileged --name original-client-qa \
            --publish 127.0.0.1:5555:5555 --volume "$RUNNER_TEMP/android-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=1280 androidboot.redroid_height=720 androidboot.redroid_fps=15 ro.secure=0
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt

      - name: Install genuine Google dependencies in disposable Android
        timeout-minutes: 6
        run: |
          set -euo pipefail
          exec > >(tee evidence/google-dependency-preparation.log) 2>&1
          curl --fail --location --retry 2 --max-time 90 --output gapps.zip https://github.com/MindTheGapps/14.0.0-arm64/releases/download/MindTheGapps-14.0.0-arm64-20250203_200051/MindTheGapps-14.0.0-arm64-20250203_200051.zip
          echo '6e1c3616862ce5b33e2b96074f86ae846eb1351a26a980e1ed140f8a7e7a4fd6  gapps.zip' | sha256sum --check
          python3 - <<'PYZIP'
          import zipfile
          selected=('system/product/priv-app/GmsCore/','system/product/priv-app/Phonesky/',
                    'system/system_ext/priv-app/GoogleServicesFramework/',
                    'system/product/etc/permissions/','system/product/etc/sysconfig/',
                    'system/system_ext/etc/permissions/')
          with zipfile.ZipFile('gapps.zip') as z:
              for name in z.namelist():
                  if name.startswith(selected):z.extract(name,'gapps')
          PYZIP
          adb -s 127.0.0.1:5555 push gapps/system/product/. /product/
          adb -s 127.0.0.1:5555 push gapps/system/system_ext/. /system_ext/
          adb -s 127.0.0.1:5555 shell chmod 644 /product/priv-app/GmsCore/GmsCore.apk /product/priv-app/Phonesky/Phonesky.apk /system_ext/priv-app/GoogleServicesFramework/GoogleServicesFramework.apk
          docker restart original-client-qa
          adb disconnect 127.0.0.1:5555 || true
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          for package in com.google.android.gms com.android.vending com.google.android.gsf; do
            adb -s 127.0.0.1:5555 shell pm path "$package"
            adb -s 127.0.0.1:5555 shell dumpsys package "$package" > "evidence/$package-package.txt"
          done

      - name: Upload Google dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-client-google-dependencies
          path: |
            evidence/google-dependency-preparation.log
            evidence/*-package.txt

      - name: Download exact previously signed and validated server APK
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate
          run-id: 36910677429
          github-token: ${{ github.token }}

      - name: Download user-selected unmodified game client
        run: |
          curl --fail --location --retry 2 --output client.apk https://github.com/arina999999997/elichika/releases/download/clients/LLAS_GL_LOCAL.apk
          echo '8aaaeac075afa1c7908e6b91ab4d7f6a9e3cbf298574c0fa59fab51081dde82e  client.apk' | sha256sum --check
          echo '23df494e132db7f3537851b11424bbe2903082e756e0798a7bf7ea022ba1ba2a  candidate/elichika-2026.10.01-dev.apk' | sha256sum --check

      - name: Prepare read-only Unity UI hierarchy collector
        timeout-minutes: 5
        run: |
          set -euo pipefail
          exec > >(tee evidence/unity-preparation.log) 2>&1
          python3 -m pip install --break-system-packages 'frida==17.21.0'
          npm install --prefix qa-runtime 'frida-il2cpp-bridge@0.14.0'
          curl --fail --location --retry 2 --output frida-server.xz https://github.com/frida/frida/releases/download/17.21.0/frida-server-17.21.0-android-arm64.xz
          echo 'a5a712d5b1a75837cfd500adc1ee41cc259446cbc2c386f4922d235c890b18d9  frida-server.xz' | sha256sum --check
          xz --decompress frida-server.xz
          adb -s 127.0.0.1:5555 push frida-server /data/local/tmp/frida-server
          adb -s 127.0.0.1:5555 shell chmod 755 /data/local/tmp/frida-server

      - name: Start bounded Unity UI collector service
        timeout-minutes: 1
        run: |
          adb -s 127.0.0.1:5555 shell 'nohup /data/local/tmp/frida-server -l 127.0.0.1:27042 > /data/local/tmp/frida-server.log 2>&1 < /dev/null &'
          adb -s 127.0.0.1:5555 forward tcp:27042 tcp:27042
          python3 -c 'import frida; d=frida.get_device_manager().add_remote_device("127.0.0.1:27042"); print("Frida processes:", len(d.enumerate_processes()))'

      - name: Upload collector preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-client-collector-preparation
          path: evidence/unity-preparation.log

      - name: Install and launch the original client with the server
        run: python3 -u tests/client_ui_qa.py --stage initial --server candidate/elichika-2026.10.01-dev.apk --client client.apk --evidence evidence/initial

      - name: Upload initial UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-client-initial
          path: |
            evidence/initial/
            evidence/client-ui-state.json
            evidence/android-properties.txt
            evidence/host.txt
          if-no-files-found: warn

      - name: Observe and drive client UI round 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u tests/client_ui_qa.py --stage control --round 1 --duration 60 --evidence evidence/round-1

