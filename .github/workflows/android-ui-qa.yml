name: Rina original-game scene validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-unity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - name: Prepare disposable native ARM64 Android
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/android-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker image inspect redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa --format '{{json .RepoDigests}} {{.Architecture}}' >> evidence/host.txt
          docker run --detach --privileged --name rina-unity-qa \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.hardware | tr -d '\r')" = redroid
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt
          adb -s 127.0.0.1:5555 shell settings --user 0 put secure immersive_mode_confirmations confirmed

      - name: Install unchanged public original GL3.12 player
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" \
            https://github.com/arina999999997/elichika/releases/download/clients/LLAS_GL_LOCAL.apk
          printf '%s  %s\n' 8aaaeac075afa1c7908e6b91ab4d7f6a9e3cbf298574c0fa59fab51081dde82e "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" | sha256sum --check
          adb -s 127.0.0.1:5555 install -r -g "$RUNNER_TEMP/LLAS_GL_LOCAL.apk"
          adb -s 127.0.0.1:5555 shell dumpsys package com.klab.lovelive.allstars.global > evidence/game-package.txt

      - name: Download frozen APK10 provider without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate
          run-id: 42269124453
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare pinned late-attach tooling
        run: |
          set -euo pipefail
          bash tests/rina_scene_qa/prepare_tools.sh \
            "$RUNNER_TEMP/qa-python" "$RUNNER_TEMP/qa-tools" \
            127.0.0.1:5555 evidence/tools.json
          mkdir -p tests/gl_ui_runtime/package/dist
          cp "$RUNNER_TEMP/qa-tools/package/dist/index.js" tests/gl_ui_runtime/package/dist/index.js

      - name: Publish public Rina fixture and bootstrap the original game
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence/qa-source.txt
          mapfile -t qa_apks < <(rg --files candidate | rg '\.apk$')
          test "${#qa_apks[@]}" = 1
          "$RUNNER_TEMP/qa-python/bin/python" -u tests/rina_scene_qa/scene_bootstrap.py \
            --candidate "${qa_apks[0]}" --game "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" \
            --temporary "$RUNNER_TEMP/rina-scenes" --evidence evidence/gl \
            --live-python "$RUNNER_TEMP/qa-python/bin/python" \
            --bridge "$RUNNER_TEMP/qa-tools/package/dist/index.js"

      - name: Publish initial original-game scene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rina-original-scene-bootstrap
          path: evidence
          retention-days: 14

      - name: Scoped original-game follow-up 1
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '1'

      - name: Scoped original-game follow-up 2
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '2'

      - name: Scoped original-game follow-up 3
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '3'

      - name: Scoped original-game follow-up 4
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '4'

      - name: Scoped original-game follow-up 5
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '5'

      - name: Scoped original-game follow-up 6
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '6'

      - name: Scoped original-game follow-up 7
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '7'

      - name: Scoped original-game follow-up 8
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '8'

      - name: Scoped original-game follow-up 9
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '9'

      - name: Scoped original-game follow-up 10
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '10'

      - name: Scoped original-game follow-up 11
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
