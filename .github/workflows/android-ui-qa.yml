name: Retest frozen C3 APK on 4KB and 16KB kernels

on:
  workflow_dispatch:
    inputs:
      candidate_sha256:
        required: true
        default: "6a4ebc6c48acd48bbe87f3e6ece0b6f9e16f76af063b7b2c750de3f4e48262b8"
      version_name:
        required: true
        default: "2026.11.11.5"

permissions:
  contents: read
  actions: read

jobs:
  native-16k:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind original signed APK and unchanged product sources
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_INPUT_SHA: ${{ inputs.candidate_sha256 }}
          EXPECTED_INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import ast, hashlib, json, os, subprocess
          from pathlib import Path
          base='a325cdb69fb098edb2a26ebb4cf30dff8a188c0e'
          assert os.environ['EXPECTED_INPUT_SHA']=='6a4ebc6c48acd48bbe87f3e6ece0b6f9e16f76af063b7b2c750de3f4e48262b8'
          assert os.environ['EXPECTED_INPUT_VERSION']=='2026.11.11.5'
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          assert git('diff','--name-only',base,'HEAD').splitlines()==['.github/workflows/android-ui-qa.yml','tests/android_16k_native.py']
          assert git('ls-tree','HEAD','modtools').split()[2]=='d6f59c804e79d4fec84b70776d03a02c2c583729'
          assert Path('macos/VERSION').read_text().strip()=='2026.11.11.5'
          old=subprocess.check_output(['git','show',base+':tests/android_16k_native.py'],text=True)
          new=Path('tests/android_16k_native.py').read_text()
          assert hashlib.sha256(new.encode()).hexdigest()=='fd80522ec8b7c8792fae958d644a5b441f4b3d4faabca0a1d1dc9e8fcaa370b0'
          assert [ast.dump(n) for n in ast.walk(ast.parse(old)) if isinstance(n,ast.Assert)]==[ast.dump(n) for n in ast.walk(ast.parse(new)) if isinstance(n,ast.Assert)]
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/'+path]))
          run=api('actions/runs/43042615381'); assert run['head_sha']==base and run['path']=='.github/workflows/android.yml'
          artifact=api('actions/artifacts/13865529742')
          assert artifact['name']=='elichika-release-apk' and not artifact['expired']
          assert artifact['workflow_run']['id']==43042615381 and artifact['workflow_run']['head_sha']==base
          assert artifact['digest']=='sha256:f107fd4aa873b0557f99f30cf1ed77b2fb50e1af7e1aac0d3c01ba5dba3aefc4'
          Path('evidence/frozen-source.json').write_text(json.dumps({'status':'PASS_IDENTICAL_PRODUCT_SOURCES','original_source':base,'qa_source':git('rev-parse','HEAD'),'artifact':artifact,'test_sha256':'fd80522ec8b7c8792fae958d644a5b441f4b3d4faabca0a1d1dc9e8fcaa370b0','all_original_assertions_equal':True},indent=2)+'\n')
          PY


      - name: Select reachable Ubuntu-signature-verified package mirrors
        run: |
          mkdir -p evidence
          sudo env ELICHIKA_APT_EVIDENCE="$PWD/evidence" python3 android/ci/prepare_ubuntu_apt.py

      - name: Prepare software ARM VM and official 16KB Android image
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-arm cpio e2fsprogs erofs-utils android-sdk-libsparse-utils
          python3 -c 'import os,subprocess; subprocess.run([os.environ["ANDROID_HOME"]+"/cmdline-tools/latest/bin/sdkmanager","--licenses"],input=b"y\n"*100,check=True,stdout=subprocess.DEVNULL)'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'system-images;android-35;google_apis_ps16k;arm64-v8a'

      - name: Download this build's signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate
          run-id: 43042615381
          github-token: ${{ github.token }}

      - name: Require exact original APK bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=list(Path('candidate').glob('*.apk')); assert len(files)==1 and files[0].name=='elichika-2026.11.11.5.apk'
          data=files[0].read_bytes(); assert len(data)==290730604
          sha=hashlib.sha256(data).hexdigest(); assert sha=='6a4ebc6c48acd48bbe87f3e6ece0b6f9e16f76af063b7b2c750de3f4e48262b8'
          Path('evidence/frozen-apk.json').write_text(json.dumps({'status':'PASS_ORIGINAL_SIGNED_APK','sha256':sha,'bytes':len(data),'rebuilt':False},indent=2)+'\n')
          PY

      - name: Select Ubuntu-signature-verified ARM64 BusyBox mirror
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'android/ci')
          import prepare_ubuntu_apt as helper
          attempts=[]
          with tempfile.TemporaryDirectory(prefix='busybox-mirror-') as temporary:
              base=helper.verified_mirror(helper.ROOTS['arm64'],['noble'],Path(temporary),attempts)
          Path('evidence/busybox-mirror.json').write_text(json.dumps({'status':'PASS_UBUNTU_SIGNED_ARM64_MIRROR','base':base,'attempts':attempts},indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write('ELICHIKA_UBUNTU_PORTS_BASE='+base+'\n')
          print(json.dumps({'status':'PASS_UBUNTU_SIGNED_ARM64_MIRROR','base':base}))
          PY

      - name: Run original APK server, Python packages and ASTC on both kernels
        run: >-
          python3 -u tests/android_16k_native.py
          --candidate "candidate/elichika-${{ inputs.version_name }}.apk"
          --candidate-sha256 "${{ inputs.candidate_sha256 }}"
          --image "$ANDROID_HOME/system-images/android-35/google_apis_ps16k/arm64-v8a"
          --ndk "$ANDROID_NDK_HOME"
          --work "$RUNNER_TEMP/android-16k-native"
          --evidence evidence

      - name: Upload 16KB diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-16k-native-evidence
          path: evidence/
          if-no-files-found: warn
