      - name: Scoped original-game follow-up 17
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '17'

      - name: Scoped original-game follow-up 18
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '18'

      - name: Scoped original-game follow-up 19
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '19'

      - name: Scoped original-game follow-up 20
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '20'

      - name: Scoped original-game follow-up 21
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '21'

      - name: Scoped original-game follow-up 22
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '22'

      - name: Scoped original-game follow-up 23
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '23'

      - name: Scoped original-game follow-up 24
        if: ${{ success() && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/rina-scene-followup
        with:
          sequence: '24'

      - name: Stop read-only observer and audit actual scene evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/scene-observer
          touch evidence/scene-observer/stop.marker
          if [ -f evidence/scene-observer/host-pid.txt ]; then
            for attempt in $(seq 1 20); do
              test -f evidence/scene-observer/summary.json && break
              sleep 1
            done
          fi
          python3 tests/rina_scene_qa/audit_scenes.py --evidence evidence

      - name: Collect sanitized original-game diagnostics
        if: always()
        run: |
          mkdir -p evidence
          python3 tests/rina_scene_qa/collect_scene_diagnostics.py --evidence evidence || true
          adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/final-screen.png 2>/dev/null || true
          docker logs rina-unity-qa > evidence/container.log 2>&1 || true
          docker rm --force rina-unity-qa || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rina-original-scene-evidence
          path: evidence
          retention-days: 14
