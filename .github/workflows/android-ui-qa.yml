name: Rina serialized AnimationEvent runtime experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-unity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare disposable native ARM64 Android
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          test "$(command -v adb)" = /usr/bin/adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/rina-single-model-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker image inspect redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa --format '{{json .RepoDigests}} {{.Architecture}}' >> evidence/host.txt
          docker run --detach --privileged --name rina-single-model-qa \
            --label "elichika.qa.scope=rina-single-model" --label "elichika.qa.run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/rina-single-model-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          python3 tests/rina_single_model_qa/ownership.py > evidence/ownership.json
          export ELICHIKA_SINGLE_MODEL_REAL_ADB=/usr/bin/adb
          export PATH="$GITHUB_WORKSPACE/tests/rina_single_model_qa:$PATH"
          test -x "$GITHUB_WORKSPACE/tests/rina_single_model_qa/adb"
          test "$(command -v adb)" = "$GITHUB_WORKSPACE/tests/rina_single_model_qa/adb"
          echo ELICHIKA_SINGLE_MODEL_REAL_ADB=/usr/bin/adb >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/tests/rina_single_model_qa" >> "$GITHUB_PATH"
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.hardware | tr -d '\r')" = redroid
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt

      - name: Install unchanged public original GL3.12 player
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" \
            https://github.com/arina999999997/elichika/releases/download/clients/LLAS_GL_LOCAL.apk
          printf '%s  %s\n' 8aaaeac075afa1c7908e6b91ab4d7f6a9e3cbf298574c0fa59fab51081dde82e "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" | sha256sum --check
          adb -s 127.0.0.1:5555 install -r -g "$RUNNER_TEMP/LLAS_GL_LOCAL.apk"
          adb -s 127.0.0.1:5555 shell dumpsys package com.klab.lovelive.allstars.global > evidence/game-package.txt

      - name: Prepare pinned late-attach tooling
        run: >-
          bash tests/rina_scene_qa/prepare_tools.sh
          "$RUNNER_TEMP/qa-python" "$RUNNER_TEMP/qa-tools"
          127.0.0.1:5555 evidence/tools.json

      - name: Observe owned prefab natural serialized event delivery
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence/qa-source.txt
          "$RUNNER_TEMP/qa-python/bin/python" -u tests/rina_single_model_qa/run.py \
            --manifest tests/rina_single_model_qa/fixtures/manifest.json \
            --bridge "$RUNNER_TEMP/qa-tools/package/dist/index.js" \
            --output evidence/single-model

      - name: Audit actual serialized event delivery and controls
        run: |
          set -euo pipefail
          python3 tests/rina_single_model_qa/audit.py \
            --evidence evidence/single-model \
            --manifest tests/rina_single_model_qa/fixtures/manifest.json \
            --output evidence/single-model-verdict.json

      - name: Collect diagnostics and stop only the owned Android
        if: always()
        run: |
          mkdir -p evidence
          if python3 tests/rina_single_model_qa/ownership.py > evidence/cleanup-ownership.json 2> evidence/cleanup-ownership-error.txt; then
            docker logs rina-single-model-qa > evidence/container.log 2>&1 || true
            adb -s 127.0.0.1:5555 logcat -d -t 2000 -s Unity:I AndroidRuntime:E > evidence/unity-logcat.txt 2>&1 || true
            adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/final-screen.png 2>/dev/null || true
            adb -s 127.0.0.1:5555 shell am force-stop com.klab.lovelive.allstars.global || true
            python3 tests/rina_single_model_qa/ownership.py > evidence/remove-ownership.json
            docker rm --force rina-single-model-qa
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rina-single-model-unity-evidence
          path: evidence
          retention-days: 14
