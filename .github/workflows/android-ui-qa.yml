name: Rina same-board authored-scale original scenes

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-unity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare disposable native ARM64 Android
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          test "$(command -v adb)" = /usr/bin/adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/rina-authored-sync-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker image inspect redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa --format '{{json .RepoDigests}} {{.Architecture}}' >> evidence/host.txt
          docker run --detach --privileged --name rina-authored-sync-qa \
            --label "elichika.qa.scope=rina-authored-sync-scene" --label "elichika.qa.run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/rina-authored-sync-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          python3 tests/rina_authored_sync_scene_qa/ownership.py > evidence/ownership.json
          export ELICHIKA_AUTHORED_SYNC_REAL_ADB=/usr/bin/adb
          export PATH="$GITHUB_WORKSPACE/tests/rina_authored_sync_scene_qa:$PATH"
          test -x "$GITHUB_WORKSPACE/tests/rina_authored_sync_scene_qa/adb"
          test "$(command -v adb)" = "$GITHUB_WORKSPACE/tests/rina_authored_sync_scene_qa/adb"
          echo ELICHIKA_AUTHORED_SYNC_REAL_ADB=/usr/bin/adb >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/tests/rina_authored_sync_scene_qa" >> "$GITHUB_PATH"
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.hardware | tr -d '\r')" = redroid
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt
          # Fresh Android OS education setup from the proven normal-stage lane.
          # No original-game PlayerPrefs or tutorial fields are changed.
          adb -s 127.0.0.1:5555 shell settings --user 0 put secure immersive_mode_confirmations confirmed
          test "$(adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r')" = confirmed

      - name: Install unchanged public original GL3.12 player
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" \
            https://github.com/arina999999997/elichika/releases/download/clients/LLAS_GL_LOCAL.apk
          printf '%s  %s\n' 8aaaeac075afa1c7908e6b91ab4d7f6a9e3cbf298574c0fa59fab51081dde82e "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" | sha256sum --check
          adb -s 127.0.0.1:5555 install -r -g "$RUNNER_TEMP/LLAS_GL_LOCAL.apk"
          adb -s 127.0.0.1:5555 shell dumpsys package com.klab.lovelive.allstars.global > evidence/game-package.txt

      - name: Download frozen signed tutorial provider without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate
          run-id: 42339779291
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare pinned late-attach tooling
        run: >-
          bash tests/rina_scene_qa/prepare_tools.sh
          "$RUNNER_TEMP/qa-python" "$RUNNER_TEMP/qa-tools"
          127.0.0.1:5555 evidence/tools.json

      - name: Bind frozen UI bridge and validate bounded host contracts
        run: |
          set -euo pipefail
          mkdir -p tests/gl_ui_runtime/package/dist
          cp "$RUNNER_TEMP/qa-tools/package/dist/index.js" tests/gl_ui_runtime/package/dist/index.js
          python3 -m unittest discover -s tests/rina_authored_sync_scene_qa -p 'test_*.py' -v

      - name: Publish disposable models and traverse actual normal scenes
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence/qa-source.txt
          mapfile -t qa_apks < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in Path("candidate").rglob("*.apk") if p.is_file()))')
          test "${#qa_apks[@]}" = 1
          "$RUNNER_TEMP/qa-python/bin/python" -u tests/rina_authored_sync_scene_qa/run.py \
            --candidate "${qa_apks[0]}" --game "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" \
            --temporary "$RUNNER_TEMP/authored-sync-scenes" --evidence evidence/authored-sync \
            --live-python "$RUNNER_TEMP/qa-python/bin/python" \
            --bridge "$RUNNER_TEMP/qa-tools/package/dist/index.js"

      - name: Audit bound HOME, preview, four MVs, motion and initialization
        if: always()
        run: |
          python3 tests/rina_authored_sync_scene_qa/audit_scenes.py --evidence evidence

      - name: Collect diagnostics and stop only the owned Android
        if: always()
        run: |
          mkdir -p evidence
          if python3 tests/rina_authored_sync_scene_qa/ownership.py > evidence/cleanup-ownership.json 2> evidence/cleanup-ownership-error.txt; then
            docker logs rina-authored-sync-qa > evidence/container.log 2>&1 || true
            adb -s 127.0.0.1:5555 logcat -d -t 2000 -s Unity:I AndroidRuntime:E > evidence/unity-logcat.txt 2>&1 || true
            adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/final-screen.png 2>/dev/null || true
            adb -s 127.0.0.1:5555 shell am force-stop com.klab.lovelive.allstars.global || true
            python3 tests/rina_authored_sync_scene_qa/ownership.py > evidence/remove-ownership.json
            docker rm --force rina-authored-sync-qa
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rina-authored-sync-original-scene-evidence
          path: evidence
          retention-days: 14
