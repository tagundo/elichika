name: Clone original GL normal-stage candidate QA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-stage:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare separately owned native ARM64 Android
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          test "$(command -v adb)" = /usr/bin/adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/clone-stage-data"
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker run --detach --privileged --name clone-stage-original-qa \
            --label "elichika.qa.scope=clone-stage" --label "elichika.qa.run=$GITHUB_RUN_ID" \
            --publish 127.0.0.1:5555:5555 --volume "$RUNNER_TEMP/clone-stage-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          python3 tests/clone_stage_qa/ownership.py > evidence/ownership.json
          export ELICHIKA_STAGE_REAL_ADB=/usr/bin/adb
          export PATH="$GITHUB_WORKSPACE/tests/clone_stage_qa:$PATH"
          test -x "$GITHUB_WORKSPACE/tests/clone_stage_qa/adb"
          test "$(command -v adb)" = "$GITHUB_WORKSPACE/tests/clone_stage_qa/adb"
          echo ELICHIKA_STAGE_REAL_ADB=/usr/bin/adb >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/tests/clone_stage_qa" >> "$GITHUB_PATH"
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.hardware | tr -d '\r')" = redroid
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          # Android's system fullscreen education covered the first language
          # picker in42351642220. This fresh-device OS fixture matches the Rina
          # scene job; it does not write any game PlayerPrefs or gameplay state.
          adb -s 127.0.0.1:5555 shell settings --user 0 put secure immersive_mode_confirmations confirmed
          test "$(adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r')" = confirmed
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('evidence/os-fullscreen-setup.json').write_text(json.dumps({
              'scope': 'Fresh owned Redroid Android system setup only',
              'run_id': os.environ['GITHUB_RUN_ID'], 'android_user': 0,
              'setting': 'secure/immersive_mode_confirmations', 'readback': 'confirmed',
              'game_PlayerPrefs_written': False, 'gameplay_callbacks_invoked': False,
              'reason': 'Observed Android Viewing full screen/GOT IT overlay in42351642220'
          }, indent=2) + '\n')
          PY

      - name: Download unchanged original GL3.12 player
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" \
            https://github.com/arina999999997/elichika/releases/download/clients/LLAS_GL_LOCAL.apk
          printf '%s  %s\n' 8aaaeac075afa1c7908e6b91ab4d7f6a9e3cbf298574c0fa59fab51081dde82e "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" | sha256sum --check

      - name: Download frozen signed candidate without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate
          run-id: 42349362568
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare pinned read-only UI tooling and clone producer dependencies
        run: |
          set -euo pipefail
          test "$(command -v adb)" = "$GITHUB_WORKSPACE/tests/clone_stage_qa/adb"
          bash tests/clone_stage_qa/prepare_tools.sh \
            "$RUNNER_TEMP/qa-python" "$RUNNER_TEMP/qa-tools" \
            127.0.0.1:5555 evidence/tools.json
          "$RUNNER_TEMP/qa-python/bin/python" -m pip install 'UnityPy==1.25.0' 'numpy==1.26.2' 'Pillow==11.0.0'
          "$RUNNER_TEMP/qa-python/bin/python" -c 'import UnityPy; assert UnityPy.__version__ == "1.25.0"'
          mkdir -p tests/gl_ui_runtime/package/dist
          cp "$RUNNER_TEMP/qa-tools/package/dist/index.js" tests/gl_ui_runtime/package/dist/index.js
          python3 -m unittest discover -s tests/clone_stage_qa -p 'test_*.py' -v

      - name: Publish source and two private clones then enter normal MV twice
        run: |
          set -euo pipefail
          test "$(command -v adb)" = "$GITHUB_WORKSPACE/tests/clone_stage_qa/adb"
          git rev-parse HEAD > evidence/qa-source.txt
          mapfile -t qa_apks < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in Path("candidate").rglob("*.apk") if p.is_file()))')
          test "${#qa_apks[@]}" = 1
          "$RUNNER_TEMP/qa-python/bin/python" -u tests/clone_stage_qa/run.py \
            --candidate "${qa_apks[0]}" --game "$RUNNER_TEMP/LLAS_GL_LOCAL.apk" \
            --temporary "$RUNNER_TEMP/clone-stage-runtime" --evidence evidence/stage \
            --live-python "$RUNNER_TEMP/qa-python/bin/python"

      - name: Guarded owned-container teardown
        if: always()
        run: |
          mkdir -p evidence
          if python3 tests/clone_stage_qa/ownership.py > evidence/cleanup-ownership.json 2> evidence/cleanup-ownership-error.txt; then
            ELICHIKA_STAGE_REAL_ADB=/usr/bin/adb "$GITHUB_WORKSPACE/tests/clone_stage_qa/adb" -s 127.0.0.1:5555 shell am force-stop com.klab.lovelive.allstars.global || true
            python3 tests/clone_stage_qa/ownership.py > evidence/remove-ownership.json
            docker rm --force clone-stage-original-qa
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clone-normal-stage-evidence
          path: evidence
          retention-days: 14
