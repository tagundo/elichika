          printf '%s\t%s\n' "$qa_status" 'tests/viewer_resolution_browser.js' | tee -a "$EVIDENCE_DIR/continuation-status.tsv"
          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          test "$qa_failures" -eq 0

      - name: Upload neutral WebGL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-webgl-evidence
          path: ${{ runner.temp }}/viewer-webgl-evidence
          if-no-files-found: warn
