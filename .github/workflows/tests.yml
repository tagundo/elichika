name: Server regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server and asset history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Validate SQL migrations and animation mappings
        run: python3 assets/tests/validate_shooting_star.py

      - name: Validate locale text and existing-install upgrades
        run: python3 assets/tests/validate_localization.py

      - name: Run all Go tests with default vet checks
        run: python3 tests/run_go_tests.py
