          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          EVIDENCE_DIR="$EVIDENCE_DIR/framing" node tests/viewer_framing_browser.js
          qa_status=$?
          printf '%s\t%s\n' "$qa_status" 'tests/viewer_framing_browser.js' | tee -a "$EVIDENCE_DIR/continuation-status.tsv"
          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          EVIDENCE_DIR="$EVIDENCE_DIR/compensation" node tests/viewer_compensation_browser.js
          qa_status=$?
          printf '%s\t%s\n' "$qa_status" 'tests/viewer_compensation_browser.js' | tee -a "$EVIDENCE_DIR/continuation-status.tsv"
          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          node tests/sifas_material_browser.js
          qa_status=$?
          printf '%s\t%s\n' "$qa_status" 'tests/sifas_material_browser.js' | tee -a "$EVIDENCE_DIR/continuation-status.tsv"
          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          EVIDENCE_DIR="$EVIDENCE_DIR/rimlight-display" node tests/viewer_rimlight_browser.js
          qa_status=$?
          printf '%s\t%s\n' "$qa_status" 'tests/viewer_rimlight_browser.js' | tee -a "$EVIDENCE_DIR/continuation-status.tsv"
          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/mouth-centroid" node tests/viewer_mouth_depth_browser_test.js
          qa_status=$?
          printf '%s\t%s\n' "$qa_status" 'tests/viewer_mouth_depth_browser_test.js' | tee -a "$EVIDENCE_DIR/continuation-status.tsv"
          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/camera-depth" node tests/viewer_camera_browser.js
          qa_status=$?
