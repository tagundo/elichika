name: Server regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server and asset history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"

      - name: Set up Python for pinned mesh and image dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SQL migrations and animation mappings
        run: python3 assets/tests/validate_shooting_star.py

      - name: Validate locale text and existing-install upgrades
        run: python3 assets/tests/validate_localization.py

      - name: Check the APK native-layout release gate
        run: |
          python3 -m unittest discover -s tests -p test_android_native_audit.py -v
          python3 -m unittest discover -s tests -p test_android_texture65_packaging.py -v
          python3 -m unittest discover -s tests -p test_android_installer_packaging.py -v

      - name: Check costume extraction and installer lifecycle
        run: |
          python3 -m unittest discover -s tests -p test_assets_extract.py -v
          python3 -m unittest discover -s tests -p test_admin_install_restart.py -v
          python3 -m unittest discover -s tests -p test_sukusta_paths.py -v
          python3 -m unittest discover -s tests -p test_installer_dictionary_resources.py -v
          python3 -m unittest discover -s tests -p test_android_python_launch.py -v
          python3 -m unittest discover -s android/ci -p test_prepare_gradle.py -v
          python3 -m unittest discover -s tests -p 'test_costume_management*.py' -v
          python3 -m unittest discover -s tests -p test_admin_costume_delete_flow.py -v
          python3 -m unittest discover -s tests -p test_costume_scene_installer.py -v
          python3 -m unittest discover -s tests -p test_costume_stock_build.py -v
          python3 -m adminui.selftest

      - name: Check mod-preserving payload updates and recovery
        run: |
          python3 -m unittest discover -s tests -p test_payload_file_hash.py -v
          python3 -m unittest discover -s tests -p test_payload_revision.py -v
          python3 -m unittest discover -s tests -p test_payload_revision_parallel.py -v
          python3 -m unittest discover -s tests -p test_deterministic_serverdata.py -v
          python3 -m unittest discover -s tests -p test_payload_db_upgrade.py -v
          python3 -m unittest discover -s tests -p test_payload_parallel_merge.py -v
          python3 -m unittest discover -s tests -p test_android_payload_merge_benchmark.py -v
          python3 -m unittest discover -s tests -p test_payload_upgrade_progress.py -v
          python3 -m unittest discover -s tests -p test_payload_progress_reporter.py -v
          python3 -m unittest discover -s tests -p test_database_maintenance.py -v
          python3 -m unittest discover -s tests -p test_restore_payload_rebase.py -v
          python3 -m unittest discover -s tests -p test_android_app_version.py -v
          python3 -m unittest discover -s tests -p test_android_payload_upgrade.py -v
          python3 -m unittest discover -s tests -p test_android_offline_management_gate.py -v
          python3 -m unittest discover -s tests -p test_android_release_smoke.py -v
          python3 -m unittest discover -s tests -p test_android_server_config_payload.py -v
          python3 -m unittest discover -s tests -p test_android_payload_upgrade_benchmark.py -v
          python3 -m unittest discover -s tests -p test_android_payload_noop_probe.py -v

      - name: Check model picker, mesh editing and texture preview regressions
        working-directory: modtools
        env:
          # Automatic original-face downloads reuse the bundled parent extractor.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m pip install "numpy==1.26.2" "Pillow==11.0.0" "UnityPy==1.25.0"
          python3 -m unittest discover -s ../tests -p 'test_costume_clone*.py' -v
          python3 -m unittest discover -s ../tests -p test_costume_private_faces.py -v
          python3 -m unittest discover -s ../tests -p test_costume_face_management.py -v
          python3 -m unittest discover -s ../tests -p test_costume_installer_bytecode.py -v
          python3 -m unittest discover -s ../tests -p test_admin_costume_thumbnails.py -v
          python3 -m unittest discover -s ../tests -p test_added_content_cdn.py -v
          python3 -m unittest discover -s ../tests -p test_added_content_cdn_protocol.py -v
          python3 -m unittest discover -s ../tests -p test_costume_cdn_catalog.py -v
          python3 -m unittest discover -s ../tests -p test_costume_cdn_restore.py -v
          python3 -m unittest discover -s ../tests -p test_costume_cdn_packaging.py -v
          python3 -m unittest discover -s ../tests -p test_game_quality_settings.py -v
          python3 -m unittest discover -s ../tests -p test_shared_asset_crypto.py -v
          python3 -m unittest discover -s ../tests -p test_pack_lookup.py -v
          python3 -m unittest discover -s ../tests -p test_viewer_part_oracle.py -v
          python3 -m unittest discover -s ../tests -p test_costume_scene_clones.py -v
          python3 -m unittest discover -s ../tests -p test_costume_scene_sources.py -v
          python3 -m unittest discover -s ../tests -p test_costume_scene_clone_interop.py -v
          python3 -m unittest discover -s ../tests -p test_costume_scene_face_authoring.py -v
          python3 -c 'import hashlib, sys; from pathlib import Path; from UnityPy.helpers import TypeTreeHelper; actual = hashlib.sha256(Path(TypeTreeHelper.__file__).read_bytes()).hexdigest(); actual == "355179e62b14d2f638947e057979d15815a9cadd3a3d868d8b809455193a290b" or sys.exit("Expected pristine UnityPy1.25.0 TypeTreeHelper, got " + actual)'
          # Exercise the real guarded Android launcher after model dependencies are installed.
          python3 -m unittest discover -s ../tests -p test_android_python_launch.py -v
          python3 -m pip install "certifi==2026.10.23"
          python3 -m unittest discover -s ../tests -p 'test_macos_runtime*.py' -v
          python3 -m unittest discover -s ../tests -p test_macos_texture65_packaging.py -v
          python3 -m unittest discover -s ../android/ci -p 'test_patch_unitypy_*.py' -v
          python3 -m unittest discover -s tests -p test_mesh_editor.py -v
          python3 -m unittest discover -s tests -p test_gallery_decode.py -v
          python3 -m unittest discover -s tests -p test_renamer_bytecode.py -v
          python3 -m unittest discover -s tests -p test_texture65_decode.py -v
          python3 -m unittest discover -s tests -p test_model_viewer.py -v
          python3 -m unittest discover -s tests -p test_model_faces.py -v
          python3 -m unittest discover -s tests -p test_viewer_facial_role_metadata.py -v
          python3 -m unittest discover -s tests -p test_face_cache_prune.py -v
          python3 -m unittest discover -s tests -p test_mesh_baker_chunks.py -v
          python3 -m unittest discover -s tests -p test_model_skinning.py -v
          python3 -m unittest discover -s tests -p test_model_rig.py -v
          python3 -m unittest discover -s tests -p test_model_expressions.py -v
          python3 -m unittest discover -s tests -p test_model_animation.py -v
          python3 -m unittest discover -s tests -p test_model_motion.py -v
          python3 -m unittest discover -s tests -p test_model_scaling.py -v
          python3 -c 'from pathlib import Path; assert Path("tests/fixtures/viewer_persistence.unity").read_bytes() == Path("../android/app/src/androidTest/assets/viewer_persistence.unity").read_bytes(), "Native persistence fixture must match the shared browser fixture"'
          python3 -m unittest discover -s tests -p test_model_edits.py -v
          python3 -m unittest discover -s tests -p test_viewer_texture_tools.py -v
          python3 -m unittest discover -s tests -p test_texture_image_io.py -v
          python3 -m unittest discover -s tests -p test_texture_project_io.py -v
          python3 -m unittest discover -s tests -p test_model_outlines.py -v
          python3 -m unittest discover -s tests -p test_outline_inventory_sessions.py -v
          python3 -m unittest discover -s tests -p test_model_edit_dependencies.py -v
          python3 -m unittest discover -s tests -p 'test_model_accessory_unclip*.py' -v
          python3 -m unittest discover -s tests -p 'test_viewer_scene*.py' -v
          python3 -m unittest discover -s tests -p test_viewer_execution_model_graph.py -v
          python3 -m unittest discover -s tests -p test_viewer_mod_sources.py -v
          python3 -m unittest discover -s tests -p test_viewer_mod_pair_edits.py -v
          python3 -m unittest discover -s tests -p test_viewer_zip_replacement.py -v
          python3 -m unittest discover -s tests -p test_viewer_mod_package.py -v
          python3 -m unittest discover -s tests -p test_viewer_mod_flow.py -v
          python3 -m unittest discover -s tests -p test_viewer_transplant_paths.py -v
          python3 -m unittest discover -s tests -p 'test_graft_*.py' -v
          python3 -m unittest discover -s tests -p test_reuse_empty_uv_options.py -v
          python3 -m unittest discover -s tests -p test_transplant_geometry_regressions.py -v
          python3 -m unittest discover -s tests -p test_transplant_seams_and_io.py -v
          python3 -m unittest discover -s tests -p test_transplant_physics_graph.py -v
          python3 -m unittest discover -s tests -p test_viewer_transplants.py -v
          python3 -m unittest discover -s tests -p test_viewer_body_controls.py -v
          python3 -m unittest discover -s tests -p 'test_game_models*.py' -v
          python3 -m unittest discover -s tests -p test_model_materials.py -v
          python3 -m unittest discover -s tests -p test_viewer_thumbnails.py -v
          python3 -m unittest discover -s tests -p test_viewer_thumbnail_roles.py -v
          python3 -m unittest discover -s tests -p test_viewer_thumbnail_saved_settings.py -v
          python3 -m unittest discover -s tests -p test_mod_thumbnail_replace.py -v
          python3 -m unittest discover -s tests -p test_node_height_tool.py -v
          python3 -m unittest discover -s tests -p test_viewer_archive.py -v
          python3 -m unittest discover -s tests -p test_viewer_routes.py -v
          python3 -m unittest discover -s tests -p test_viewer_edit_routes.py -v
          python3 -m unittest discover -s tests -p test_job_outputs.py -v
          python3 -m unittest discover -s tests -p test_viewer_motion_library.py -v
          python3 -m unittest discover -s tests -p test_viewer_transplant_diagnostics.py -v
          python3 -m unittest discover -s tests -p test_viewer_model_request_diagnostics.py -v

      - name: Run all Go tests with default vet checks
        run: python3 tests/run_go_tests.py

  windows-upgrades:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"

      - name: Test real Windows database upgrades
        run: go test -count=1 -v ./clientdb/upgrades

  viewer-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout viewer sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test dependencies
        run: |
          python3 -m pip install "numpy==1.26.2" "Pillow==11.0.0" "UnityPy==1.25.0"
          npm install --prefix "$RUNNER_TEMP/viewer-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/viewer-browser/node_modules/.bin/playwright" install chromium

      - name: Exercise real WebGL pose, scaling and game materials
        working-directory: modtools
        env:
          PYTHONPATH: ${{ github.workspace }}
          VIEWER_URL: http://127.0.0.1:8898
          EVIDENCE_DIR: ${{ runner.temp }}/viewer-webgl-evidence
        run: |
          export NODE_PATH="$RUNNER_TEMP/viewer-browser/node_modules"
          mkdir -p "$EVIDENCE_DIR"
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" node ../webui/native_local_browser_test.js
          node tests/texture_color_math_test.js
          node tests/texture_color_worker_test.js
          node tests/texture_paint_engine_test.js
          node tests/texture_paint_layers_test.js
          node tests/texture_uv_selection_test.js
          node tests/viewer_near_clip_test.js
          node tests/texture_png_test.js
          node tests/sifas_texture_override_test.js
          node tests/viewer_texture_tools_test.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" node tests/viewer_texture_persistence_order_test.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" node tests/viewer_texture_layers_rollback_test.js
          node tests/viewer_game_physics_motion_metadata_test.js
          node tests/viewer_native_pcm_test.js
          node tests/viewer_native_pcm_controller_test.js
          EVIDENCE_DIR="$EVIDENCE_DIR/costume-delete" node ../tests/adminui_costume_delete_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/tool-log" node ../tests/adminui_log_batch_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/costume-cdn" node ../tests/adminui_costume_cdn_browser.js
          PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/game-quality" node ../tests/adminui_game_quality_browser.js
          python3 -m webtools --no-browser --host 127.0.0.1 --port 8898 > "$EVIDENCE_DIR/server.log" 2>&1 &
          viewer_server_pid=$!
          trap 'kill "$viewer_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$VIEWER_URL/api/tools" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$VIEWER_URL/api/tools" > /dev/null
          EVIDENCE_DIR="$EVIDENCE_DIR/navigation" node tests/viewer_navigation_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/accessories" node tests/viewer_accessories_browser.js
          node tests/viewer_rig_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/runtime-optimization" node tests/viewer_runtime_optimization_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/interaction-tools" node tests/viewer_interaction_tools_browser.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/near-clip-rendering" node tests/viewer_near_clip_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/near-clip-app" node tests/viewer_near_clip_app_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/mesh-move" node tests/viewer_mesh_move_browser.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/mesh-axis-runtime" node tests/viewer_mesh_axis_runtime_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/physics-lifecycle" node tests/viewer_physics_lifecycle_browser.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/mesh-projection-cache" node tests/viewer_mesh_projection_cache_browser.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/motion-audio-lookup" node tests/viewer_motion_audio_lookup_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/layout" node tests/viewer_layout_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/portrait-scroll" node tests/viewer_portrait_scroll_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/pose-body" node tests/viewer_pose_body_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/vertical" node tests/viewer_vertical_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/framing" node tests/viewer_framing_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/compensation" node tests/viewer_compensation_browser.js
          node tests/sifas_material_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/rimlight-display" node tests/viewer_rimlight_browser.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/mouth-centroid" node tests/viewer_mouth_depth_browser_test.js
          CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/camera-depth" node tests/viewer_camera_browser.js
          node tests/viewer_quality_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/variants" node tests/viewer_variant_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/persistence" node tests/viewer_persistence_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/texture-editors" node tests/viewer_texture_tools_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/signed-inputs" node tests/viewer_signed_inputs_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/texture-layers" node tests/viewer_texture_layers_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/texture-workspace" node tests/viewer_texture_workspace_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/texture-panel-expand" node tests/texture_panel_expand_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/mod-packages" node tests/viewer_mod_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/minimize" node tests/viewer_minimize_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/compact-layout" node tests/viewer_compact_layout_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/body-controls" node tests/viewer_body_controls_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/thumbnails" node tests/viewer_thumbnail_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/outline-diagnostics" node tests/viewer_outline_diagnostics_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/outline-inventory" node tests/viewer_outline_inventory_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/compact-buttons" node tests/viewer_compact_buttons_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/compact-controls" node tests/viewer_compact_controls_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/game-assets" node tests/viewer_game_assets_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/transplant-game-assets" node tests/transplant_game_assets_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/transplants" node tests/viewer_transplants_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/macos" node tests/viewer_macos_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/resolution" node tests/viewer_resolution_browser.js
          EVIDENCE_DIR="$EVIDENCE_DIR/request-diagnostics" node tests/viewer_request_diagnostics_test.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/transplant-diagnostics" node tests/viewer_transplant_diagnostics_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/motion-many-clips" node tests/viewer_motion_many_clips_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/motion-source-capacity" node tests/viewer_motion_source_capacity_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/paths-picker" node tests/viewer_paths_picker_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/model-picker-delete" node tests/viewer_model_picker_delete_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/mesh-reset" node tests/viewer_mesh_reset_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/installer-thumbnail" node ../tests/adminui_costume_thumbnail_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/installer-thumbnail-render" node ../tests/adminui_costume_thumbnail_render_browser.js
          VIEWER_PYTHON="$(command -v python3)" CHROMIUM_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" EVIDENCE_DIR="$EVIDENCE_DIR/installer-thumbnail-install" node ../tests/adminui_costume_thumbnail_install_browser.js

      - name: Upload neutral WebGL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-webgl-evidence
          path: ${{ runner.temp }}/viewer-webgl-evidence
          if-no-files-found: warn
