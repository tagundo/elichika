name: Server regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server and asset history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python for pinned mesh and image dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SQL migrations and animation mappings
        run: python3 assets/tests/validate_shooting_star.py

      - name: Validate locale text and existing-install upgrades
        run: python3 assets/tests/validate_localization.py

      - name: Check the APK native-layout release gate
        run: python3 -m unittest discover -s tests -p test_android_native_audit.py -v

      - name: Check costume extraction and installer lifecycle
        run: |
          python3 -m unittest discover -s tests -p test_assets_extract.py -v
          python3 -m unittest discover -s tests -p test_admin_install_restart.py -v
          python3 -m unittest discover -s tests -p test_android_python_launch.py -v
          python3 -m adminui.selftest

      - name: Check model picker, mesh editing and texture preview regressions
        working-directory: modtools
        env:
          # Automatic original-face downloads reuse the bundled parent extractor.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 -m pip install "numpy==1.26.2" "Pillow==11.0.0" "UnityPy==1.25.0"
          python3 -m unittest discover -s tests -p test_mesh_editor.py -v
          python3 -m unittest discover -s tests -p test_gallery_decode.py -v
          python3 -m unittest discover -s tests -p test_model_viewer.py -v
          python3 -m unittest discover -s tests -p test_model_faces.py -v
          python3 -m unittest discover -s tests -p test_model_skinning.py -v
          python3 -m unittest discover -s tests -p test_model_rig.py -v
          python3 -m unittest discover -s tests -p test_model_animation.py -v
          python3 -m unittest discover -s tests -p test_model_scaling.py -v
          python3 -m unittest discover -s tests -p test_model_materials.py -v
          python3 -m unittest discover -s tests -p test_node_height_tool.py -v
          python3 -m unittest discover -s tests -p test_viewer_archive.py -v
          python3 -m unittest discover -s tests -p test_viewer_routes.py -v
          python3 -m unittest discover -s tests -p test_job_outputs.py -v

      - name: Run all Go tests with default vet checks
        run: python3 tests/run_go_tests.py

  windows-upgrades:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout server
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test real Windows database upgrades
        run: go test -count=1 -v ./clientdb/upgrades

  viewer-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout viewer sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser test dependencies
        run: |
          python3 -m pip install "numpy==1.26.2" "Pillow==11.0.0" "UnityPy==1.25.0"
          npm install --prefix "$RUNNER_TEMP/viewer-browser" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/viewer-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise real WebGL pose, scaling and game materials
        working-directory: modtools
        env:
          PYTHONPATH: ${{ github.workspace }}
          VIEWER_URL: http://127.0.0.1:8898
          EVIDENCE_DIR: ${{ runner.temp }}/viewer-webgl-evidence
        run: |
          export NODE_PATH="$RUNNER_TEMP/viewer-browser/node_modules"
          mkdir -p "$EVIDENCE_DIR"
          python3 -m webtools --no-browser --host 127.0.0.1 --port 8898 > "$EVIDENCE_DIR/server.log" 2>&1 &
          viewer_server_pid=$!
          trap 'kill "$viewer_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$VIEWER_URL/api/tools" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$VIEWER_URL/api/tools" > /dev/null
          node tests/viewer_rig_browser.js
          node tests/sifas_material_browser.js

      - name: Upload neutral WebGL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-webgl-evidence
          path: ${{ runner.temp }}/viewer-webgl-evidence
          if-no-files-found: warn
