          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
          node tests/viewer_quality_browser.js
          qa_status=$?
          printf '%s\t%s\n' "$qa_status" 'tests/viewer_quality_browser.js' | tee -a "$EVIDENCE_DIR/continuation-status.tsv"
          if [ "$qa_status" -ne 0 ]; then qa_failures=$((qa_failures + 1)); fi
