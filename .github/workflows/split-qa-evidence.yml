name: Split verified QA evidence
on:
  push:
    paths:
      - .github/workflows/split-qa-evidence.yml
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify original Star artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tagundo/elichika/actions/artifacts/11273728579/zip > source.zip
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("source.zip"); d=p.read_bytes()
          assert hashlib.sha256(d).hexdigest()=="aea6bb55129ba81e384c0adb9b78ef9ab5351d9765315669f2d09a7ef3f43044"
          out=pathlib.Path("parts");out.mkdir()
          manifest={"source_artifact_id":11273728579,"source_bytes":len(d),"source_sha256":hashlib.sha256(d).hexdigest(),"parts":[]}
          for i, offset in enumerate(range(0,len(d),16*1024*1024),1):
           b=d[offset:offset+16*1024*1024]; f=out/("part-%02d.bin"%i); f.write_bytes(b)
           manifest["parts"].append({"name":f.name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("Original archive SHA256 verified; three lossless binary chunks generated")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: star-source-zip-part-01
          path: parts/part-01.bin
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: star-source-zip-part-02
          path: parts/part-02.bin
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: star-source-zip-part-03
          path: parts/part-03.bin
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: star-source-manifest
          path: parts/manifest.json
          retention-days: 90
