      - name: Verify raw files, upload only matching bytes, and publish the existing draft
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          repo = 'tagundo/elichika'
          tag = 'v2026.11.11.3'
          def api(path, data=None):
              command = ['gh','api','repos/' + repo + '/' + path]
              if data is not None:
                  command += ['--method','PATCH','--input','-']
              raw = subprocess.check_output(command, input=json.dumps(data).encode() if data is not None else None)
              return json.loads(raw)
          expected = {
              'elichika-2026.11.11.3.apk': (290595048,'e6639a370faca09d2ea6495f4fe2065fc1f1ff4a766ed26de2bc8d27c05df8fd'),
              'Elichika-2026.11.11.3-AppleSilicon.app.zip': (304951791,'7c3c5392e775d1920ea3ce4caca4ba343f0477cb1c9a0d56c303bfa2866c3648'),
          }
          files = {}
          for name, (size, digest) in expected.items():
              matches = list(Path('input').rglob(name))
              assert len(matches) == 1
              path = matches[0]
              assert path.stat().st_size == size
              with path.open('rb') as stream:
                  assert hashlib.file_digest(stream,'sha256').hexdigest() == digest
              files[name] = path
          sums = Path('SHA256SUMS')
          sums.write_text(''.join(digest + '  ' + name + '\n' for name, (size,digest) in expected.items()))
          assert hashlib.sha256(sums.read_bytes()).hexdigest() == '6ca4a81dbcd16cc03c494b89adab97a31176c6f720c205dce0d16112e145c4b4'
          expected['SHA256SUMS'] = (sums.stat().st_size,hashlib.sha256(sums.read_bytes()).hexdigest())
          files['SHA256SUMS'] = sums
          draft = api('releases/441384473')
          assert draft['draft'] and draft['tag_name'] == tag
          assert draft['target_commitish'] == '0fcd9d5245b8c4bc519932b6119cb902ddfd0757'
          assert hashlib.sha256(draft['body'].encode()).hexdigest() == 'a3ed0307fc662e9f23ea4c2d088c058d9f04cbd48dfe3058e8eef86be43f9347'
          present = {asset['name']: asset for asset in draft['assets']}
          assert set(present) <= set(expected), 'Unexpected existing assets must never be removed or overwritten'
          for name, asset in present.items():
              size, digest = expected[name]
              assert asset['size'] == size and asset['digest'] == 'sha256:' + digest and asset['state'] == 'uploaded'
          for name, path in files.items():
              if name not in present:
                  subprocess.run(['gh','release','upload',tag,'--repo',repo,str(path)],check=True)
          uploaded = api('releases/441384473')
          assert {asset['name'] for asset in uploaded['assets']} == set(expected)
          for asset in uploaded['assets']:
              size, digest = expected[asset['name']]
              assert asset['state'] == 'uploaded' and asset['size'] == size and asset['digest'] == 'sha256:' + digest
          # Ensure a correct immutable tag exists before public publication. Never retarget an existing tag.
          tag_read = subprocess.run(['gh','api','repos/' + repo + '/git/ref/tags/' + tag],capture_output=True,text=True)
          if tag_read.returncode:
              assert str(json.loads(tag_read.stdout).get('status')) == '404', tag_read.stderr
              created = subprocess.run(['gh','api','repos/' + repo + '/git/refs','--method','POST','--input','-'],input=json.dumps({'ref':'refs/tags/' + tag,'sha':'0fcd9d5245b8c4bc519932b6119cb902ddfd0757'}),capture_output=True,text=True)
              if created.returncode:
                  assert str(json.loads(created.stdout).get('status')) == '422', created.stderr
          tag_before_publish = api('git/ref/tags/' + tag)['object']
          for _ in range(8):
              if tag_before_publish['type'] != 'tag':
                  break
              tag_before_publish = api('git/tags/' + tag_before_publish['sha'])['object']
          assert tag_before_publish['type'] == 'commit' and tag_before_publish['sha'] == '0fcd9d5245b8c4bc519932b6119cb902ddfd0757'
          published = api('releases/441384473',{'draft':False,'prerelease':False,'make_latest':'true'})
          assert published['draft'] is False and published['tag_name'] == tag
          tag_ref = api('git/ref/tags/' + tag)['object']
          if tag_ref['type'] == 'tag':
              tag_ref = api('git/tags/' + tag_ref['sha'])['object']
          assert tag_ref['type'] == 'commit' and tag_ref['sha'] == '0fcd9d5245b8c4bc519932b6119cb902ddfd0757'
          Path('publication-receipt.json').write_text(json.dumps({
              'status':'PUBLISHED_EXACT_VALIDATED_FILES_WITHOUT_REBUILD',
              'release':published,'tag_commit':tag_ref['sha'],
              'validation_runs':json.loads(Path('approved-runs.json').read_text()),
              'root_accepted_audit_sha256':json.loads(Path('root-accepted-audits.json').read_text()),
              'general_effective_jobs':json.loads(Path('general-effective-jobs.json').read_text()),
              'general_source_bound_evidence':json.loads(Path('source-bound-general-validation.json').read_text()),
              'mac_source_bound_qa':json.loads(Path('source-bound-mac-validation.json').read_text()),
              'source_of_upload_credential':'GitHub Actions contents:write GITHUB_TOKEN',
              'product_rebuilt':False,'main_merged':False,
          },indent=2) + '\n')
          print(published['html_url'])
          PY

      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-publication-receipt
          path: |
            approved-runs.json
            root-accepted-audits.json
            general-effective-jobs.json
            source-bound-general-validation.json
            source-bound-mac-validation.json
            publication-receipt.json
            SHA256SUMS
          if-no-files-found: warn
