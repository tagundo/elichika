          import base64, subprocess
          """Verify the fresh general artifact, frozen driver list and complete job logs."""
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import re
          import zipfile
          
          
          def verify_general_evidence(archive_path, metadata, webgl_log, portable_log, workflow, expected):
              assert expected['version'] == '2026.11.11.3' and expected['candidate'] == 3
              assert expected['source_parent'] == '0fcd9d5245b8c4bc519932b6119cb902ddfd0757'
              assert expected['source_tools'] == '9ffc11583209507fb3e610b801c0cbf9213f4b51'
              assert expected['run'] == 42976030094
              assert hashlib.sha256(workflow).hexdigest() == expected['workflow_sha256']
              drivers = re.findall(rb'\bnode\s+((?:\.\./)?tests/[^\s]+\.js)', workflow)
              assert drivers == [name.encode() for name in expected['driver_names']]
              assert len(drivers) == expected['node_invocations'] == 39
              assert expected['tool_node_invocations'] == 36 and expected['tool_browser_invocations'] == 33
              assert expected['admin_browser_invocations'] == 3 and expected['browser_invocations'] == 36
              assert len(expected['expected_test_cases']) == 110
              assert expected['test_counts'] == {'graft': 77, 'options_cli': 9, 'viewer': 24}
              for driver in expected['driver_names']:
                  assert 'node ' + driver in webgl_log, driver
              assert 'Artifact ID ' + str(metadata['id']) in webgl_log
              archive_path = Path(archive_path)
              assert archive_path.stat().st_size == metadata['size_in_bytes']
