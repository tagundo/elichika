          assert [parent['sha'] for parent in automation['parents']] == ['0fcd9d5245b8c4bc519932b6119cb902ddfd0757']
          assert [file['filename'] for file in automation['files']] == ['.github/workflows/publish-validated-20261111-3.yml']
