          def collect_test_outcomes(text):
              """Pair verbose unittest starts/statuses even when test logging splits them."""
              starts = re.compile(r'\b(test_\w+) \(([\w.]+)\) \.\.\.')
              timestamps = re.compile(r'^\ufeff?\d{4}-\d\d-\d\dT[\d:.]+Z\s?')
              ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
              terminal = {'ok', 'FAIL', 'ERROR', 'unexpected success', 'expected failure'}
              cases, current = {}, None
              for raw in text.splitlines():
                  line = timestamps.sub('', ansi.sub('', raw))
                  match = starts.search(line)
                  if match:
                      current = {'name': match[1], 'id': match[2], 'outcomes': [], 'split': False}
                      cases.setdefault(match[2], []).append(current)
                      tail = line[match.end():].strip()
                      if tail in terminal or tail.startswith('skipped '):
                          current['outcomes'].append(tail)
                  elif current is not None:
                      tail = line.strip()
                      if tail in terminal or tail.startswith('skipped '):
                          current['outcomes'].append(tail)
                          current['split'] = True
              return cases
          
          def assert_test_cases_ok(text, expected_cases):
              outcomes = collect_test_outcomes(text)
              accepted, split = [], []
              for name, cls, module in expected_cases:
                  identity = module + '.' + cls + '.' + name
                  rows = outcomes.get(identity, [])
                  assert len(rows) == 1, (identity, 'missing or repeated test execution', len(rows))
                  assert rows[0]['name'] == name and rows[0]['outcomes'] == ['ok'], (identity, rows[0])
                  accepted.append([name, cls, module])
                  if rows[0]['split']:
                      split.append(identity)
              return accepted, split
