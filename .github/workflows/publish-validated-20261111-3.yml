              assert all(re.fullmatch('[0-9a-f]{64}', value) for value in qa_sources.values())
              guard_sources = pins['guard_source_hashes']
              assert set(guard_sources) == {'macos/App/RuntimeContract.swift', 'macos/App/WebPanel.swift', 'macos/Tests/RuntimeContractTests.swift'}
              assert all(re.fullmatch('[0-9a-f]{64}', value) for value in guard_sources.values())
              provenance = read('bundle-provenance.json')
