name: Publish exact validated 2026.11.11.3 applications

on:
  workflow_dispatch:
  push:
    branches: [codex/publish-validated-20261111-3]
    paths: [.github/workflows/publish-validated-20261111-3.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-validated-v2026.11.11.3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REPO: tagundo/elichika
    steps:
      - name: Verify the exact approved validation runs and existing draft
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'tagundo/elichika'
          assert os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/publish-validated-20261111-3'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/' + path]))
          """Verify only the exact, fresh, first-attempt general run accepted by root."""
          import hashlib
          import json
          
          GENERAL_RUN = 42976030094
          GENERAL_SOURCE = '0fcd9d5245b8c4bc519932b6119cb902ddfd0757'
          REQUIRED_GENERAL_JOBS = {'tests', 'windows-upgrades', 'viewer-webgl'}
          
          
          def normalize_job(job):
              fields = ('id', 'name', 'run_attempt', 'status', 'conclusion')
              row = {name: job[name] for name in fields}
              assert type(row['id']) is int and row['id'] > 0
              assert isinstance(row['name'], str) and row['name']
              assert type(row['run_attempt']) is int and row['run_attempt'] >= 1
              return row
          
          
          def latest_jobs_by_name(jobs):
              latest, attempts = {}, set()
              for job in jobs:
                  row = normalize_job(job)
                  pair = row['name'], row['run_attempt']
                  assert pair not in attempts, 'Duplicate job name in the same attempt'
                  attempts.add(pair)
                  if row['name'] not in latest or row['run_attempt'] > latest[row['name']]['run_attempt']:
                      latest[row['name']] = row
              return latest
          
          
          def frozen_job(job):
              result = normalize_job(job)
              for name in ('run_id', 'head_sha', 'started_at', 'completed_at'):
                  result[name] = job[name]
              assert isinstance(job['steps'], list) and job['steps']
              assert all(step['status'] == 'completed' and step['conclusion'] in ('success', 'skipped')
                         for step in job['steps'])
              result['steps_sha256'] = hashlib.sha256(json.dumps(job['steps'], sort_keys=True).encode()).hexdigest()
              return result
          
          
          def verify_general_history(run, jobs, expected):
              assert run['id'] == GENERAL_RUN and run['head_sha'] == GENERAL_SOURCE
              assert run['head_branch'] == 'codex/model-workbench-build-20261109'
              assert run['path'] == '.github/workflows/tests.yml'
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert run['run_attempt'] == 1, 'No general rerun is approved for this publisher'
              assert len(jobs) == len({job['id'] for job in jobs}) == 3
              assert {job['name'] for job in jobs} == REQUIRED_GENERAL_JOBS
              for job in jobs:
                  assert job['run_id'] == GENERAL_RUN and job['head_sha'] == GENERAL_SOURCE
                  assert job['run_attempt'] == 1 and job['status'] == 'completed' and job['conclusion'] == 'success'
              history = sorted((frozen_job(job) for job in jobs), key=lambda row: row['id'])
              assert history == sorted((frozen_job(job) for job in expected), key=lambda row: row['id']), 'General job IDs, timestamps or complete steps differ from root-approved evidence'
              latest = latest_jobs_by_name(jobs)
