name: Compile native Apple Silicon companion host
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test native contract and build host
        run: |
          set -euo pipefail
          mkdir -p evidence
          uname -a > evidence/host.txt
          swift --version >> evidence/host.txt
          swift test --package-path macos 2>&1 | tee evidence/swift-tests.txt
          swift build --package-path macos -c release 2>&1 | tee evidence/swift-release.txt
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-compile-evidence
          path: evidence/
