name: Upload exact validated 2026.11.05.3 APK to fixed draft

on: workflow_dispatch

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-exact-v2026.11.05.3
  cancel-in-progress: false

jobs:
  upload-draft:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'tagundo/elichika' && github.ref == 'refs/heads/codex/release-v2026-11-05-3-promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # No checkout, rebuild, signing, third-party action, tag creation or publication.
      # Only the original production artifact is accepted; QA APKs are never inputs.
      - name: Verify provenance and original archive, then upload exact bytes to draft
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import stat
          import subprocess
          import tempfile
          import urllib.parse
          import zipfile

          REPO = 'tagundo/elichika'
          REPO_ID = 1265017321
          SOURCE = '5e3547cb1a98833b548e54d1019f6923a405d7ec'
          BASE = '28460463a74a66a1ea9b0fa27efd0f700e62cc37'
          MERGE = 'b1be41c2fe6aadd95a8b6f00a6768bcea03034bf'
          TREE = '9431e9ac6e9cab5a0789809cc3e11eec0fa75547'
          MODTOOLS = 'bcc61ba56022cb10e9e8eeff7cd0420a3f78d6f7'
          TAG = 'v2026.11.05.3'
          RELEASE_ID = 435393318
          BUILD_RUN = 42040898733
          CI_RUN = 42040906444
          TAG_RUN = 42057197226
          ARTIFACT_ID = 13422968031
          ZIP_BYTES = 274301298
          ZIP_SHA256 = '923899678c6655e7c3649cfd3935fe75052cf78c0ffa4c3abb8fe6cd3fe8e297'
          APK_NAME = 'elichika-2026.11.05.3.apk'
          APK_BYTES = 290031273
          APK_SHA256 = 'a44b47cbef08d3ead0b88c4fbcdcbcea773133434ca685c5d9ba694fb6be4891'
          CHECKSUM = f'{APK_SHA256}  {APK_NAME}\n'.encode()
          EXPECTED_ASSETS = {
              APK_NAME: (APK_BYTES, APK_SHA256),
              'SHA256SUMS': (len(CHECKSUM), hashlib.sha256(CHECKSUM).hexdigest()),
          }

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(path):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', f'repos/{REPO}/{path}'], text=True))

          def verify_run(run_id, path, event, expected_jobs):
              run = api(f'actions/runs/{run_id}')
              require((run['id'], run['status'], run['conclusion'], run['head_sha'],
                       run['path'], run['event'], run['run_attempt']) ==
                      (run_id, 'completed', 'success', SOURCE, path, event, 2),
                      'Pinned original source run changed or did not succeed')
              require(run['repository']['full_name'] == REPO and
                      run['head_repository']['full_name'] == REPO,
                      'Unexpected source run repository')
              page = api(f'actions/runs/{run_id}/jobs?per_page=100')
              jobs = page['jobs']
              require(page['total_count'] == len(jobs) == len(expected_jobs),
                      'Unexpected or paginated source job set')
              require(len({job['name'] for job in jobs}) == len(jobs) and
                      {job['name'] for job in jobs} == set(expected_jobs),
                      'Source gate names changed')
              for job in jobs:
                  require((job['status'], job['conclusion'], job['head_sha']) ==
                          ('completed', expected_jobs[job['name']], SOURCE),
                          'Required source gate did not reach its expected conclusion')

          def verify_tag_publishers():
              pinned = api(f'actions/runs/{TAG_RUN}')
              require((pinned['id'], pinned['head_sha'], pinned['head_branch'],
                       pinned['path'], pinned['event'], pinned['status'], pinned['conclusion']) ==
                      (TAG_RUN, SOURCE, TAG, '.github/workflows/android.yml',
                       'push', 'completed', 'cancelled'),
                      'Pinned automatic tag publisher must be terminal-cancelled')
              page = api(f'actions/workflows/android.yml/runs?event=push&head_sha={SOURCE}&per_page=100')
              require(page['total_count'] <= 100 and len(page['workflow_runs']) == page['total_count'],
                      'Tag publisher run list requires review')
              matching = [run for run in page['workflow_runs'] if run['head_branch'] == TAG]
              require(TAG_RUN in {run['id'] for run in matching},
                      'Pinned tag publisher absent from workflow run list')
              for run in matching:
                  require((run['head_sha'], run['path'], run['event'], run['status'], run['conclusion']) ==
                          (SOURCE, '.github/workflows/android.yml', 'push', 'completed', 'cancelled'),
                          'Another automatic tag publisher can interfere with this draft')

          def verify_asset(asset, name):
              size, digest = EXPECTED_ASSETS[name]
              require((asset['name'], asset['state'], asset['size'], asset.get('digest')) ==
                      (name, 'uploaded', size, 'sha256:' + digest),
                      'Release asset bytes or upload state differ from validated bytes')

          def verify_destination(expected_names):
              tag = api(f'git/ref/tags/{TAG}')['object']
              require((tag['sha'], tag['type']) == (SOURCE, 'commit'),
                      'Tag must remain a direct reference to validated source')
              require(api('git/ref/heads/main')['object']['sha'] == MERGE, 'Main moved')
              verify_tag_publishers()
              release = api(f'releases/{RELEASE_ID}')
              require((release['id'], release['draft'], release['prerelease'],
                       release['tag_name'], release['target_commitish']) ==
                      (RELEASE_ID, True, False, TAG, SOURCE),
                      'Pinned destination must remain the original source-bound draft')
              body = release.get('body') or ''
              require('https://github.com/NaufalFajri' in body and
                      'https://github.com/tagundo/elichika/pull/57' in body and
                      'https://github.com/tagundo/elichika/pull/59' in body,
                      'Original JP-to-GL contributor credit must remain in draft notes')
              assets = release['assets']
              require(len(assets) == len(expected_names) and
                      {asset['name'] for asset in assets} == set(expected_names),
                      'Unexpected existing draft assets; no replacement is permitted')
              for asset in assets:
                  verify_asset(asset, asset['name'])
              return release

          def preflight():
              source = api(f'git/commits/{SOURCE}')
              merge = api(f'git/commits/{MERGE}')
              require(source['sha'] == SOURCE and merge['sha'] == MERGE and
                      source['tree']['sha'] == merge['tree']['sha'] == TREE and
                      [parent['sha'] for parent in merge['parents']] == [BASE, SOURCE],
                      'Approved merge must contain exact source tree and direct source parent')
              tree = api(f'git/trees/{TREE}')
              modtools = [entry for entry in tree['tree'] if entry['path'] == 'modtools']
              require(not tree.get('truncated') and len(modtools) == 1 and
                      (modtools[0]['mode'], modtools[0]['type'], modtools[0]['sha']) ==
                      ('160000', 'commit', MODTOOLS), 'Reviewed modtools gitlink changed')
              pr = api('pulls/65')
              require(pr['merged'] is True and pr['state'] == 'closed' and
                      pr['merge_commit_sha'] == MERGE and pr['head']['sha'] == SOURCE and
                      pr['head']['repo']['full_name'] == REPO and
                      pr['base']['repo']['full_name'] == REPO and pr['base']['ref'] == 'main',
                      'PR 65 merge/source binding changed')
              verify_run(BUILD_RUN, '.github/workflows/android.yml', 'workflow_dispatch', {
                  'build': 'success', 'apk-audit / audit': 'success',
                  'native-compatibility / native-16k': 'success',
                  'android-upgrade / android': 'success', 'publish': 'skipped',
              })
              verify_run(CI_RUN, '.github/workflows/tests.yml', 'pull_request', {
                  'tests': 'success', 'viewer-webgl': 'success', 'windows-upgrades': 'success',
              })
              artifact = api(f'actions/artifacts/{ARTIFACT_ID}')
              binding = artifact['workflow_run']
              require((artifact['id'], artifact['name'], artifact['expired'],
                       artifact['size_in_bytes'], artifact.get('digest')) ==
                      (ARTIFACT_ID, 'elichika-release-apk', False, ZIP_BYTES, 'sha256:' + ZIP_SHA256),
                      'Original production archive identity/digest/size changed')
              require((binding['id'], binding['head_sha'], binding['repository_id'],
                       binding['head_repository_id']) == (BUILD_RUN, SOURCE, REPO_ID, REPO_ID),
                      'Original artifact source repository/run changed')
              page = api(f'actions/runs/{BUILD_RUN}/artifacts?per_page=100')
              require(page['total_count'] <= 100 and len(page['artifacts']) == page['total_count'],
                      'Artifact list requires review')
              matches = [item for item in page['artifacts'] if item['name'] == 'elichika-release-apk']
              require(len(matches) == 1 and matches[0]['id'] == ARTIFACT_ID,
                      'Production artifact selection is ambiguous or changed')
              verify_destination(set())
              print('PASS: source, merge, gitlink, all original gates, archive and fixed draft')

          def download_archive(path):
              # gh follows the official download redirect with its normal auth handling.
              # Do not forward a manually constructed token header to artifact storage.
              with path.open('xb') as output:
                  subprocess.check_call([
                      'gh', 'api', '-X', 'GET',
                      f'repos/{REPO}/actions/artifacts/{ARTIFACT_ID}/zip'], stdout=output)

          def verify_file(path, size, expected_hash):
              require(path.is_file() and not path.is_symlink() and path.stat().st_size == size,
                      'Validated file size/type mismatch')
              with path.open('rb') as stream:
                  require(hashlib.file_digest(stream, 'sha256').hexdigest() == expected_hash,
                          'Validated file SHA-256 mismatch')

          def verify_archive_and_extract(archive, directory):
              verify_file(archive, ZIP_BYTES, ZIP_SHA256)
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  require(len(entries) == 1 and entries[0].filename == APK_NAME and
                          not entries[0].is_dir() and entries[0].file_size == APK_BYTES and
                          not stat.S_ISLNK(entries[0].external_attr >> 16) and
                          not (entries[0].flag_bits & 1), 'Unexpected or unsafe original archive contents')
                  target = directory / APK_NAME
                  with bundle.open(entries[0]) as incoming, target.open('xb') as outgoing:
                      shutil.copyfileobj(incoming, outgoing, 1024 * 1024)
              verify_file(target, APK_BYTES, APK_SHA256)
              return target

          def upload(path):
              name = path.name
              verify_file(path, *EXPECTED_ASSETS[name])
              endpoint = (f'https://uploads.github.com/repos/{REPO}/releases/{RELEASE_ID}/assets?name='
                          + urllib.parse.quote(name, safe=''))
              asset = json.loads(subprocess.check_output([
                  'gh', 'api', '-X', 'POST', endpoint, '-H',
                  'Content-Type: application/octet-stream', '--input', str(path)], text=True))
              verify_asset(asset, name)

          def main():
              preflight()
              with tempfile.TemporaryDirectory(prefix='elichika-exact-promotion-') as temporary:
                  directory = Path(temporary)
                  archive = directory / 'original-artifact.zip'
                  download_archive(archive)
                  apk = verify_archive_and_extract(archive, directory)
                  checksum = directory / 'SHA256SUMS'
                  checksum.write_bytes(CHECKSUM)
                  verify_destination(set())
                  upload(apk)
                  verify_destination({APK_NAME})
                  upload(checksum)
                  verify_destination(set(EXPECTED_ASSETS))
              print('PASS: exact original APK and SHA256SUMS verified; release remains DRAFT. No publication performed.')

          if __name__ == '__main__':
              main()
          PY
