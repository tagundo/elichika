name: Standalone ARM Mac runtime capability probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Capability to measure
        type: choice
        options: [quit, runtime, relocation, unicode]
        default: quit

permissions:
  contents: read

jobs:
  private-runtime:
    if: inputs.probe == 'runtime'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and exercise exact standalone interpreter and codecs
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'macos/build')
          sys.path.insert(0, 'macos/ci')
          from common import is_macho, readonly_tree, require, run, sha256, write_json
          from build_app import vendor_python, copy_python_sources, build_astc
          from native_macho import allowed_runpath, expand_path, loader_context, native_info, prune_external_runpaths
          from audit_bundle import resolve_private
          from verify_runtime import check
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence = temporary / 'macos-runtime-probe-evidence'
          evidence.mkdir()
          repo = pathlib.Path.cwd()
          resources = temporary / 'Standalone runtime Elichika.app/Contents/Resources'
          private = resources / 'runtime/arm64'
          (private / 'bin').mkdir(parents=True)
          lock = json.loads((repo / 'macos/build/dependencies.lock.json').read_text())
          cache = temporary / 'macos-runtime-probe-cache'
          copy_python_sources(repo, resources / 'python-app')
          vendor_python(lock['architectures']['arm64'], private, cache, repo)
          build_astc(lock['astc_commit'], private / 'bin/astcenc', cache)
          app = resources.parents[1]
          write_json(evidence / 'runpath-sanitization.json', prune_external_runpaths(app))
          native = {path:native_info(path) for path in app.rglob('*') if is_macho(path)}
          native_report = {}
          for binary, details in native.items():
              executable = loader_context(binary, app)
              paths = list(details['rpaths'])
              require('arm64' in details['architectures'], 'Missing ARM slice: ' + str(binary))
              require(all(allowed_runpath(value,binary,executable,app) for value in paths), 'External runpath remained')
              for value in native.get(executable,{}).get('rpaths',[]):
                  paths.append(str(expand_path(value,executable,executable)))
              resolved = [resolve_private(value,binary,executable,paths,app) for value in details['dependencies']]
              native_report[binary.relative_to(app).as_posix()] = dict(details, resolved=[str(value) if value else 'system' for value in resolved])
              run(['/usr/bin/codesign','--force','--sign','-','--timestamp=none',binary])
          write_json(evidence / 'private-native-audit.json', native_report)
          readonly_tree(app)
          check(app, evidence / 'private-runtime.json', network=True)
          for binary in native:
              run(['/usr/bin/codesign','--verify','--strict',binary])
          write_json(evidence / 'probe-summary.json', {'scope':'Capability probe only; final .app validation remains separate',
              'status':'PASS','native_images':len(native),'source':run(['git','rev-parse','HEAD'],capture=True).strip(),
              'dependencies_lock_sha256':sha256(repo/'macos/build/dependencies.lock.json')})
          PY
      - name: Upload runtime capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-private-runtime-probe
          path: ${{ runner.temp }}/macos-runtime-probe-evidence/
          if-no-files-found: warn

  appkit-quit:
    if: inputs.probe == 'quit'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Measure real AppKit asynchronous termination patterns
        run: |
          mkdir -p "$RUNNER_TEMP/appkit-quit-probe"
          cat > "$RUNNER_TEMP/appkit-quit-probe/QuitProbe.swift" <<'SWIFT'
          import AppKit
          import Foundation

          func marker(_ value: String) {
              FileHandle.standardOutput.write(Data((value + "\n").utf8))
          }

          @MainActor
          final class QuitDelegate: NSObject, NSApplicationDelegate {
              let mode: String
              var window: NSWindow?
              var cleaning = false
              var ready = false
              init(mode: String) { self.mode = mode; super.init() }

              func applicationDidFinishLaunching(_ notification: Notification) {
                  marker("launched " + mode)
                  window = NSWindow(contentRect: NSRect(x: 0, y: 0, width: 360, height: 160),
                      styleMask: [.titled, .closable, .resizable], backing: .buffered, defer: false)
                  window?.title = "Elichika termination capability probe"
                  window?.makeKeyAndOrderFront(nil)
                  NSApp.activate(ignoringOtherApps: true)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.4) {
                      marker("calling terminate")
                      NSApp.terminate(nil)
                      marker("terminate call returned")
                  }
              }

              func applicationShouldTerminate(_ sender: NSApplication) -> NSApplication.TerminateReply {
                  marker("delegate entered " + mode + " ready=" + String(ready))
                  if mode == "old" {
                      Task { @MainActor in
                          marker("old cleanup task entered")
                          try? await Task.sleep(nanoseconds: 100_000_000)
                          marker("old cleanup finished; replying true")
                          sender.reply(toApplicationShouldTerminate: true)
                      }
                      marker("return terminateLater")
                      return .terminateLater
                  }
                  if ready {
                      marker("return terminateNow")
                      return .terminateNow
                  }
                  if !cleaning {
                      cleaning = true
                      Task { @MainActor in
                          marker("new cleanup task entered")
                          try? await Task.sleep(nanoseconds: 100_000_000)
                          marker("new cleanup finished; requesting termination again")
                          self.ready = true
                          sender.terminate(nil)
                      }
                  }
                  marker("return terminateCancel")
                  return .terminateCancel
              }

              func applicationWillTerminate(_ notification: Notification) {
                  marker("applicationWillTerminate")
              }
          }

          @main
          struct QuitProbe {
              @MainActor static func main() {
                  let app = NSApplication.shared
                  let delegate = QuitDelegate(mode: CommandLine.arguments[1])
                  app.delegate = delegate
                  app.setActivationPolicy(.regular)
                  withExtendedLifetime(delegate) { app.run() }
                  marker("NSApplication.run returned")
              }
          }
          SWIFT
          swiftc -parse-as-library -swift-version 5 -O \
            "$RUNNER_TEMP/appkit-quit-probe/QuitProbe.swift" \
            -o "$RUNNER_TEMP/appkit-quit-probe/QuitProbe"
          /usr/bin/python3 - <<'PY'
          import json, os, pathlib, signal, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'appkit-quit-probe'
          report = {'scope':'AppKit termination capability only; no production app source modified', 'modes':{}}
          for mode in ('old','new'):
              path = root / (mode + '.log')
              started = time.monotonic()
              with path.open('w') as output:
                  child = subprocess.Popen([str(root / 'QuitProbe'),mode], stdout=output,
                      stderr=subprocess.STDOUT, start_new_session=True)
                  timed_out = False
                  try: code = child.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      os.killpg(child.pid,signal.SIGKILL)
                      code = child.wait(timeout=3)
              text = path.read_text()
              report['modes'][mode] = {'exit_code':code,'timed_out':timed_out,
                  'elapsed_seconds':round(time.monotonic()-started,3), 'markers':text.splitlines()}
              print(mode, text, flush=True)
          old, new = report['modes']['old'], report['modes']['new']
          report['hypothesis_supported'] = old['timed_out'] and not new['timed_out'] and new['exit_code'] == 0
          report['new_pattern_passed'] = not new['timed_out'] and new['exit_code'] == 0 and 'applicationWillTerminate' in new['markers']
          (root / 'termination-report.json').write_text(json.dumps(report,indent=2) + '\n')
          print(json.dumps(report,indent=2))
          if not report['new_pattern_passed']: raise SystemExit('Proposed termination pattern did not exit cleanly')
          PY
      - name: Upload AppKit termination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appkit-termination-probe
          path: ${{ runner.temp }}/appkit-quit-probe/
          if-no-files-found: warn

  app-container-relocation:
    if: inputs.probe == 'relocation'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Measure signed app relocation and protected Contents on Darwin
        run: |
          /usr/bin/python3 - <<'PY'
          import errno, json, os, pathlib, plistlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'app-container-relocation-probe'
          app = root / 'original/Elichika.app'
          target = root / '이동한 Elichika 앱/Elichika.app'
          contents = app / 'Contents'
          executable = contents / 'MacOS/Elichika'
          source = contents / 'Resources/shared-tool.py'
          executable.parent.mkdir(parents=True)
          source.parent.mkdir(parents=True)
          target.parent.mkdir(parents=True)
          source.write_text('# preserved shared source\n')
          for path in [app,contents,*contents.rglob('*')]:
              path.chmod(0o755 if path.is_dir() else 0o644)
          subprocess.run(['/usr/bin/clang','-x','c','-o',str(executable),'-'],
              input='int main(void) { return 0; }\n',text=True,check=True)
          (contents/'Info.plist').write_bytes(plistlib.dumps({'CFBundleExecutable':'Elichika',
              'CFBundleIdentifier':'com.tagundo.elichika.move-probe','CFBundleName':'Elichika',
              'CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0'}))
          subprocess.run(['/usr/bin/codesign','--force','--sign','-',str(executable)],check=True)
          subprocess.run(['/usr/bin/codesign','--force','--sign','-',str(app)],check=True)
          for path in [*app.rglob('*'),app]:
              path.chmod(path.stat().st_mode & ~0o222)
          report={'scope':'Darwin signed app container permission capability; production source unchanged'}
          before={path.relative_to(app).as_posix():oct(path.stat().st_mode & 0o777) for path in contents.rglob('*')}
          try:
              os.rename(app,target)
          except OSError as error:
              report['root_0555_rename']={'failed':True,'errno':error.errno,'message':error.strerror}
          else:
              report['root_0555_rename']={'failed':False}
              os.rename(target,app)
          app.chmod(0o755)
          subprocess.run(['/usr/bin/codesign','--verify','--deep','--strict',str(app)],check=True)
          os.rename(app,target)
          assert not app.exists() and target.is_dir()
          after={path.relative_to(target).as_posix():oct(path.stat().st_mode & 0o777) for path in (target/'Contents').rglob('*')}
          assert before==after and target.stat().st_mode & 0o777 == 0o755
          assert (target/'Contents').stat().st_mode & 0o777 == 0o555
          assert (target/'Contents/MacOS/Elichika').stat().st_mode & 0o777 == 0o555
          assert (target/'Contents/Resources/shared-tool.py').stat().st_mode & 0o777 == 0o444
          subprocess.run(['/usr/bin/codesign','--verify','--deep','--strict',str(target)],check=True)
          subprocess.run([str(target/'Contents/MacOS/Elichika')],check=True)
          report.update(status='PASS',root_0755_rename='PASS',original_path_removed=not app.exists(),
              signed_contents_modes_unchanged=True,signature_before_and_after='PASS',relocated_executable='PASS',modes=after)
          (root/'relocation-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Upload Darwin relocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-container-relocation-probe
          path: ${{ runner.temp }}/app-container-relocation-probe/relocation-report.json
          if-no-files-found: warn

  native-unicode-paths:
    if: inputs.probe == 'unicode'
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Compare native file identity and raw versus normalized JavaScript suffix
        run: |
          mkdir -p "$RUNNER_TEMP/native-unicode-probe"
          cat > "$RUNNER_TEMP/native-unicode-probe/UnicodeProbe.swift" <<'SWIFT'
          import AppKit
          import Foundation
          import JavaScriptCore
          import WebKit

          @MainActor
          final class UnicodeDelegate: NSObject, NSApplicationDelegate, WKNavigationDelegate {
              let directory = URL(fileURLWithPath: CommandLine.arguments[1], isDirectory: true)
              var window: NSWindow!
              var webView: WKWebView!
              var report: [String:Any] = [:]
              var expression = ""

              func fail(_ error: Error) {
                  report["status"] = "FAIL"; report["error"] = error.localizedDescription
                  finish(false)
              }

              func applicationDidFinishLaunching(_ notification: Notification) {
                  do {
                      let name = "분수 의상.zip"
                      let selected = directory.appendingPathComponent(name)
                      let bytes = Data([0x50,0x4b,3,4,0,1,2,3])
                      try bytes.write(to: selected)
                      let canonical = selected.resolvingSymlinksInPath().standardizedFileURL
                      let original = try FileManager.default.attributesOfItem(atPath: selected.path)
                      let resolved = try FileManager.default.attributesOfItem(atPath: canonical.path)
                      let sameIdentity = (original[.systemFileNumber] as? NSNumber) == (resolved[.systemFileNumber] as? NSNumber)
                          && (original[.systemNumber] as? NSNumber) == (resolved[.systemNumber] as? NSNumber)
                      report = ["scope":"Foundation file identity and native JSC/WK filename comparison only",
                          "requested_path":selected.path,"canonical_path":canonical.path,"filename":name,
                          "requested_codepoints":selected.path.unicodeScalars.map { String($0.value,radix:16) },
                          "canonical_codepoints":canonical.path.unicodeScalars.map { String($0.value,radix:16) },
                          "same_device_and_inode":sameIdentity,
                          "same_file_bytes":try Data(contentsOf:canonical)==bytes]
                      let values = ["path":canonical.path,"filename":name]
                      let json = String(decoding:try JSONSerialization.data(withJSONObject:values),as:UTF8.self)
                      expression = "(function(){var v=" + json + ";return JSON.stringify({rawEndsWith:v.path.endsWith('/'+v.filename),nfcEndsWith:v.path.normalize('NFC').endsWith('/'+v.filename.normalize('NFC')),actualBasename:v.path.split('/').pop(),normalizedBasename:v.path.split('/').pop().normalize('NFC'),rawCodepoints:Array.from(v.path.split('/').pop()).map(function(c){return c.codePointAt(0).toString(16);})});})()"
                      let context = JSContext()!
                      guard let result = context.evaluateScript(expression)?.toString(),
                          let data = result.data(using:.utf8),
                          let output = try JSONSerialization.jsonObject(with:data) as? [String:Any] else {
                          throw NSError(domain:"JSC",code:1,userInfo:[NSLocalizedDescriptionKey:"No JavaScriptCore result"])
                      }
                      report["JavaScriptCore"] = output
                      webView = WKWebView(frame:NSRect(x:0,y:0,width:640,height:360))
                      webView.navigationDelegate = self
                      window = NSWindow(contentRect:webView.frame,styleMask:[.titled,.closable],backing:.buffered,defer:false)
                      window.contentView = webView; window.makeKeyAndOrderFront(nil)
                      NSApp.activate(ignoringOtherApps:true)
                      webView.loadHTMLString("<!doctype html><meta charset='utf-8'><p>Native Unicode filename probe</p>",baseURL:nil)
                  } catch { fail(error) }
              }

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  webView.evaluateJavaScript(expression) { [self] result,error in
                      do {
                          if let error { throw error }
                          guard let result = result as? String,let data = result.data(using:.utf8),
                              let output = try JSONSerialization.jsonObject(with:data) as? [String:Any],
                              let jsc = report["JavaScriptCore"] as? [String:Any] else {
                              throw NSError(domain:"WK",code:1,userInfo:[NSLocalizedDescriptionKey:"No WebKit result"])
                          }
                          report["WKWebView"] = output
                          let passed = report["same_device_and_inode"] as? Bool == true
                              && report["same_file_bytes"] as? Bool == true
                              && jsc["rawEndsWith"] as? Bool == false && output["rawEndsWith"] as? Bool == false
                              && jsc["nfcEndsWith"] as? Bool == true && output["nfcEndsWith"] as? Bool == true
                          report["status"] = passed ? "PASS_NFD_SUFFIX_MISMATCH_WITH_SAME_FILE" : "UNEXPECTED_RESULT"
                          finish(passed)
                      } catch { fail(error) }
                  }
              }

              func finish(_ passed:Bool) {
                  let data = try! JSONSerialization.data(withJSONObject:report,options:[.prettyPrinted,.sortedKeys])
                  try! data.write(to:directory.appendingPathComponent("unicode-report.json"))
                  FileHandle.standardOutput.write(data); FileHandle.standardOutput.write(Data([10]))
                  Darwin.exit(passed ? 0 : 1)
              }
          }

          @main struct UnicodeProbe {
              @MainActor static func main() {
                  let app = NSApplication.shared; let delegate = UnicodeDelegate()
                  app.delegate = delegate; app.setActivationPolicy(.regular)
                  withExtendedLifetime(delegate) { app.run() }
              }
          }
          SWIFT
          swiftc -parse-as-library -swift-version 5 -O \
            "$RUNNER_TEMP/native-unicode-probe/UnicodeProbe.swift" \
            -o "$RUNNER_TEMP/native-unicode-probe/UnicodeProbe"
          /usr/bin/python3 - <<'PY'
          import os,pathlib,signal,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-unicode-probe'
          with (root/'native-unicode.log').open('w') as output:
              child=subprocess.Popen([str(root/'UnicodeProbe'),str(root)],stdout=output,stderr=subprocess.STDOUT,start_new_session=True)
              try: code=child.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid,signal.SIGKILL);child.wait();raise
          print((root/'native-unicode.log').read_text())
          if code:raise SystemExit(code)
          PY
      - name: Upload native Unicode identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-unicode-path-probe
          path: |
            ${{ runner.temp }}/native-unicode-probe/unicode-report.json
            ${{ runner.temp }}/native-unicode-probe/native-unicode.log
          if-no-files-found: warn
