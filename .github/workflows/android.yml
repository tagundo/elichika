name: macOS native WebKit capability probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - name: Compile and execute native AppKit WebKit probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          uname -a > "$RUNNER_TEMP/evidence/host.txt"
          swift --version >> "$RUNNER_TEMP/evidence/host.txt"
          xcodebuild -version >> "$RUNNER_TEMP/evidence/host.txt"
          cat > "$RUNNER_TEMP/Probe.swift" <<'SWIFT'
          import AppKit
          import Foundation
          import WebKit

          final class Probe: NSObject, NSApplicationDelegate, WKNavigationDelegate {
              var window: NSWindow!
              var view: WKWebView!
              var finished = false
              let output = URL(fileURLWithPath: CommandLine.arguments[1], isDirectory: true)
              func applicationDidFinishLaunching(_ notification: Notification) {
                  NSApp.setActivationPolicy(.regular)
                  window = NSWindow(contentRect: NSRect(x: 0, y: 0, width: 800, height: 600),
                                    styleMask: [.titled, .closable, .resizable],
                                    backing: .buffered, defer: false)
                  let configuration = WKWebViewConfiguration()
                  configuration.websiteDataStore = .nonPersistent()
                  view = WKWebView(frame: window.contentView!.bounds, configuration: configuration)
                  view.autoresizingMask = [.width, .height]
                  view.navigationDelegate = self
                  window.contentView!.addSubview(view)
                  window.makeKeyAndOrderFront(nil)
                  NSApp.activate(ignoringOtherApps: true)
                  view.loadHTMLString("<html><body><h1>Elichika native WebKit probe</h1><canvas id='c' width='256' height='256'></canvas></body></html>",
                                      baseURL: URL(string: "http://127.0.0.1/"))
                  DispatchQueue.main.asyncAfter(deadline: .now() + 25) { [self] in
                      if !finished { finish(["status":"TIMEOUT"]) }
                  }
              }
              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  let js = """
                  (() => {
                    const c=document.getElementById('c');
                    const gl=c.getContext('webgl2')||c.getContext('webgl');
                    if(!gl)return JSON.stringify({status:'CAPABILITY',webgl:false,userAgent:navigator.userAgent});
                    gl.clearColor(0.1,0.2,0.7,1);gl.clear(gl.COLOR_BUFFER_BIT);
                    const p=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
                    const d=gl.getExtension('WEBGL_debug_renderer_info');
                    return JSON.stringify({status:'CAPABILITY',webgl:true,version:gl.getParameter(gl.VERSION),
                      renderer:d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),
                      pixel:Array.from(p),error:gl.getError(),userAgent:navigator.userAgent});
                  })()
                  """
                  webView.evaluateJavaScript(js) { [self] value, error in
                      var report: [String:Any] = ["status":"JS_ERROR", "error":error?.localizedDescription ?? ""]
                      if let text = value as? String, let data = text.data(using:.utf8),
                         let object = try? JSONSerialization.jsonObject(with:data) as? [String:Any] { report=object }
                      DispatchQueue.main.asyncAfter(deadline:.now()+2) { [self] in
                          view.takeSnapshot(with:nil) { [self] image, snapshotError in
                              var result=report
                              result["snapshotError"]=snapshotError?.localizedDescription ?? ""
                              if let tiff=image?.tiffRepresentation, let bitmap=NSBitmapImageRep(data:tiff),
                                 let png=bitmap.representation(using:.png,properties:[:]) {
                                  try? png.write(to:output.appendingPathComponent("webkit.png"))
                                  result["snapshotBytes"]=png.count
                              }
                              finish(result)
                          }
                      }
                  }
              }
              func finish(_ report: [String:Any]) {
                  guard !finished else { return }; finished=true
                  if let data=try? JSONSerialization.data(withJSONObject:report,options:[.prettyPrinted,.sortedKeys]) {
                      try? data.write(to:output.appendingPathComponent("capability.json"))
                      print(String(data:data,encoding:.utf8)!)
                  }
                  NSApp.terminate(nil)
              }
          }
          let application=NSApplication.shared
          let delegate=Probe()
          application.delegate=delegate
          application.run()
          SWIFT
          swiftc -swift-version 5 "$RUNNER_TEMP/Probe.swift" -o "$RUNNER_TEMP/Probe"
          "$RUNNER_TEMP/Probe" "$RUNNER_TEMP/evidence"
          test -s "$RUNNER_TEMP/evidence/capability.json"
      - name: Upload actual native probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-capability-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
