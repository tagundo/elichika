name: Published v4 native Android updater cProfile

on: workflow_dispatch
permissions:
  contents: read
  actions: read

jobs:
  android-profile:
    if: github.repository == 'tagundo/elichika' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/payload-v4-profile-qa'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify profile contracts and fixed published artifact provenance
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_android_payload_upgrade_benchmark_*.py'
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          source = 'cca1438a8ee4408123e6ede22d974f1dbf2a823b'
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/' + path], text=True, timeout=30))
          run = api('actions/runs/41884324695')
          assert (run['status'],run['conclusion'],run['head_sha']) == ('completed','success',source), 'Published source build mismatch'
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == 'tagundo/elichika', 'Published build repository mismatch'
          artifact_page = api('actions/runs/41884324695/artifacts?per_page=100')
          assert artifact_page['total_count'] <= 100, 'Artifact page requires review'
          matches = [a for a in artifact_page['artifacts'] if a['name'] == 'elichika-native-test-apk']
          assert len(matches) == 1 and matches[0]['id'] == 13352072069 and not matches[0]['expired'], 'Original test artifact mismatch'
          artifact = matches[0]
          assert artifact['workflow_run']['id'] == 41884324695 and artifact['workflow_run']['head_sha'] == source, 'Original test artifact source mismatch'
          assert artifact['digest'] == 'sha256:cc69cb0d542ffc3c3eae250834908cc9c3d9af7643df9cffb219bc8cf25a4418', 'Original test ZIP digest mismatch'
          tag = api('git/ref/tags/v2026.11.04.4')['object']
          assert tag['type'] == 'commit' and tag['sha'] == source, 'Published source tag mismatch'
          release = api('releases/434326439')
          assert release['draft'] is False and release['prerelease'] is False and release['tag_name'] == 'v2026.11.04.4' and release['target_commitish'] == source, 'Expected published v4 release'
          apk_sha = '815e9dd70d1b0e89b97f76b83c1b71136ec7f5f73f6e9a6a983d123a7aa42cac'
          checksum = (apk_sha + '  elichika-2026.11.04.4.apk\n').encode()
          expected = {'elichika-2026.11.04.4.apk': (289671611,apk_sha), 'SHA256SUMS': (len(checksum),hashlib.sha256(checksum).hexdigest())}
          assert len(checksum) == 92 and len(release['assets']) == 2 and {a['name'] for a in release['assets']} == set(expected), 'Published asset set mismatch'
          for asset in release['assets']:
              size,digest = expected[asset['name']]
              assert (asset['state'],asset['size'],asset['digest']) == ('uploaded',size,'sha256:' + digest), 'Published asset identity mismatch'
          Path('evidence/profile-source-binding.json').write_text(json.dumps({'build_run_id':41884324695,'source_sha':source,'test_artifact':{key:artifact[key] for key in ('id','name','size_in_bytes','digest')},'published_release_id':release['id'],'published_apk_sha256':apk_sha,'benchmark_script_sha256':'46b41475adbf2a40d0f94954751b6bf584a1521cb5a571c955fe8ff44e6c94b4','instrumentation_modified':False},indent=2) + '\n')
          print('Verified exact published v4 and original same-run signed instrumentation')
          PY

      - name: Download the original signed same-build instrumentation without modification
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 13352072069
          merge-multiple: true
          path: instrumentation
          repository: tagundo/elichika
          run-id: 41884324695
          github-token: ${{ github.token }}

      - name: Download fixed public v4 target and separate v2 fixture dataset
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output target.apk \
            https://github.com/tagundo/elichika/releases/download/v2026.11.04.4/elichika-2026.11.04.4.apk
          curl --fail --location --retry 2 --output fixture.apk \
            https://github.com/tagundo/elichika/releases/download/v2026.11.04.2/elichika-2026.11.04.2.apk

      - name: Prepare pinned private native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb apksigner
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p "$RUNNER_TEMP/android-payload-benchmark-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker run --detach --privileged --name android-payload-benchmark \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-payload-benchmark-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell id >> evidence/host.txt

      - name: Profile both published v4 updater cases on the fixed inputs
        run: >-
          python3 -u tests/android_payload_upgrade_benchmark_profile.py
          --target target.apk --fixture fixture.apk
          --instrumentation-dir instrumentation --evidence evidence

      - name: Upload only synthetic profile reports and instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-payload-v4-cprofile
          path: evidence/
          if-no-files-found: warn

      - name: Stop disposable Android container
        if: always()
        run: docker rm -f android-payload-benchmark || true
