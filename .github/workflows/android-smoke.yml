name: Android GL expected mod loss negative control

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing Build Android APK run containing the signed artifact"
        type: string
        required: true
      candidate_sha256:
        description: "SHA256 of the exact signed candidate APK"
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true
      tap_surface_center:
        description: "One tap at the observed Unity surface center (never an inferred menu button)"
        type: boolean
        default: false
      prepare_new_home:
        description: "Prepare the fixed disposable modded Home fixture (QA branch only)"
        type: boolean
        default: false
      latest_baseline_upgrade:
        description: "Upgrade the latest Nov3 signed APK with one synthetic account"
        type: boolean
        default: false
      check_resource_modes:
        description: "Check comfortable/original in fresh processes and after restart"
        type: boolean
        default: false
      skip_game:
        description: "Run only the requested APK preservation checks"
        type: boolean
        default: false
      prepare_english:
        description: "Enable Korean/Light QA preferences and up to 40 live rounds (legacy input name)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate_sha256:
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ inputs.source_run_id && 90 || 25 }}
    env:
      GL_QA_LANGUAGE: ko
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim unused toolchains for full retained game cache
        if: ${{ inputs.source_run_id && inputs.prepare_english && !inputs.skip_game }}
        run: |
          set -euo pipefail
          # Disposable runner only; keep Java, Python, SDK build-tools and adb.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          mkdir -p evidence
          df -h "$RUNNER_TEMP" > evidence/full-cache-disk-before.txt

      - name: Prepare native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/android-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          if [ "${{ inputs.prepare_english }}" = true ] && [ "${{ inputs.skip_game }}" != true ]; then
            python3 - <<'PY'
          import json, os, pathlib, shutil
          free = shutil.disk_usage(os.environ["RUNNER_TEMP"]).free
          evidence = {"available_bytes": free, "minimum_bytes": 52 * 1024**3,
                      "scope": "Retained full-download GL client plus server pack cache"}
          pathlib.Path("evidence/full-cache-disk.json").write_text(json.dumps(evidence, indent=2) + "\n")
          assert free >= evidence["minimum_bytes"], "Insufficient disposable runner disk for retained Full-download reproduction"
          PY
          fi
          docker image inspect redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            --format '{{json .RepoDigests}} {{.Architecture}}' >> evidence/host.txt
          docker run --detach --privileged --name android-release-smoke \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0

      - name: Wait for Android boot and verify native ABI
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell id >> evidence/host.txt
          adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/android-boot.png

      - name: Confirm Android immersive-mode education for the test user
        run: |
          set -euo pipefail
          # The one-time system tutorial steals focus from fullscreen captures.
          # Acknowledge it on this disposable user without changing app assertions.
          adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r' > evidence/immersive-mode-confirmations-before.txt
          adb -s 127.0.0.1:5555 shell settings --user 0 put secure immersive_mode_confirmations confirmed
          adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r' | tee evidence/immersive-mode-confirmations-after.txt
          test "$(cat evidence/immersive-mode-confirmations-after.txt)" = confirmed

      - name: Use Chromium ANGLE for Redroid WebGL
        run: |
          set -euo pipefail
          # The pinned Redroid image's vendor ANGLE crashes compiling WebGL
          # shaders. WebView's own ANGLE uses the same CPU Vulkan device and
          # preserves the textured-render assertions used by the instrumentation checks.
          printf '%s\n' '_ --use-gl=angle --use-angle=vulkan --webview-verbose-logging' > "$RUNNER_TEMP/webview-command-line"
          adb -s 127.0.0.1:5555 push "$RUNNER_TEMP/webview-command-line" /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell chmod 644 /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell cat /data/local/tmp/webview-command-line > evidence/webview-command-line.txt

      - name: Download this build's signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java for scoped APK signature verification
        if: inputs.source_run_id
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up APK signature verification tools
        if: inputs.source_run_id
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;34.0.0
          log-accepted-android-sdk-licenses: false

      - name: Pin apksigner and native ARM64 ADB
        if: inputs.source_run_id
        run: |
          set -euo pipefail
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_path"
          test -x "$sdk_path/build-tools/34.0.0/apksigner"
          "$sdk_path/build-tools/34.0.0/apksigner" version > evidence/apksigner-version.txt
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_path" "$sdk_path" >> "$GITHUB_ENV"
          # The SDK's Linux platform-tools may be x86; keep the apt ARM64 adb.
          test -x /usr/bin/adb
          native_adb_dir="$RUNNER_TEMP/gl-ko-native-adb"
          mkdir -p "$native_adb_dir"
          ln -s /usr/bin/adb "$native_adb_dir/adb"
          printf '%s\n' "$native_adb_dir" >> "$GITHUB_PATH"
          /usr/bin/adb version > evidence/native-adb-version.txt

      - name: Prepare pinned live Unity QA tooling
        if: ${{ inputs.source_run_id && inputs.prepare_english && !inputs.skip_game }}
        run: >-
          bash tests/gl_ui_runtime/prepare_tools.sh
          "$RUNNER_TEMP/gl-live-python" "$GITHUB_WORKSPACE/tests/gl_ui_runtime"
          127.0.0.1:5555 evidence/gl-live-tools.json

      - name: Verify APK and capture requested GL evidence on native ARM64
        if: inputs.source_run_id
        env:
          TAP_SURFACE: ${{ inputs.tap_surface_center }}
          PREPARE_HOME: ${{ inputs.prepare_new_home }}
          PREPARE_ENGLISH: ${{ inputs.prepare_english }}
          LATEST_BASELINE: ${{ inputs.latest_baseline_upgrade }}
          CHECK_MODES: ${{ inputs.check_resource_modes }}
          SKIP_GAME: ${{ inputs.skip_game }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$LATEST_BASELINE" = true ]; then
            curl --fail --location --retry 2 --output latest-baseline.apk \
              https://github.com/tagundo/elichika/releases/download/v2026.11.03.4/elichika-2026.11.03.4.apk
            extra+=(--baseline latest-baseline.apk \
              --baseline-sha256 70fa45d9fbb70e92b56b486617e4cc3c4afc39a76922f7f941caf6a29787fa8f \
              --baseline-version-code 2026110304)
          fi
          if [ "$CHECK_MODES" = true ]; then extra+=(--check-resource-modes); fi
          if [ "$SKIP_GAME" = true ]; then
            extra+=(--skip-game)
          else
            curl --fail --location --retry 2 --output LLAS_GL_LOCAL.apk \
              https://github.com/arina999999997/elichika/releases/download/clients/LLAS_GL_LOCAL.apk
            extra+=(--game LLAS_GL_LOCAL.apk)
          fi
          if [ "$TAP_SURFACE" = true ]; then extra+=(--tap-surface-center); fi
          if [ "$PREPARE_HOME" = true ]; then
            test "$PREPARE_ENGLISH" = true
            test "$TAP_SURFACE" = true
            test "$SKIP_GAME" != true
            test "$LATEST_BASELINE" != true
            extra+=(--prepare-mod-home)
          fi
          if [ "$PREPARE_ENGLISH" = true ] && [ "$SKIP_GAME" != true ]; then
            extra+=(--prepare-english --qa-download-mode light --live-python "$RUNNER_TEMP/gl-live-python/bin/python")
          fi
          python3 -u tests/android_gl_visual_smoke.py \
            --candidate "candidate/elichika-$VERSION_NAME.apk" \
            --candidate-sha256 "$CANDIDATE_SHA" \
            --qa-language "$GL_QA_LANGUAGE" \
            --version-code "$VERSION_CODE" --evidence evidence/gl \
            "${extra[@]}"

      - name: Download the latest official APK
        if: ${{ !inputs.source_run_id }}
        run: >-
          curl --fail --location --retry 2 --output official.apk
          https://github.com/tagundo/elichika/releases/download/v2026.08.23.1/elichika-2026.08.23.1.apk

      - name: Test actual APK upgrade, accounts, services and gameplay APIs
        if: ${{ !inputs.source_run_id }}
        run: >-
          python3 -u tests/android_release_smoke.py
          --old official.apk --candidate "candidate/elichika-${{ inputs.version_name }}.apk"
          --candidate-sha256 "${{ inputs.candidate_sha256 }}"
          --version-code "${{ inputs.version_code }}"
          --evidence evidence

      - name: Download native-package instrumentation
        if: ${{ !inputs.source_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: elichika-native-test-apk
          path: instrumentation

      - name: Exercise Python, console, multiwindow and service configuration
        if: ${{ !inputs.source_run_id }}
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 install -r instrumentation/*.apk
          # These service-control checks intentionally require a stopped server.
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e class com.tagundo.elichika.ModelViewerWebViewTest,com.tagundo.elichika.ModelViewerAutoFaceTest,com.tagundo.elichika.ModelViewerRigTest,com.tagundo.elichika.NativePythonTest,com.tagundo.elichika.ConsoleLayoutTest,com.tagundo.elichika.WindowBusTest,com.tagundo.elichika.ServerPreparationTest,com.tagundo.elichika.ServerControlTest,com.tagundo.elichika.ServerConfigTest,com.tagundo.elichika.MeshWebViewTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-instrumentation.txt
          python3 -c 'from pathlib import Path; text=Path("evidence/native-instrumentation.txt").read_text(); assert "OK (15 tests)" in text and "FAILURES" not in text, text'

      - name: Collect Android diagnostics
        if: always()
        run: |
          mkdir -p evidence
          docker logs android-release-smoke > evidence/container.log 2>&1 || true
          adb -s 127.0.0.1:5555 logcat -d > evidence/logcat.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell dumpsys webviewupdate > evidence/webview-provider.txt 2>&1 || true
          adb -s 127.0.0.1:5555 exec-out cat /sdcard/Download/sukusta/logs/elichika.log > evidence/server-console.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/final-screen.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-qa.png > evidence/model-viewer.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-auto-face.png > evidence/model-viewer-auto-face.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-auto-face-disabled.png > evidence/model-viewer-auto-face-disabled.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-rig.png > evidence/model-viewer-rig.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-shader.png > evidence/model-viewer-shader.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-rig-report.json > evidence/model-viewer-rig-report.json 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-shader-report.json > evidence/model-viewer-shader-report.json 2>/dev/null || true
          sudo dmesg | tail -100 > evidence/kernel-tail.txt || true
          if [ -f tests/gl_ui_runtime/downloads/frida-server.log ]; then
            cp tests/gl_ui_runtime/downloads/frida-server.log evidence/gl-frida-server.log
          fi

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-smoke-evidence
          path: evidence/
          if-no-files-found: warn

      # Keep this Android instance alive while the operator reviews each artifact.
      # Follow-up command sequences are bounded to 1..40 in a 90-minute manual job.
      # Commands must match this run_id and sequence, for example:
      # {"run_id":"<this run>","sequence":1,"action":"capture"}
      # tap_widget.expected_bounds uses inputDiagnostics.raycastArea.geometry.bounds.
      # Idle, close, malformed commands and infrastructure errors close later rounds.
      - name: GL follow-up round 1
        if: ${{ !cancelled() && inputs.source_run_id && inputs.prepare_english && inputs.prepare_new_home && !inputs.skip_game && hashFiles('evidence/gl-followup-closed.marker') == '' }}
        uses: ./.github/actions/gl-followup
        with:
          sequence: '1'

      - name: GL follow-up round 2
        if: ${{ !cancelled() && inputs.source_run_id && inputs.prepare_english && inputs.prepare_new_home && !inputs.skip_game && hashFiles('evidence/gl-followup-closed.marker') == '' }}
