name: Current native Android payload-upgrade CPU profile

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-profile:
    if: github.repository == 'tagundo/elichika' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/payload-upgrade-profile-qa'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify fixed APK and instrumentation artifact provenance
        run: |
          mkdir -p evidence
          python3 -m unittest discover -s tests -p 'test_android_payload_upgrade_*profile*.py'
          python3 - <<'PYCODE'
          import importlib.util, json, subprocess
          from pathlib import Path
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/' + path],text=True,timeout=30))
          spec=importlib.util.spec_from_file_location('paired','tests/android_payload_upgrade_benchmark_pair.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          run,build=module.wait_for_candidate_build(api,'41866258468','4e9ca3b620e3010cf0f9fccfa3f3799b8a9da3c2')
          expected=[(13342713626,'elichika-release-apk',41866258468,'4e9ca3b620e3010cf0f9fccfa3f3799b8a9da3c2','a0fa6dcbc9d6ccef5f5cbbbcd1bbedb257115f8fba45d19dae43a3a19f931001'),(13345028649,'patched-benchmark-instrumentation',41874115141,'1f6edcd7e1167ac738181c5e65f5b49e294949b8','220d3ff7ee84f5efd06429257c34b203c8da7e2fa97297540c2b3c2fdca7c17d')]
          checked=[]
          for ident,name,run_id,source,digest in expected:
              artifact=api('actions/artifacts/'+str(ident))
              assert artifact['id']==ident and artifact['name']==name and not artifact['expired']
              assert artifact['workflow_run']['id']==run_id and artifact['workflow_run']['head_sha']==source
              assert artifact['digest']=='sha256:'+digest
              checked.append({key:artifact[key] for key in ('id','name','size_in_bytes','digest','workflow_run')})
          Path('evidence/profile-source-binding.json').write_text(json.dumps({'candidate_source_sha':run['head_sha'],'verified_build_job_id':build['id'],'build_verification':build['verification_mode'],'artifacts':checked},indent=2)+'\n')
          PYCODE

      - name: Download previously verified instrumentation without re-signing
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 13345028649
          merge-multiple: true
          path: instrumentation
          repository: tagundo/elichika
          run-id: 41874115141
          github-token: ${{ github.token }}

      - name: Download exact public current APK and fixed fixture APK
        run: |
          curl --fail --location --retry 2 --output candidate.apk https://github.com/tagundo/elichika/releases/download/v2026.11.04.3/elichika-2026.11.04.3.apk
          curl --fail --location --retry 2 --output baseline.apk https://github.com/tagundo/elichika/releases/download/v2026.11.04.2/elichika-2026.11.04.2.apk

      - name: Prepare pinned private native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p "$RUNNER_TEMP/android-payload-benchmark-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker run --detach --privileged --name android-payload-benchmark \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-payload-benchmark-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell id >> evidence/host.txt

      - name: Profile only the installed current engine with fixed synthetic inputs
        run: >-
          python3 -u tests/android_payload_upgrade_candidate_profile.py
          --candidate candidate.apk --fixture baseline.apk
          --instrumentation-dir instrumentation --evidence evidence

      - name: Upload only synthetic profile reports and instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-payload-upgrade-current-profile
          path: evidence/
          if-no-files-found: warn

      - name: Stop disposable Android container
        if: always()
        run: docker rm -f android-payload-benchmark || true
