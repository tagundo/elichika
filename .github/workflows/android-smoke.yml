name: Paired native Android hash-validation integration benchmark

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Build Android APK run containing the candidate and instrumentation artifacts
        required: true
        type: string
      candidate_sha256:
        description: Independently audited raw candidate APK SHA-256
        required: true
        type: string
      candidate_source_sha:
        description: Reviewed candidate source commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android-benchmark:
    if: github.repository == 'tagundo/elichika' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/payload-hash-validation-qa'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify pair contracts and candidate build artifact provenance
        id: provenance
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_android_payload_upgrade_benchmark_*.py'
          mkdir -p evidence
          python3 - <<'PY'
          import importlib.util, json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['CANDIDATE_RUN_ID']; source = os.environ['CANDIDATE_SOURCE_SHA']; digest = os.environ['CANDIDATE_SHA256']
          assert re.fullmatch(r'[1-9][0-9]{0,19}', run_id), 'Invalid run id'
          assert re.fullmatch(r'[0-9a-f]{40}', source) and re.fullmatch(r'[0-9a-f]{64}', digest), 'Invalid candidate identity'
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/' + path], text=True, timeout=30))
          spec = importlib.util.spec_from_file_location('paired_benchmark', 'tests/android_payload_upgrade_benchmark_pair.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          run, build = module.wait_for_candidate_build(api, run_id, source)
          artifacts = api('actions/runs/' + run_id + '/artifacts?per_page=100')['artifacts']
          selected = {}
          for name in ('elichika-release-apk','elichika-native-test-apk'):
              matches = [artifact for artifact in artifacts if artifact['name'] == name and not artifact['expired']]
              assert len(matches) == 1, 'Expected unique candidate artifact'
              artifact = matches[0]
              assert artifact['workflow_run']['id'] == int(run_id) and artifact['workflow_run']['head_sha'] == source, 'Artifact build source mismatch'
              selected[name] = {key: artifact[key] for key in ('id','name','size_in_bytes','digest')}
          Path('evidence/candidate-artifact-binding.json').write_text(json.dumps({'run_id':run_id,'source_sha':source,'apk_sha256':digest,'verified_build_job_id':build['id'],'build_verification':build['verification_mode'],'observed_build_status':build['status'],'artifacts':selected},indent=2) + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('candidate_artifact_id=' + str(selected['elichika-release-apk']['id']) + '\n')
              output.write('instrumentation_artifact_id=' + str(selected['elichika-native-test-apk']['id']) + '\n')
          print(json.dumps({'preflight':'artifact_source_verified','build_verification':build['verification_mode'],'observed_job_status':build['status']}))
          PY

      - name: Download the exact verified candidate wrapper artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.provenance.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: candidate
          repository: tagundo/elichika
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download the same-run unmodified instrumentation artifact for both targets
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.provenance.outputs.instrumentation_artifact_id }}
          merge-multiple: true
          path: instrumentation
          repository: tagundo/elichika
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download the fixed public v3 baseline app and separate v2 fixture dataset
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output baseline.apk \
            https://github.com/tagundo/elichika/releases/download/v2026.11.04.3/elichika-2026.11.04.3.apk
          curl --fail --location --retry 2 --output fixture.apk \
            https://github.com/tagundo/elichika/releases/download/v2026.11.04.2/elichika-2026.11.04.2.apk

      - name: Prepare pinned private native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb apksigner
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p "$RUNNER_TEMP/android-payload-benchmark-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker run --detach --privileged --name android-payload-benchmark \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-payload-benchmark-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell id >> evidence/host.txt

      - name: Run the v3 and candidate engines on the same fixed v2 inputs
        run: >-
          python3 -u tests/android_payload_upgrade_benchmark_pair.py
          --baseline baseline.apk --fixture fixture.apk --candidate-dir candidate
          --instrumentation-dir instrumentation --evidence evidence

      - name: Upload only synthetic benchmark reports and instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-payload-upgrade-paired-benchmark
          path: evidence/
          if-no-files-found: warn

      - name: Stop disposable Android container
        if: always()
        run: docker rm -f android-payload-benchmark || true
