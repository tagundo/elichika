name: Paired native Android payload-upgrade benchmark

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Build Android APK run containing the candidate and instrumentation artifacts
        required: true
        type: string
      candidate_sha256:
        description: Independently audited raw candidate APK SHA-256
        required: true
        type: string
      candidate_source_sha:
        description: Reviewed candidate source commit SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  patch-instrumentation:
    if: github.repository == 'tagundo/elichika' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/payload-upgrade-benchmark-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify pinned instrumentation provenance and patch contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_patch_payload_upgrade_benchmark_apk.py
          mkdir -p instrumentation
          python3 - <<'PY'
          import importlib.util, json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['CANDIDATE_RUN_ID']; source = os.environ['CANDIDATE_SOURCE_SHA']
          assert run_id == '41866258468', 'This QA patch is bound to the audited original build'
          assert source == '4e9ca3b620e3010cf0f9fccfa3f3799b8a9da3c2', 'This QA patch is bound to the audited candidate source'
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/' + path], text=True, timeout=30))
          spec = importlib.util.spec_from_file_location('paired_benchmark', 'tests/android_payload_upgrade_benchmark_pair.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          run, build = module.wait_for_candidate_build(api, run_id, source)
          artifact = api('actions/artifacts/13344245790')
          assert artifact['id'] == 13344245790 and artifact['name'] == 'elichika-native-test-apk' and not artifact['expired'], 'Unexpected original instrumentation artifact'
          assert artifact['workflow_run']['id'] == int(run_id) and artifact['workflow_run']['head_sha'] == source, 'Instrumentation build source mismatch'
          Path('instrumentation/patch-source-binding.json').write_text(json.dumps({'original_build_run_id':run_id,'original_build_source_sha':source,'original_artifact':{key:artifact[key] for key in ('id','name','size_in_bytes','digest')},'verified_build_job_id':build['id']},indent=2) + '\n')
          PY

      - name: Download only the audited original instrumentation APK
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 13344245790
          merge-multiple: true
          path: instrumentation-original
          repository: tagundo/elichika
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Set up JDK 17 for the existing Android signing tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use standard x86 Android SDK build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK_ROOT"
          BUILD_TOOLS="$SDK_ROOT/build-tools/34.0.0"
          if [ ! -x "$BUILD_TOOLS/apksigner" ] || [ ! -x "$BUILD_TOOLS/zipalign" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          fi
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          echo "ANDROID_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Patch the one test asset, align, re-sign and verify every other entry
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          PATCH_WORK="$(mktemp -d "$RUNNER_TEMP/benchmark-apk-patch.XXXXXX")"
          trap 'rm -rf "$PATCH_WORK"' EXIT
          ORIGINAL=instrumentation-original/app-release-androidTest.apk
          SCRIPT=tests/android_payload_upgrade_benchmark.py
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$ORIGINAL" > "$PATCH_WORK/original-certificate.txt"
          python3 tests/patch_payload_upgrade_benchmark_apk.py certificate --report "$PATCH_WORK/original-certificate.txt"
          python3 tests/patch_payload_upgrade_benchmark_apk.py patch \
            --original "$ORIGINAL" --script "$SCRIPT" --output "$PATCH_WORK/unsigned.apk" \
            --manifest "$PATCH_WORK/unsigned-manifest.json"
          "$ANDROID_BUILD_TOOLS/zipalign" -f 4 "$PATCH_WORK/unsigned.apk" "$PATCH_WORK/aligned.apk"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$PATCH_WORK/release.keystore"
          chmod 600 "$PATCH_WORK/release.keystore"
          "$ANDROID_BUILD_TOOLS/apksigner" sign --ks "$PATCH_WORK/release.keystore" \
            --ks-pass env:RELEASE_STORE_PASSWORD --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out instrumentation/app-benchmark-androidTest.apk "$PATCH_WORK/aligned.apk"
          "$ANDROID_BUILD_TOOLS/zipalign" -c 4 instrumentation/app-benchmark-androidTest.apk
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            instrumentation/app-benchmark-androidTest.apk > "$PATCH_WORK/patched-certificate.txt"
          python3 tests/patch_payload_upgrade_benchmark_apk.py verify \
            --original "$ORIGINAL" --script "$SCRIPT" --patched instrumentation/app-benchmark-androidTest.apk \
            --certificate-report "$PATCH_WORK/patched-certificate.txt" \
            --manifest instrumentation/patch-verification.json

      - name: Upload verified patched instrumentation and its manifests only
        uses: actions/upload-artifact@v4
        with:
          name: patched-benchmark-instrumentation
          path: |
            instrumentation/app-benchmark-androidTest.apk
            instrumentation/patch-source-binding.json
            instrumentation/patch-verification.json
          if-no-files-found: error

  android-benchmark:
    needs: patch-instrumentation
    if: github.repository == 'tagundo/elichika' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/payload-upgrade-benchmark-qa'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate candidate source and build artifact provenance
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import importlib.util, json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['CANDIDATE_RUN_ID']; source = os.environ['CANDIDATE_SOURCE_SHA']; digest = os.environ['CANDIDATE_SHA256']
          assert re.fullmatch(r'[1-9][0-9]{0,19}', run_id), 'Invalid run id'
          assert re.fullmatch(r'[0-9a-f]{40}', source) and re.fullmatch(r'[0-9a-f]{64}', digest), 'Invalid candidate identity'
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/tagundo/elichika/' + path], text=True, timeout=30))
          spec = importlib.util.spec_from_file_location('paired_benchmark', 'tests/android_payload_upgrade_benchmark_pair.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          run, build = module.wait_for_candidate_build(api, run_id, source)
          artifacts = api('actions/runs/' + run_id + '/artifacts?per_page=100')['artifacts']
          selected = {}
          for name in ('elichika-release-apk','elichika-native-test-apk'):
              matches = [artifact for artifact in artifacts if artifact['name'] == name and not artifact['expired']]
              assert len(matches) == 1, 'Expected unique candidate artifact'
              selected[name] = {key: matches[0][key] for key in ('id','name','size_in_bytes','digest')}
          Path('evidence/candidate-artifact-binding.json').write_text(json.dumps({'run_id':run_id,'source_sha':source,'apk_sha256':digest,'verified_build_job_id':build['id'],'build_verification':build['verification_mode'],'observed_build_status':build['status'],'artifacts':selected},indent=2) + '\n')
          print(json.dumps({'preflight':'artifact_source_verified','build_verification':build['verification_mode'],'observed_job_status':build['status']}))
          PY

      - name: Download candidate wrapper
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate
          repository: tagundo/elichika
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download the same verified patched instrumentation for both targets
        uses: actions/download-artifact@v4
        with:
          name: patched-benchmark-instrumentation
          path: instrumentation

      - name: Include instrumentation patch proof in benchmark evidence
        run: cp instrumentation/patch-source-binding.json instrumentation/patch-verification.json evidence/

      - name: Download fixed public baseline and fixture dataset
        run: >-
          curl --fail --location --retry 2 --output baseline.apk
          https://github.com/tagundo/elichika/releases/download/v2026.11.04.2/elichika-2026.11.04.2.apk

      - name: Prepare pinned private native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p "$RUNNER_TEMP/android-payload-benchmark-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker run --detach --privileged --name android-payload-benchmark \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-payload-benchmark-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell id >> evidence/host.txt

      - name: Run fixed-input baseline and optimized engine pair
        run: >-
          python3 -u tests/android_payload_upgrade_benchmark_pair.py
          --baseline baseline.apk --candidate-dir candidate
          --instrumentation-dir instrumentation --evidence evidence

      - name: Upload only synthetic benchmark reports and instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-payload-upgrade-paired-benchmark
          path: evidence/
          if-no-files-found: warn

      - name: Stop disposable Android container
        if: always()
        run: docker rm -f android-payload-benchmark || true
