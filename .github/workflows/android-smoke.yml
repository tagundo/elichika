name: Android ARM64 release smoke tests

on:
  workflow_call:
    inputs:
      candidate_sha256:
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true
      noop_probe_sha256:
        type: string
        required: true
      focused_header_diagnostic:
        type: boolean
        required: false
        default: false
      focused_header_font_scale:
        type: string
        required: false
        default: "1.0"

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prepare native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb apksigner
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/android-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker image inspect redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            --format '{{json .RepoDigests}} {{.Architecture}}' >> evidence/host.txt
          docker run --detach --privileged --name android-release-smoke \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0

      - name: Wait for Android boot and verify native ABI
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell id >> evidence/host.txt
          adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/android-boot.png

      - name: Confirm Android immersive-mode education for the test user
        run: |
          set -euo pipefail
          # The one-time system tutorial steals focus from fullscreen captures.
          # Acknowledge it on this disposable user without changing app assertions.
          adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r' > evidence/immersive-mode-confirmations-before.txt
          adb -s 127.0.0.1:5555 shell settings --user 0 put secure immersive_mode_confirmations confirmed
          adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r' | tee evidence/immersive-mode-confirmations-after.txt
          test "$(cat evidence/immersive-mode-confirmations-after.txt)" = confirmed

      - name: Use Chromium ANGLE for Redroid WebGL
        run: |
          set -euo pipefail
          # The pinned Redroid image's vendor ANGLE crashes compiling WebGL
          # shaders. WebView's own ANGLE uses the same CPU Vulkan device and
          # preserves the textured-render assertions used by the instrumentation checks.
          printf '%s\n' '_ --use-gl=angle --use-angle=vulkan --webview-verbose-logging' > "$RUNNER_TEMP/webview-command-line"
          adb -s 127.0.0.1:5555 push "$RUNNER_TEMP/webview-command-line" /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell chmod 644 /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell cat /data/local/tmp/webview-command-line > evidence/webview-command-line.txt

      - name: Download this build's signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate

      - name: Download the same-data APK version-change probe
        if: ${{ !inputs.focused_header_diagnostic }}
        uses: actions/download-artifact@v4
        with:
          name: elichika-revision-noop-probe-apk
          path: noop-probe

      - name: Download the latest official APK
        if: ${{ !inputs.focused_header_diagnostic }}
        run: >-
          curl --fail --location --retry 2 --output official.apk
          https://github.com/tagundo/elichika/releases/download/v2026.08.23.1/elichika-2026.08.23.1.apk

      - name: Test actual APK upgrade, accounts, services and gameplay APIs
        if: ${{ !inputs.focused_header_diagnostic }}
        run: >-
          python3 -u tests/android_release_smoke.py
          --old official.apk --candidate "candidate/elichika-${{ inputs.version_name }}.apk"
          --candidate-sha256 "${{ inputs.candidate_sha256 }}"
          --version-code "${{ inputs.version_code }}"
          --noop-probe-dir noop-probe
          --noop-probe-sha256 "${{ inputs.noop_probe_sha256 }}"
          --evidence evidence

      - name: Download native-package instrumentation
        uses: actions/download-artifact@v4
        with:
          name: elichika-native-test-apk
          path: instrumentation

      - name: Compare native header policies on the frozen APK
        if: ${{ inputs.focused_header_diagnostic }}
        timeout-minutes: 5
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
          EXPECTED_VERSION_NAME: ${{ inputs.version_name }}
          HEADER_DIAGNOSTIC_FONT_SCALE: ${{ inputs.focused_header_font_scale }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apks = list(Path('candidate').glob('*.apk'))
          assert len(apks) == 1 and apks[0].name == 'elichika-' + os.environ['EXPECTED_VERSION_NAME'] + '.apk'
          with apks[0].open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert actual == os.environ['EXPECTED_CANDIDATE_SHA']
          assert os.environ['HEADER_DIAGNOSTIC_FONT_SCALE'] in ('1.0', '1.2', '2.0')
          Path('evidence/focused-header-diagnostic-mode.json').write_text(json.dumps({
              'candidate_sha256': actual,
              'font_scale': float(os.environ['HEADER_DIAGNOSTIC_FONT_SCALE']),
              'scope': 'Fresh frozen APK; original native header versus test-only public START gravity setter. No product APK rebuild or release validation claim.',
              'does_not_replace_full_release_qa': True
          }, indent=2))
          PY
          adb -s 127.0.0.1:5555 install "candidate/elichika-${{ inputs.version_name }}.apk"
          adb -s 127.0.0.1:5555 shell pm grant com.tagundo.elichika android.permission.POST_NOTIFICATIONS
          adb -s 127.0.0.1:5555 shell appops set com.tagundo.elichika MANAGE_EXTERNAL_STORAGE allow
          adb -s 127.0.0.1:5555 install -r instrumentation/*.apk
          adb -s 127.0.0.1:5555 shell wm size | tr -d '\r' > evidence/header-display-before.txt
          adb -s 127.0.0.1:5555 shell wm density | tr -d '\r' >> evidence/header-display-before.txt
          previous_size=$(sed -n 's/^Override size: //p' evidence/header-display-before.txt)
          previous_density=$(sed -n 's/^Override density: //p' evidence/header-display-before.txt)
          previous_font_scale=$(adb -s 127.0.0.1:5555 shell settings get system font_scale | tr -d '\r')
          restore_header_display() {
            qa_exit_code=$?
            trap - EXIT
            qa_restore_failed=0
            if [[ -z "$previous_font_scale" || "$previous_font_scale" == "null" ]]; then
              adb -s 127.0.0.1:5555 shell settings delete system font_scale || qa_restore_failed=1
            else
              adb -s 127.0.0.1:5555 shell settings put system font_scale "$previous_font_scale" || qa_restore_failed=1
            fi
            adb -s 127.0.0.1:5555 shell wm density "${previous_density:-reset}" || qa_restore_failed=1
            adb -s 127.0.0.1:5555 shell wm size "${previous_size:-reset}" || qa_restore_failed=1
            if (( qa_restore_failed )); then exit 1; fi
            exit "$qa_exit_code"
          }
          trap restore_header_display EXIT
          adb -s 127.0.0.1:5555 shell wm size 1600x1000
          adb -s 127.0.0.1:5555 shell wm density 160
          adb -s 127.0.0.1:5555 shell settings put system font_scale "$HEADER_DIAGNOSTIC_FONT_SCALE"
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e requireWideUi true -e headerDiagnosticOnly true -e expectedFontScale "$HEADER_DIAGNOSTIC_FONT_SCALE" \
            -e class com.tagundo.elichika.MeshWebViewTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-header-diagnostic.txt
          python3 -c 'from pathlib import Path; text=Path("evidence/native-header-diagnostic.txt").read_text(); assert "OK (1 test)" in text and "FAILURES" not in text, text'

      - name: Exercise Python, console, multiwindow and service configuration
        if: ${{ !inputs.focused_header_diagnostic }}
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 install -r instrumentation/*.apk
          # These service-control checks intentionally require a stopped server.
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e allowPublicFixtureInstall true \
            -e class com.tagundo.elichika.ModelViewerWebViewTest,com.tagundo.elichika.ModelViewerAutoFaceTest,com.tagundo.elichika.ModelViewerRigTest,com.tagundo.elichika.ViewerPersistenceTest,com.tagundo.elichika.NativePythonTest,com.tagundo.elichika.PayloadFileHasherTest,com.tagundo.elichika.PayloadRevisionTest,com.tagundo.elichika.PayloadProgressTest,com.tagundo.elichika.ServerReadinessTest,com.tagundo.elichika.ConsoleLayoutTest,com.tagundo.elichika.WindowBusTest,com.tagundo.elichika.ServerPreparationTest,com.tagundo.elichika.ServerControlTest,com.tagundo.elichika.ServerConfigTest,com.tagundo.elichika.MeshWebViewTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-instrumentation.txt
          python3 -c 'from pathlib import Path; text=Path("evidence/native-instrumentation.txt").read_text(); assert "OK (30 tests)" in text and "FAILURES" not in text, text'

      - name: Verify and measure mod-preserving parallel merges in the signed APK
        if: ${{ !inputs.focused_header_diagnostic }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e payloadMergeBenchmark true \
            -e class com.tagundo.elichika.PayloadMergeBenchmarkTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-payload-merge-benchmark.txt
          python3 -c 'from pathlib import Path; text=Path("evidence/native-payload-merge-benchmark.txt").read_text(); assert "OK (1 test)" in text and "FAILURES" not in text, text'
          adb -s 127.0.0.1:5555 exec-out sh -c 'find /data/user/0/com.tagundo.elichika/cache -maxdepth 1 -type f -name "payload-merge-benchmark-*.json"' \
            | tr -d '\r' > evidence/payload-merge-report-files.txt
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          reports = Path('evidence/payload-merge-report-files.txt').read_text().splitlines()
          assert reports, 'The actual APK benchmark must retain its report'
          for name in reports:
              assert re.fullmatch(r'/data/user/0/com\.tagundo\.elichika/cache/payload-merge-benchmark-[0-9a-f-]+\.json', name), name
              raw = subprocess.check_output(['adb', '-s', '127.0.0.1:5555', 'exec-out', 'cat', name])
              report = json.loads(raw)
              assert report['status'] == 'PASS' and report['main_looper_responsive'], report['status']
              Path('evidence', Path(name).name).write_bytes(raw)
          PY

      - name: Exercise the same signed APK in a real wide Android window
        if: ${{ !inputs.focused_header_diagnostic }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 shell wm size | tr -d '\r' > evidence/wide-display-before.txt
          adb -s 127.0.0.1:5555 shell wm density | tr -d '\r' >> evidence/wide-display-before.txt
          previous_size=$(sed -n 's/^Override size: //p' evidence/wide-display-before.txt)
          previous_density=$(sed -n 's/^Override density: //p' evidence/wide-display-before.txt)
          previous_font_scale=$(adb -s 127.0.0.1:5555 shell settings get system font_scale | tr -d '\r')
          printf '%s\n' "$previous_font_scale" > evidence/wide-font-before.txt
          adb -s 127.0.0.1:5555 shell cmd uimode night | tr -d '\r' > evidence/wide-theme-before.txt
          previous_night_mode=$(sed -n 's/^Night mode: //p' evidence/wide-theme-before.txt)
          case "$previous_night_mode" in auto|no|yes|custom) ;; *) echo 'Could not read Android night mode'; exit 1 ;; esac
          restore_display() {
            qa_exit_code=$?
            trap - EXIT
            qa_restore_failed=0
            adb -s 127.0.0.1:5555 shell cmd uimode night "$previous_night_mode" || qa_restore_failed=1
            if [[ -z "$previous_font_scale" || "$previous_font_scale" == "null" ]]; then
              adb -s 127.0.0.1:5555 shell settings delete system font_scale || qa_restore_failed=1
            else
              adb -s 127.0.0.1:5555 shell settings put system font_scale "$previous_font_scale" || qa_restore_failed=1
            fi
            adb -s 127.0.0.1:5555 shell wm density "${previous_density:-reset}" || qa_restore_failed=1
            adb -s 127.0.0.1:5555 shell wm size "${previous_size:-reset}" || qa_restore_failed=1
            if (( qa_restore_failed )); then exit 1; fi
            exit "$qa_exit_code"
          }
          trap restore_display EXIT
          adb -s 127.0.0.1:5555 shell wm size 1600x1000
          adb -s 127.0.0.1:5555 shell wm density 160
          adb -s 127.0.0.1:5555 shell wm size > evidence/wide-display-active.txt
          adb -s 127.0.0.1:5555 shell wm density >> evidence/wide-display-active.txt
          # Fresh instrumentation launches use real Android font scaling. Never
          # force internal TabLayout paints to imitate the system configuration.
          adb -s 127.0.0.1:5555 shell cmd uimode night no
          for font_scale in 1.0 1.2 2.0; do
            adb -s 127.0.0.1:5555 shell settings put system font_scale "$font_scale"
            adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
            adb -s 127.0.0.1:5555 shell am instrument -w \
              -e requireWideUi true -e expectedFontScale "$font_scale" -e expectedNightMode no \
              -e class com.tagundo.elichika.MeshWebViewTest \
              com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "evidence/native-wide-ui-font-${font_scale}.txt"
            python3 -c 'import sys; from pathlib import Path; text=Path(sys.argv[1]).read_text(); assert "OK (1 test)" in text and "FAILURES" not in text, text' "evidence/native-wide-ui-font-${font_scale}.txt"
            adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/header-layout-wide-report.json > "evidence/header-layout-wide-font-${font_scale}.json"
            python3 -c 'import json,sys; from pathlib import Path; report=json.loads(Path(sys.argv[1]).read_text()); assert abs(report["systemFontScale"]-float(sys.argv[2]))<0.02, report' "evidence/header-layout-wide-font-${font_scale}.json" "$font_scale"
            adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/header-layout-wide.png > "evidence/header-layout-wide-font-${font_scale}.png"
            for header_state in stopped running preparing; do
              adb -s 127.0.0.1:5555 exec-out cat "/data/user/0/com.tagundo.elichika/cache/header-layout-state-${header_state}.png" \
                > "evidence/header-layout-state-${header_state}-font-${font_scale}.png"
            done
            adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/mesh-wide-tools-report.json > "evidence/mesh-wide-tools-font-${font_scale}.json"
            adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/mesh-wide-tools.png > "evidence/mesh-wide-tools-font-${font_scale}.png"
            if [[ "$font_scale" == "1.0" ]]; then
              cp "evidence/native-wide-ui-font-${font_scale}.txt" evidence/native-wide-ui.txt
              cp "evidence/mesh-wide-tools-font-${font_scale}.json" evidence/mesh-wide-tools-report.json
              cp "evidence/mesh-wide-tools-font-${font_scale}.png" evidence/mesh-wide-tools.png
            fi
          done

          # Keep all 117 light geometry cases, then exercise the same existing
          # method once with an actual dark Android configuration at font 1.0.
          adb -s 127.0.0.1:5555 shell settings put system font_scale 1.0
          adb -s 127.0.0.1:5555 shell cmd uimode night yes
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e requireWideUi true -e expectedFontScale 1.0 -e expectedNightMode yes \
            -e class com.tagundo.elichika.MeshWebViewTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-wide-ui-night-font-1.0.txt
          python3 -c 'from pathlib import Path; text=Path("evidence/native-wide-ui-night-font-1.0.txt").read_text(); assert "OK (1 test)" in text and "FAILURES" not in text, text'
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/header-layout-wide-report.json > evidence/header-layout-wide-night-font-1.0.json
          python3 -c 'import json; from pathlib import Path; report=json.loads(Path("evidence/header-layout-wide-night-font-1.0.json").read_text()); assert report["theme"]["night"] is True and abs(report["systemFontScale"]-1.0)<0.02, report'
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/header-layout-wide.png > evidence/header-layout-wide-night-font-1.0.png
          for header_state in stopped running preparing; do
            adb -s 127.0.0.1:5555 exec-out cat "/data/user/0/com.tagundo.elichika/cache/header-layout-state-${header_state}.png" \
              > "evidence/header-layout-state-${header_state}-night-font-1.0.png"
          done

      - name: Exercise normal viewer scrolling in a real tall portrait Android window
        if: ${{ !inputs.focused_header_diagnostic }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 shell wm size | tr -d '\r' > evidence/portrait-display-before.txt
          adb -s 127.0.0.1:5555 shell wm density | tr -d '\r' >> evidence/portrait-display-before.txt
          previous_size=$(sed -n 's/^Override size: //p' evidence/portrait-display-before.txt)
          previous_density=$(sed -n 's/^Override density: //p' evidence/portrait-display-before.txt)
          restore_display() {
            adb -s 127.0.0.1:5555 shell wm density "${previous_density:-reset}" || true
            adb -s 127.0.0.1:5555 shell wm size "${previous_size:-reset}" || true
          }
          trap restore_display EXIT
          adb -s 127.0.0.1:5555 shell wm size 900x2400
          adb -s 127.0.0.1:5555 shell wm density 320
          adb -s 127.0.0.1:5555 shell wm size > evidence/portrait-display-active.txt
          adb -s 127.0.0.1:5555 shell wm density >> evidence/portrait-display-active.txt
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e requirePortraitUi true \
            -e class com.tagundo.elichika.MeshWebViewTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-portrait-ui.txt
          python3 -c 'from pathlib import Path; text=Path("evidence/native-portrait-ui.txt").read_text(); assert "OK (1 test)" in text and "FAILURES" not in text, text'
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/viewer-portrait-scroll-report.json > evidence/viewer-portrait-scroll-report.json
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/viewer-portrait-scroll.png > evidence/viewer-portrait-scroll.png

      - name: Collect Android diagnostics
        if: always()
        run: |
          mkdir -p evidence
          docker logs android-release-smoke > evidence/container.log 2>&1 || true
          adb -s 127.0.0.1:5555 logcat -d > evidence/logcat.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell dumpsys webviewupdate > evidence/webview-provider.txt 2>&1 || true
          adb -s 127.0.0.1:5555 exec-out cat /sdcard/Download/sukusta/logs/elichika.log > evidence/server-console.txt 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/final-screen.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/payload-upgrade-status.png > evidence/payload-upgrade-status.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-qa.png > evidence/model-viewer.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-auto-face.png > evidence/model-viewer-auto-face.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-auto-face-disabled.png > evidence/model-viewer-auto-face-disabled.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-rig.png > evidence/model-viewer-rig.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-shader.png > evidence/model-viewer-shader.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-rig-report.json > evidence/model-viewer-rig-report.json 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-shader-report.json > evidence/model-viewer-shader-report.json 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/viewer-persistence-report.json > evidence/viewer-persistence-report.json 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/viewer-persistence.png > evidence/viewer-persistence.png 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/viewer-add-game-report.json > evidence/viewer-add-game-report.json 2>/dev/null || true
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/header-layout-narrow-report.json > evidence/header-layout-narrow-report.json 2>/dev/null || true
