name: Isolated GL SIFAS catalog QA

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact server candidate commit (40 hex digits)
        type: string
        required: true
      mode:
        description: Initial screen or allow the one-time stock CDN test
        type: choice
        options: [screen, assets]
        default: screen

permissions:
  contents: read

jobs:
  stock-gl:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    env:
      QA_MODE: ${{ inputs.mode }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Checkout isolated QA scripts
        uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false

      - name: Validate exact candidate reference
        run: '[[ $CANDIDATE_SHA =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout the exact server candidate and locked dependencies
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: candidate/go.mod
          cache-dependency-path: candidate/go.sum

      - name: Prepare the validated ARM host and diagnostics
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -s assets/db/gl/asset_a_en.db
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          sudo env ELICHIKA_APT_EVIDENCE="$GITHUB_WORKSPACE/evidence/apt" python3 android/ci/prepare_ubuntu_apt.py
          sudo apt-get update -qq
          sudo apt-get install -y adb apksigner tesseract-ocr
          df -h "$RUNNER_TEMP" | tee "$GITHUB_WORKSPACE/evidence/disk.txt"

      - name: Build and start the isolated candidate server
        working-directory: candidate
        timeout-minutes: 14
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -p 2 -o "$RUNNER_TEMP/elichika-game-qa" .
          mkdir -p static
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          screen = os.environ['QA_MODE'] == 'screen'
          default_cdn = 'https://llsifas.imsofucking.gay/static/'
          Path('config.json').write_text(json.dumps({
              'server_address': '127.0.0.1:8080', 'locales': 'en', 'timezone': 'UTC',
              'tutorial': False, 'cdn_server': 'elichika' if screen else default_cdn,
              'cdn_cache': not screen, 'cdn_partial_file_capability': 'has_range_api',
          }))
          PY
          if [[ $QA_MODE == screen ]]; then
            source_base='https://llsifas.imsofucking.gay/static/'
            while read -r pack bytes digest; do
              curl --silent --show-error --fail --location --proto '=https' --proto-redir '=https' \
                --max-time 30 --max-filesize "$bytes" --output "static/$pack" "$source_base$pack"
              printf '%s  static/%s\n' "$digest" "$pack" | sha256sum --check
            done <<'OPENING'
          6oy69z 116983 4b8eb4adbd2093c0339c6d9b19b6f9da63573e94becb9bffe834429d96f76ed4
          jjze2p 3041702 47ac807bd3c9b18b0e6e1b90f149eef1c2743cac2a4138ae102faa2299e5e9d5
          lijvp6 262654 dc2aa94f5d5b9cf78af1359e3d5649a559b953a61c6438658806ed3fc1bf7a9c
          yuro6n 19955 c5c5e5e4bcc9b46c65908991b402db0b2f39f221840204e99a47e31f15ca5106
          OPENING
          fi
          "$RUNNER_TEMP/elichika-game-qa" rebuild_assets > "$RUNNER_TEMP/rebuild-game-qa.log" 2>&1
          "$RUNNER_TEMP/elichika-game-qa" > "$RUNNER_TEMP/elichika-game-qa.log" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$RUNNER_TEMP/elichika-game-qa.pid"
          deadline=$((SECONDS + 300))
          until curl --silent --max-time 2 --output /dev/null http://127.0.0.1:8080/webui/user/; do
            kill -0 "$server_pid"
            (( SECONDS < deadline ))
            sleep 2
          done

      - name: Launch the verified native GL game on ARM64 Redroid
        timeout-minutes: 35
        env:
          ELICHIKA_GAME_QA_FOLLOWUP: ${{ github.workspace }}/qa/.github/qa/capture-stock-gl-screen.sh
        run: |
          set -euo pipefail
          plan="$GITHUB_WORKSPACE/qa/.github/qa/stock-gl-asset-plan.sh"
          if [[ $QA_MODE == assets && -f $plan ]]; then export ELICHIKA_GAME_QA_ASSET_PLAN="$plan"; fi
          script="$GITHUB_WORKSPACE/qa/.github/qa/launch-native-gl.sh"
          bash "$script" "$GITHUB_WORKSPACE/evidence" "$QA_MODE"
          grep -E ' [2][0][0] .*POST .*/(startup|login|signup)' "$RUNNER_TEMP/elichika-game-qa.log" >/dev/null ||
            grep -E ' [2][0][0] .*/static/.*/(masterdata_a_en|asset_a_en.db)' "$RUNNER_TEMP/elichika-game-qa.log" >/dev/null

      - name: Record sanitized server and client routing evidence
        if: always()
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$evidence"
          if [[ -f $RUNNER_TEMP/elichika-game-qa.log ]]; then
            grep -E 'server address|/login/(startup|login)|/bootstrap/|/asset/getPackUrl|/static/' \
              "$RUNNER_TEMP/elichika-game-qa.log" | tail -n 250 > "$evidence/server-routes.txt" || true
          fi
          if [[ -f $RUNNER_TEMP/rebuild-game-qa.log ]]; then
            tail -n 25 "$RUNNER_TEMP/rebuild-game-qa.log" > "$evidence/rebuild-tail.txt"
          fi
          if [[ -f $evidence/android-logcat.txt ]]; then
            grep -E 'Unity.*(Initialize engine version|GfxDevice|Renderer|OpenGL|Vulkan)|Fatal signal|EGL_BAD|AndroidRuntime.*FATAL EXCEPTION' \
              "$evidence/android-logcat.txt" | tail -n 250 > "$evidence/unity-graphics.txt" || true
            rm "$evidence/android-logcat.txt"
          fi
          rm -f "$evidence/android-properties.txt" "$evidence/android-activities.txt"
          if [[ -f $RUNNER_TEMP/elichika-game-qa.pid ]]; then
            kill "$(cat "$RUNNER_TEMP/elichika-game-qa.pid")" 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-gl-b25-catalog-qa
          path: evidence
          if-no-files-found: error
          retention-days: 3
