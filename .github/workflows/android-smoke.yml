name: Android ARM64 release smoke tests

on:
  workflow_call:
    inputs:
      candidate_sha256:
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true
      noop_probe_sha256:
        type: string
        required: true
      focused_header_diagnostic:
        type: boolean
        required: false
        default: false
      focused_header_font_scale:
        type: string
        required: false
        default: "1.0"

permissions:
  contents: read
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prepare native ARM64 Android host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y adb apksigner
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          mkdir -p evidence "$RUNNER_TEMP/android-data"
          uname -a > evidence/host.txt
          getconf PAGESIZE >> evidence/host.txt
          docker pull --platform linux/arm64 redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa
          docker image inspect redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            --format '{{json .RepoDigests}} {{.Architecture}}' >> evidence/host.txt
          docker run --detach --privileged --name android-release-smoke \
            --publish 127.0.0.1:5555:5555 \
            --volume "$RUNNER_TEMP/android-data:/data" \
            redroid/redroid@sha256:0a611199ba2e0b5d60af39b3327a517f6407231f4352114ed3bd3cbfe2be69aa \
            androidboot.use_memfd=true androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_fps=10 ro.secure=0

      - name: Wait for Android boot and verify native ABI
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 120); do
            adb connect 127.0.0.1:5555 >/dev/null || true
            if [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          adb -s 127.0.0.1:5555 shell getprop > evidence/android-properties.txt
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a
          adb -s 127.0.0.1:5555 shell id >> evidence/host.txt
          adb -s 127.0.0.1:5555 exec-out screencap -p > evidence/android-boot.png

      - name: Confirm Android immersive-mode education for the test user
        run: |
          set -euo pipefail
          # The one-time system tutorial steals focus from fullscreen captures.
          # Acknowledge it on this disposable user without changing app assertions.
          adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r' > evidence/immersive-mode-confirmations-before.txt
          adb -s 127.0.0.1:5555 shell settings --user 0 put secure immersive_mode_confirmations confirmed
          adb -s 127.0.0.1:5555 shell settings --user 0 get secure immersive_mode_confirmations | tr -d '\r' | tee evidence/immersive-mode-confirmations-after.txt
          test "$(cat evidence/immersive-mode-confirmations-after.txt)" = confirmed

      - name: Use Chromium ANGLE for Redroid WebGL
        run: |
          set -euo pipefail
          # The pinned Redroid image's vendor ANGLE crashes compiling WebGL
          # shaders. WebView's own ANGLE uses the same CPU Vulkan device and
          # preserves the textured-render assertions used by the instrumentation checks.
          printf '%s\n' '_ --use-gl=angle --use-angle=vulkan --webview-verbose-logging' > "$RUNNER_TEMP/webview-command-line"
          adb -s 127.0.0.1:5555 push "$RUNNER_TEMP/webview-command-line" /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell chmod 644 /data/local/tmp/webview-command-line
          adb -s 127.0.0.1:5555 shell cat /data/local/tmp/webview-command-line > evidence/webview-command-line.txt

      - name: Download this build's signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: elichika-release-apk
          path: candidate

      - name: Download the same-data APK version-change probe
        if: ${{ !inputs.focused_header_diagnostic }}
        uses: actions/download-artifact@v4
        with:
          name: elichika-revision-noop-probe-apk
          path: noop-probe

      - name: Download the latest official APK
        if: ${{ !inputs.focused_header_diagnostic }}
        run: >-
          curl --fail --location --retry 2 --output official.apk
          https://github.com/tagundo/elichika/releases/download/v2026.08.23.1/elichika-2026.08.23.1.apk

      - name: Test actual APK upgrade, accounts, services and gameplay APIs
        if: ${{ !inputs.focused_header_diagnostic }}
        run: >-
          python3 -u tests/android_release_smoke.py
          --old official.apk --candidate "candidate/elichika-${{ inputs.version_name }}.apk"
          --candidate-sha256 "${{ inputs.candidate_sha256 }}"
          --version-code "${{ inputs.version_code }}"
          --noop-probe-dir noop-probe
          --noop-probe-sha256 "${{ inputs.noop_probe_sha256 }}"
          --evidence evidence

      - name: Download native-package instrumentation
        uses: actions/download-artifact@v4
        with:
          name: elichika-native-test-apk
          path: instrumentation

      - name: Compare native header policies on the frozen APK
        if: ${{ inputs.focused_header_diagnostic }}
        timeout-minutes: 5
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
          EXPECTED_VERSION_NAME: ${{ inputs.version_name }}
          HEADER_DIAGNOSTIC_FONT_SCALE: ${{ inputs.focused_header_font_scale }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apks = list(Path('candidate').glob('*.apk'))
          assert len(apks) == 1 and apks[0].name == 'elichika-' + os.environ['EXPECTED_VERSION_NAME'] + '.apk'
          with apks[0].open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert actual == os.environ['EXPECTED_CANDIDATE_SHA']
          assert os.environ['HEADER_DIAGNOSTIC_FONT_SCALE'] in ('1.0', '1.2', '2.0')
          Path('evidence/focused-header-diagnostic-mode.json').write_text(json.dumps({
              'candidate_sha256': actual,
              'font_scale': float(os.environ['HEADER_DIAGNOSTIC_FONT_SCALE']),
              'scope': 'Fresh frozen APK; original native header versus test-only public START gravity setter. No product APK rebuild or release validation claim.',
              'does_not_replace_full_release_qa': True
          }, indent=2))
          PY
          adb -s 127.0.0.1:5555 install "candidate/elichika-${{ inputs.version_name }}.apk"
          adb -s 127.0.0.1:5555 shell pm grant com.tagundo.elichika android.permission.POST_NOTIFICATIONS
          adb -s 127.0.0.1:5555 shell appops set com.tagundo.elichika MANAGE_EXTERNAL_STORAGE allow
          adb -s 127.0.0.1:5555 install -r instrumentation/*.apk
          adb -s 127.0.0.1:5555 shell wm size | tr -d '\r' > evidence/header-display-before.txt
          adb -s 127.0.0.1:5555 shell wm density | tr -d '\r' >> evidence/header-display-before.txt
          previous_size=$(sed -n 's/^Override size: //p' evidence/header-display-before.txt)
          previous_density=$(sed -n 's/^Override density: //p' evidence/header-display-before.txt)
          previous_font_scale=$(adb -s 127.0.0.1:5555 shell settings get system font_scale | tr -d '\r')
          restore_header_display() {
            qa_exit_code=$?
            trap - EXIT
            qa_restore_failed=0
            if [[ -z "$previous_font_scale" || "$previous_font_scale" == "null" ]]; then
              adb -s 127.0.0.1:5555 shell settings delete system font_scale || qa_restore_failed=1
            else
              adb -s 127.0.0.1:5555 shell settings put system font_scale "$previous_font_scale" || qa_restore_failed=1
            fi
            adb -s 127.0.0.1:5555 shell wm density "${previous_density:-reset}" || qa_restore_failed=1
            adb -s 127.0.0.1:5555 shell wm size "${previous_size:-reset}" || qa_restore_failed=1
            if (( qa_restore_failed )); then exit 1; fi
            exit "$qa_exit_code"
          }
          trap restore_header_display EXIT
          adb -s 127.0.0.1:5555 shell wm size 1600x1000
          adb -s 127.0.0.1:5555 shell wm density 160
          adb -s 127.0.0.1:5555 shell settings put system font_scale "$HEADER_DIAGNOSTIC_FONT_SCALE"
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e requireWideUi true -e headerDiagnosticOnly true -e expectedFontScale "$HEADER_DIAGNOSTIC_FONT_SCALE" \
            -e class com.tagundo.elichika.MeshWebViewTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-header-diagnostic.txt
          python3 -c 'from pathlib import Path; text=Path("evidence/native-header-diagnostic.txt").read_text(); assert "OK (1 test)" in text and "FAILURES" not in text, text'

      - name: Exercise Python, console, multiwindow and service configuration
        if: ${{ !inputs.focused_header_diagnostic }}
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          adb -s 127.0.0.1:5555 install -r instrumentation/*.apk
          # These service-control checks intentionally require a stopped server.
          adb -s 127.0.0.1:5555 shell am force-stop com.tagundo.elichika
          adb -s 127.0.0.1:5555 shell am instrument -w \
            -e allowPublicFixtureInstall true \
            -e class com.tagundo.elichika.ModelViewerWebViewTest,com.tagundo.elichika.ModelViewerAutoFaceTest,com.tagundo.elichika.ModelViewerRigTest,com.tagundo.elichika.ViewerPersistenceTest,com.tagundo.elichika.NativePythonTest,com.tagundo.elichika.PayloadFileHasherTest,com.tagundo.elichika.PayloadRevisionTest,com.tagundo.elichika.PayloadProgressTest,com.tagundo.elichika.ServerReadinessTest,com.tagundo.elichika.ConsoleLayoutTest,com.tagundo.elichika.WindowBusTest,com.tagundo.elichika.ServerPreparationTest,com.tagundo.elichika.ServerControlTest,com.tagundo.elichika.ServerConfigTest,com.tagundo.elichika.MeshWebViewTest \
            com.tagundo.elichika.test/androidx.test.runner.AndroidJUnitRunner \
            | tee evidence/native-instrumentation.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('evidence/native-instrumentation.txt').read_text()
          # Preserve every prior case and add native partial graft + multi-ZIP updater cases.
          assert re.findall(r'(?m)^OK \((\d+) tests?\)\s*$', text) == ['35'] and 'FAILURES' not in text, text
          PY
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/files/native-texture65-report.json > evidence/native-texture65-report.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          report = json.loads(Path('evidence/native-texture65-report.json').read_text())
          assert report['status'] == 'PASS' and report['native_java_bridge'] is True, report
          assert report['application_id'] == 'com.tagundo.elichika', report
          assert report['apk_sha256'] == os.environ['EXPECTED_CANDIDATE_SHA'], report
          apks = list(Path('candidate').glob('*.apk'))
          assert len(apks) == 1
          with apks[0].open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == report['apk_sha256']
          with zipfile.ZipFile(apks[0]) as archive:
              assert hashlib.sha256(archive.read('lib/arm64-v8a/libelichika_texture65.so')).hexdigest() == report['executable_sha256']
          assert report['unity_format'] == 65 and report['crn_format'] == 12, report
          assert report['width'] == report['height'] == 16 and report['rgba_bytes'] == 1024, report
          assert report['fixture_sha256'] == 'd22610a543c19f361d896ce8225e800a0507154867760615673265b2cfb1b577', report
          assert report['rgba_sha256'] == '76a9cba0c36c189f976ac41793d14055407929beb4f142d17a2f8867dd6e479e', report
          assert report['display_rgba_sha256'] == '57b0febf48dfd82df66c88426f7677107ad0d48cf588233f044b59d6d817ebf9', report
          assert all(report[key] is True for key in ('production_single_flip', 'transparent_rgb_retained', 'invalid_dimensions_refused')), report
          mip_goldens = (
              (16, '67d75a329b0a72e9544ddc71e0e83f6a4cc74582a694209b1a9981d8d7bf70cf', '86057308524be9a5e43a22adcb7ac4380572c5cb95a6ab22e00b6ecaa78af44c'),
              (8, '4408294f1905631d095f012c88d90abb0504046e7e3274026d6e324e5ffd9496', '8405f5e5f26e562990376fb5fe60e46aadd9878294633309813d27d73ebeaebf'),
              (4, '7c176380ab026186839a000dc6a9ff5975a67378bdcd5deb613619ef0b1e80c4', '524eba9b0228fd65ce9143e7e237ac28b29417fa9a6c74cd32b2a4da636baea6'),
              (2, '7108bd2cae8b5c04b49f297e74ad12bbd298512018ba945cdd1bab9ecf220d7a', '45dd93b604b1017fe8849a75df63a5354c734c3a2f10947226f9ded5ae5188f9'),
              (1, '2c1d418829ea5941ce3ceca05e9adeba65e1ad1ad52e67972955f726d550fc31', '2c1d418829ea5941ce3ceca05e9adeba65e1ad1ad52e67972955f726d550fc31'),
          )
          authored = report['authored_mips']
          assert authored['fixture_sha256'] == '0ef12426c6703f658a12c7fc04f1fdbae73ca5d44164d965080be42a34db2552', report
          assert len(authored['levels']) == 5, report
          for level, (dimension, unflipped, displayed) in enumerate(mip_goldens):
              actual = authored['levels'][level]
              assert actual['level'] == level and actual['width'] == actual['height'] == dimension, report
              assert actual['rgba_bytes'] == dimension * dimension * 4, report
              assert actual['rgba_sha256'] == unflipped and actual['display_rgba_sha256'] == displayed, report
              assert actual['production_single_flip'] is True, report
          assert authored['invalid_level_refused'] is True and authored['invalid_python_level_refused'] is True, report
          PY
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-outline-controls-report.json > evidence/model-viewer-outline-controls-report.json
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-outline-controls.png > evidence/model-viewer-outline-controls.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path('evidence/model-viewer-outline-controls-report.json').read_text())
          assert report['status'] == 'PASS' and report['sourcePreserved'] and report['unrelatedAuthoringPreserved'], report
          assert Path('evidence/model-viewer-outline-controls.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          PY
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-game-physics-report.json > evidence/model-viewer-game-physics-report.json
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-game-physics.png > evidence/model-viewer-game-physics.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path('evidence/model-viewer-game-physics-report.json').read_text())
          assert report['status'] == 'PASS' and report['sourcePreserved'] is True and report['fixture'] == 'viewer_game_physics.unity', report
          assert all(report['checks'].get(name) is True for name in (
              'nativeDefault', 'singleJobAdvanced', 'groupJobAdvanced', 'pausedDebugPreserved',
              'seekPreservedParameters', 'modeSwitchPreservedParameters', 'frameRateRestored30')), report
          assert report['initial']['physics']['swingBone'] is True and report['initial']['physics']['swingCollider'] is True, report
          assert report['initial']['physics']['frameRate'] == 0 and report['initial']['controls']['frameRate'] == '0', report
          assert Path('evidence/model-viewer-game-physics.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          PY
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-detail-report.json > evidence/model-viewer-detail-report.json
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-detail.png > evidence/model-viewer-detail.png
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-absolute-outline.unity > evidence/model-viewer-absolute-outline.unity
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-absolute-outline-recipe.json > evidence/model-viewer-absolute-outline-recipe.json
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-extended-report.json > evidence/model-viewer-extended-report.json
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-extended.png > evidence/model-viewer-extended.png
          python3 - <<'PYQA'
          from pathlib import Path
          import json
          expected = {
              'detail': ('mouthCentroidDepth', 'absoluteOutline', 'sparseOutline', 'outlineUndoRedo', 'sourceCataloguePreserved', 'outlineSave', 'meshZoom', 'connectedSelection', 'selectionUndoRedo', 'viewOnlyPreservedGeometry'),
              'extended': ('physicsFreshOn', 'gazeOriginalPoses', 'gazePausedAndReset', 'poseComponentFilters', 'breastAutomaticLimits', 'breastDisableRestoresBaseline', 'precisePhysicsEditing', 'motionSourceSeparation', 'motionReloadPreservesEdits', 'importedMotionPlays', 'modelChangeRetainsLibrary', 'explicitClear'),
          }
          for name, keys in expected.items():
              report = json.loads(Path('evidence/model-viewer-' + name + '-report.json').read_text())
              assert report['status'] == 'PASS' and report['sourcePreserved'] is True, report
              assert set(report['checks']) == set(keys) and all(report['checks'][key] is True for key in keys), report
              assert Path('evidence/model-viewer-' + name + '.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          detail = json.loads(Path('evidence/model-viewer-detail-report.json').read_text())
          assert detail['absolute'] == [{'id': '0:0:1', 'factor': 1, 'absolute': 37}], detail
          assert detail['absoluteRecipe']['state']['outlines'] == detail['absolute'], detail
          assert detail['uvColor']['chosen'] == '#14b87a' and detail['uvColor']['before'] == detail['uvColor']['restored'] == detail['uvColor']['persisted'], detail
          assert detail['uvColor']['authoringPreserved'] is True and detail['uvColor']['viewsPreserved'] is True, detail
          gpu = detail['mouthGpu']
          assert gpu['status'] == 'PASS' and gpu['backendAdaptation'] is True and gpu['originalGameShaderParityEstablished'] is False, gpu
          assert gpu['fallbackUnchanged'] is True and gpu['viewport'] == [64, 64] and gpu['targetPixelTopLeft'] == [32, 32], gpu
          modes = {row['name']: row for row in gpu['results']}
          assert set(modes) == {'webgl2-mouth', 'webgl2-original', 'webgl1-mouth', 'webgl1-original'}, gpu
          for name, row in modes.items():
              assert row['actualWebGL2'] is name.startswith('webgl2') and row['samples'] == 4 and row['depthBits'] == 24, row
              assert row['vertices'] == 6 and row['triangles'] == 2 and len(row['observations']) == 6, row
              assert row['centroidCompiled'] is (name == 'webgl2-mouth'), row
              for item in row['observations']:
                  assert item['glError'] == 0, item
                  if name == 'webgl2-mouth':
                      assert item['compiledMain'] and all(program['version'].startswith('#version 300 es') and program['linked'] is True for program in item['compiledMain']), item
                      assert item['rgba'] == ([0, 0, 255, 255] if item['occluder'] == 'front' else [255, 0, 0, 255]), item
          assert modes['webgl1-mouth']['observations'] == modes['webgl1-original']['observations'], gpu
          outline = {row['name']: row for row in gpu['outlineResults']}
          assert set(outline) == set(modes) and gpu['outlineFallbackUnchanged'] is True, gpu
          for name, row in outline.items():
              adapted = name == 'webgl2-mouth'
              assert row['actualWebGL2'] is name.startswith('webgl2') and row['samples'] == 4 and row['depthBits'] == 24, row
              assert row['vertices'] == 6 and row['triangles'] == 2 and row['side'] == 'BackSide' and len(row['observations']) == 6, row
              assert all(row[key] is True for key in ('depthTest', 'depthWrite', 'stencilAlways', 'mainHidden')), row
              assert row['nativeVertexColor'] == [0, 1, 1, 1] and row['centroidCompiled'] is adapted and (adapted or row['originalProgramUnchanged'] is True), row
              reference = row['frontReferenceRGBA']
              assert len(reference) == 4 and reference[0] > 0 and reference[1:] == [0, 0, 255], row
              for item in row['observations']:
                  assert item['glError'] == 0 and item['compiledOutline'], item
                  assert all(program['linked'] is True and program['outlinePass'] is True and program['centroidDepth'] is adapted and (not adapted or program['version'].startswith('#version 300 es')) for program in item['compiledOutline']), item
                  if adapted:
                      assert item['rgba'] == ([0, 0, 255, 255] if item['occluder'] == 'front' else reference), item
          assert outline['webgl1-mouth']['observations'] == outline['webgl1-original']['observations'] and outline['webgl1-mouth']['frontReferenceRGBA'] == outline['webgl1-original']['frontReferenceRGBA'], gpu
          assert json.loads(Path('evidence/model-viewer-absolute-outline-recipe.json').read_text()) == detail['absoluteRecipe'], detail
          assert Path('evidence/model-viewer-absolute-outline.unity').stat().st_size > 0
          assert report['motionSourcePreserved'] is True and report['otherBodySourcePreserved'] is True
          ui_keys = ('accessoryFreshOpen', 'modelOnlyHeader', 'motionOnlyPoseList', 'modelHeaderUnchangedOnMotionImport', 'modelHeaderTracksBodyChange', 'modelHeaderRestored', 'motionListCleared', 'multipleModelCounts')
          assert set(report['uiChecks']) == set(ui_keys) and all(report['uiChecks'][key] is True for key in ui_keys), report
          assert report['freshDefaults']['accessoryOpen'] is True, report
          for snapshot in ('initial', 'beforeLibrary', 'imported', 'played', 'other', 'rebound', 'cleared', 'multiple', 'final'):
              value = report[snapshot]
              assert value['files']['modelPaths'] == value['state']['paths'] and value['files']['motionPaths'] == value['state']['motionLibraryPaths'], value
              assert value['files']['modelCount'] == len(value['state']['paths']) and value['files']['motionCount'] == len(value['state']['motionLibraryPaths']), value
              assert value['files']['modelListOwned'] is True and value['files']['motionListOwned'] is True, value
          PYQA
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-part-selection-report.json > evidence/model-viewer-part-selection-report.json
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-part-selection.png > evidence/model-viewer-part-selection.png
          adb -s 127.0.0.1:5555 exec-out cat /data/user/0/com.tagundo.elichika/cache/model-viewer-part-result.unity > evidence/model-viewer-part-result.unity
          python3 - <<'PYPART'
          from pathlib import Path
          import hashlib, json
          report = json.loads(Path('evidence/model-viewer-part-selection-report.json').read_text())
